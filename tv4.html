<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>AZKO SALES RANKING</title>

<style>

@font-face{
    font-family:'TTCommonsCondensed';
    src:url('https://putrasetya.github.io/font/TT%20Commons%20Pro%20Trial%20Condensed%20ExtraBold.woff2') format('woff2');
    font-weight:800;
    font-style:normal;
}


/* =====================================================
   RESET
===================================================== */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:'Segoe UI',Arial,sans-serif;
}


/* =====================================================
   BODY
   PREMIUM DARK BLUE
===================================================== */

body{

    width:100vw;
    height:100vh;

    background:
        radial-gradient(
            circle at 10% 10%,
            rgba(0,183,255,.16),
            transparent 30%
        ),

        radial-gradient(
            circle at 90% 85%,
            rgba(0,255,170,.10),
            transparent 28%
        ),

        linear-gradient(
            135deg,
            #071525 0%,
            #0b2036 45%,
            #102b46 100%
        );

    display:flex;
    justify-content:center;
    align-items:center;

    padding:15px;

    overflow:hidden;

    color:#ffffff;
}


/* =====================================================
   CONTAINER
===================================================== */

.container{

    width:100%;
    max-width:900px;
    height:100%;

    display:flex;
    flex-direction:column;

    justify-content:space-between;

}


/* =====================================================
   SLIDE
===================================================== */

.slide{

    width:100%;
    height:100%;

    display:none;
    flex-direction:column;

}


.slide.active{
    display:flex;
}


/* =====================================================
   HEADER
===================================================== */

.header{

    height:60px;

    visibility:hidden;

}


.title{

    font-family:'TTCommonsCondensed',Arial,sans-serif;

    font-weight:800;

    letter-spacing:3px;

    transform:scaleY(1.02);

}


/* =====================================================
   RANK GRID
===================================================== */

.rank-grid{

    display:flex;

    flex-direction:column;

    justify-content:flex-start;

    flex-grow:1;

    gap:3px;

    overflow:hidden;

}


/* =====================================================
   RANK CARD
   PREMIUM GLASS
===================================================== */

.rank-card{

    position:relative;

    background:
        linear-gradient(
            90deg,
            rgba(255,255,255,.98),
            rgba(237,246,252,.96)
        );

    padding:0 16px;

    height:4.5vh;

    min-height:30px;

    border-radius:13px;

    display:flex;

    align-items:center;

    box-shadow:
        0 3px 8px rgba(0,0,0,.20),
        inset 0 1px 0 rgba(255,255,255,.95);

    font-size:.85rem;

    font-weight:600;

    flex-shrink:0;

    overflow:hidden;

    color:#102030;

}


/* AKSEN KIRI */

.rank-card::before{

    content:"";

    position:absolute;

    left:0;
    top:0;

    width:4px;
    height:100%;

    background:#0ea5e9;

}


/* =====================================================
   RANK 1 — GOLD
===================================================== */

.rank-card.rank-1{

    background:
        linear-gradient(
            90deg,
            #fff7bd 0%,
            #ffe16b 22%,
            #f6c945 48%,
            #ffd967 75%,
            #e7ad20 100%
        );

    border:1px solid #f5c542;

    box-shadow:
        0 4px 16px rgba(245,197,66,.35),
        inset 0 1px 0 rgba(255,255,255,.85);

    color:#4a3300;

}


.rank-card.rank-1::before{

    background:#fff7a8;

    box-shadow:
        0 0 12px rgba(255,247,168,.9);

}


/* =====================================================
   RANK 2 — SILVER ICE
===================================================== */

.rank-card.rank-2{

    background:
        linear-gradient(
            90deg,
            #f8fbff 0%,
            #dce9f2 30%,
            #b8c9d6 55%,
            #eef5f9 80%,
            #b5c5d1 100%
        );

    border:1px solid #9db2c1;

    box-shadow:
        0 4px 14px rgba(151,178,195,.28),
        inset 0 1px 0 rgba(255,255,255,.95);

    color:#243746;

}


.rank-card.rank-2::before{

    background:#b9e9ff;

    box-shadow:
        0 0 10px rgba(89,205,255,.8);

}


/* =====================================================
   RANK 3 — ORANGE BRONZE
===================================================== */

.rank-card.rank-3{

    background:
        linear-gradient(
            90deg,
            #ffe0bd 0%,
            #f3b46e 25%,
            #d9823b 50%,
            #f2b77b 75%,
            #c86b2c 100%
        );

    border:1px solid #c66a2c;

    box-shadow:
        0 4px 14px rgba(217,130,59,.32),
        inset 0 1px 0 rgba(255,255,255,.7);

    color:#4b230d;

}


.rank-card.rank-3::before{

    background:#ffd1a6;

}


/* =====================================================
   BOTTOM 5
===================================================== */

.rank-card.bottom-5{

    background:
        linear-gradient(
            90deg,
            #67151c 0%,
            #8f2028 45%,
            #641017 100%
        );

    border:1px solid #a62b34;

    color:#ffffff;

    box-shadow:
        0 3px 10px rgba(220,38,38,.18),
        inset 0 1px 0 rgba(255,255,255,.10);

}


.rank-card.bottom-5::before{

    background:#ff5252;

    box-shadow:
        0 0 10px rgba(255,82,82,.8);

}


.rank-card.bottom-5 .rank-num,
.rank-card.bottom-5 .employee-name,
.rank-card.bottom-5 .sales,
.rank-card.bottom-5 .ach,
.rank-card.bottom-5 .proteksi,
.rank-card.bottom-5 .ach-proteksi,
.rank-card.bottom-5 .transaksi,
.rank-card.bottom-5 .ach-bulanan{

    color:#ffffff;

}


/* =====================================================
   RANK NUMBER
===================================================== */

.rank-num{

    width:30px;

    color:#425466;

    font-weight:800;

    flex-shrink:0;

}


/* =====================================================
   CHANGE
===================================================== */

.change{

    width:40px;

    font-size:.75rem;

    font-weight:700;

    flex-shrink:0;

}


.up{
    color:#16803c;
}


.down{
    color:#c53030;
}


.same{
    color:#8995a1;
}


/* =====================================================
   EMPLOYEE NAME
===================================================== */

.employee-name{

    flex-grow:1;

    color:#172b3a;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;

    font-weight:700;

}


/* =====================================================
   SALES
===================================================== */

.sales{

    width:110px;

    font-weight:800;

    color:#172b3a;

    margin-left:10px;

    white-space:nowrap;

    text-align:right;

    flex-shrink:0;

}


/* =====================================================
   ACH MTD
===================================================== */

.ach{

    width:85px;

    font-weight:800;

    color:#172b3a;

    margin-left:15px;

    white-space:nowrap;

    text-align:right;

    flex-shrink:0;

}


/* =====================================================
   PROTEKSI
===================================================== */

.proteksi{

    width:110px;

    font-weight:800;

    color:#172b3a;

    margin-left:15px;

    white-space:nowrap;

    text-align:right;

    flex-shrink:0;

}


/* =====================================================
   ACH PROTEKSI
===================================================== */

.ach-proteksi{

    width:85px;

    font-weight:800;

    color:#172b3a;

    margin-left:15px;

    white-space:nowrap;

    text-align:right;

    flex-shrink:0;

}


/* =====================================================
   TRANSAKSI
===================================================== */

.transaksi{

    width:110px;

    font-weight:800;

    color:#172b3a;

    margin-left:15px;

    white-space:nowrap;

    text-align:right;

    flex-shrink:0;

}


/* =====================================================
   ACH BULANAN
===================================================== */

.ach-bulanan{

    width:85px;

    font-weight:800;

    color:#172b3a;

    margin-left:15px;

    white-space:nowrap;

    text-align:right;

    flex-shrink:0;

}


/* =====================================================
   SLIDE 4 HEADER
===================================================== */

#slide4 .score-column-header{

    display:flex;

    align-items:center;

    width:100%;

    height:44px;

    margin-bottom:6px;

    padding:0 16px;

    font-family:
        'TTCommonsCondensed',
        Arial,
        sans-serif;

    font-size:1rem;

    font-weight:800;

    color:#dcecff;

    white-space:nowrap;

}


/* =====================================================
   NO
===================================================== */

#slide4 .score-rank-head{

    width:30px;

    flex-shrink:0;

    text-align:center;

}


/* =====================================================
   CHANGE
===================================================== */

#slide4 .score-change-head{

    width:40px;

    flex-shrink:0;

}


/* =====================================================
   NAMA
===================================================== */

#slide4 .score-name-head{

    flex:1;

    min-width:0;

    margin-left:0;

    padding-left:0;

    text-align:left;

}


/* =====================================================
   MONTH HEADER
===================================================== */

#slide4 .score-month-head{

    width:70px;

    flex-shrink:0;

    margin-left:8px;

    padding:0;

    text-align:center;

    font-size:0.68rem;

    letter-spacing:.5px;

    color:#9edcff;

}


/* =====================================================
   POINT HEADER
===================================================== */

#slide4 .score-point-head{

    width:70px;

    flex-shrink:0;

    margin-left:8px;

    padding:0;

    text-align:center;

    color:#ffd85c;

    font-size:1rem;

}


/* =====================================================
   DATA SLIDE 4
===================================================== */

#slide4 .rank-grid{

    height:calc(100vh - 75px);

    flex-grow:0;

    gap:3px;

    overflow:hidden;

}


#slide4 .rank-card{
    height:
        calc(
            (100vh - 75px - 32px)
            / 17
        );

    min-height:0;

    max-height:none;

    flex-shrink:0;

    font-size:.85rem;
}


/* =====================================================
   NAMA SLIDE 4
===================================================== */

#slide4 .employee-name{

    flex-grow:1;

    min-width:0;

    margin-left:0;

    padding-left:0;

    overflow:hidden;

    text-overflow:ellipsis;

    white-space:nowrap;

}


/* =====================================================
   BULAN
===================================================== */

#slide4 .score-month{
    width:70px;
    flex-shrink:0;
    margin-left:8px;
    text-align:center;
    font-size:.85rem;
    font-weight:800;
}


/* =====================================================
   POIN
===================================================== */

#slide4 .score-point{

    width:70px;

    flex-shrink:0;

    margin-left:8px;

    text-align:center;

    font-weight:900;

    color:#075985;

}


/* =====================================================
   ACH COLOR SLIDE 4
===================================================== */

#slide4 .score-month.ach-blue{

    background:
        linear-gradient(
            135deg,
            #0284c7,
            #38bdf8
        );

    color:#ffffff;

    border-radius:7px;

    box-shadow:
        0 0 8px rgba(14,165,233,.45);

}


#slide4 .score-month.ach-green{

    background:
        linear-gradient(
            135deg,
            #059669,
            #34d399
        );

    color:#ffffff;

    border-radius:7px;

    box-shadow:
        0 0 8px rgba(16,185,129,.40);

}


#slide4 .score-month.ach-yellow{

    background:
        linear-gradient(
            135deg,
            #f59e0b,
            #facc15
        );

    color:#422006;

    border-radius:7px;

    box-shadow:
        0 0 8px rgba(250,204,21,.35);

}


#slide4 .score-month.ach-red{

    background:
        linear-gradient(
            135deg,
            #dc2626,
            #f87171
        );

    color:#ffffff;

    border-radius:7px;

    box-shadow:
        0 0 8px rgba(239,68,68,.35);

}


/* =====================================================
   LOADING
===================================================== */

.loading{

    text-align:center;

    padding:20px;

    font-weight:600;

    color:#b9d7eb;

}


/* =====================================================
   ERROR
===================================================== */

.error{

    text-align:center;

    padding:20px;

    font-weight:600;

    color:#ff8585;

}


/* =====================================================
   MOBILE / TABLET
===================================================== */

@media (
    max-width:768px
),
(
    max-aspect-ratio:1/1
){

    body{

        height:auto;

        min-height:100vh;

        overflow:auto;

        align-items:flex-start;

    }


    .container{

        height:auto;

        justify-content:flex-start;

        gap:10px;

    }


    .title{

        font-size:1.5rem;

    }


    .rank-grid{

        gap:6px;

        overflow:visible;

    }


    .rank-card{

        height:42px;

        font-size:.9rem;

        padding:0 10px;

    }


    .rank-num{

        width:28px;

    }


    .change{

        width:38px;

    }


    .sales{

        width:95px;

        margin-left:8px;

    }


    .ach{

        width:70px;

        margin-left:10px;

    }


    .proteksi{

        width:95px;

        margin-left:8px;

    }


    .ach-proteksi{

        width:70px;

        margin-left:10px;

    }


    .transaksi{

        width:95px;

        margin-left:8px;

    }


    .ach-bulanan{

        width:70px;

        margin-left:10px;

    }

}


/* =====================================================
   TV 43 INCH
===================================================== */

@media screen
and (min-width:1200px)
and (orientation:landscape){

    body{

        background:

            radial-gradient(
                circle at 8% 8%,
                rgba(0,191,255,.18),
                transparent 28%
            ),

            radial-gradient(
                circle at 92% 90%,
                rgba(0,255,170,.12),
                transparent 28%
            ),

            linear-gradient(
                135deg,
                #061321,
                #0b2137 50%,
                #0d2942
            );

        padding:10px;

    }


    .container{

        max-width:1100px;

    }


    .header{

        margin-bottom:5px;

    }


    .title{

        font-size:1.8rem;

        color:#e4f4ff;

    }


    .rank-grid{

        gap:3px;

        overflow:hidden;

    }


    .rank-card{

        background:
            linear-gradient(
                90deg,
                #f9fcff,
                #eaf3f8
            );

        border-color:#c7d8e2;

        box-shadow:
            0 2px 6px
            rgba(0,0,0,.20);

        border-radius:12px;

        color:#203342;

    }


    .rank-card.rank-1{

        background:
            linear-gradient(
                90deg,
                #fff7bd,
                #f6c945,
                #ffe27a,
                #dfa91e
            ) !important;

        border-color:#e8b82c;

    }


    .rank-card.rank-2{

        background:
            linear-gradient(
                90deg,
                #f7fbff,
                #c8d7e1,
                #edf4f8,
                #aebfca
            ) !important;

        border-color:#98acb9;

    }


    .rank-card.rank-3{

        background:
            linear-gradient(
                90deg,
                #ffe1c1,
                #d9823b,
                #efa96a,
                #c2672c
            ) !important;

        border-color:#c56b30;

    }


    .rank-card.bottom-5{

        background:
            linear-gradient(
                90deg,
                #711820,
                #961f2a,

            ) !important;

    }


    .employee-name,
    .sales,
    .ach,
    .proteksi,
    .ach-proteksi,
    .transaksi,
    .ach-bulanan{

        color:#203342;

    }


    .rank-card.bottom-5 .employee-name,
    .rank-card.bottom-5 .sales,
    .rank-card.bottom-5 .ach,
    .rank-card.bottom-5 .proteksi,
    .rank-card.bottom-5 .ach-proteksi,
    .rank-card.bottom-5 .transaksi,
    .rank-card.bottom-5 .ach-bulanan{

        color:#ffffff;

    }


    .rank-num{

        color:#526777;

    }


    .rank-card.bottom-5 .rank-num{

    }


    .up{

    }


    .down{

        color:#b91c1c;

    }


    .same{

        color:#71808b;

    }


    /* =============================================
   SLIDE 2 — FIX 17 RANK AGAR NOMOR 17 TIDAK TERPOTONG
============================================= */

#slide2{
    height:100%;
    min-height:0;
}

#slide2 .rank-grid{
    display:flex;
    flex-direction:column;

    gap:3px;

    height:
        calc(100vh - 75px - 32px);

    flex:none;

    overflow:hidden;
}

#slide2 .rank-card{

    height:
        calc(
            (100vh - 75px - 32px - 48px)
            / 17
        );

    min-height:0;
    max-height:none;

    flex:none;

    padding-top:0;
    padding-bottom:0;
}
    /* =============================================
       SLIDE 1 & 3
    ============================================= */

    #slide1 .rank-card,
    #slide3 .rank-card{

        height:
            calc(
                (100vh - 75px - 32px)
                / 17
            );

        min-height:0;

        flex-shrink:0;

    }

}


/* =====================================================
   TV SMALL
===================================================== */

@media screen
and (min-width:1000px)
and (max-width:1199px)
and (orientation:landscape){

    .rank-card{

        height:4.2vh;

    }

}


/* =====================================================
   TV EXTRA LARGE
===================================================== */

@media screen
and (min-width:1800px)
and (orientation:landscape){

    .container{

        max-width:1250px;

    }


    .title{

        font-size:2rem;

    }


    .rank-card{

        font-size:.9rem;

    }

}


/* =====================================================
   HIDE CHANGE
===================================================== */

.change{

    display:none !important;

}


/* =====================================================
   REALTIME CLOCK
===================================================== */

.realtime-clock{

    position:fixed;

    top:10px;
    right:20px;

    font-family:
        'TTCommonsCondensed',
        Arial,
        sans-serif;

    font-size:1.3rem;

    font-weight:800;

    color:#dff6ff;

    letter-spacing:1.5px;

    z-index:9999;

    background:
        linear-gradient(
            135deg,
            rgba(11,47,72,.92),
            rgba(9,31,50,.92)
        );

    padding:5px 12px;

    border-radius:9px;

    border:1px solid rgba(92,211,255,.35);

    box-shadow:
        0 3px 12px rgba(0,0,0,.30),
        0 0 12px rgba(0,174,255,.12);

}


/* =====================================================
   SLIDE TABS
===================================================== */

.slide-tabs{

    position:fixed;

    top:10px;
    left:20px;

    display:flex;

    gap:8px;

    z-index:9999;

}


/* =====================================================
   TAB
===================================================== */

.slide-tab{

    font-family:
        'TTCommonsCondensed',
        Arial,
        sans-serif;

    font-size:1rem;

    font-weight:800;

    background:
        linear-gradient(
            135deg,
            rgba(20,51,76,.92),
            rgba(8,31,50,.92)
        );

    color:#c9e7f7;

    padding:8px 14px;

    border-radius:8px;

    border:1px solid
        rgba(104,194,232,.20);

    box-shadow:
        0 3px 10px rgba(0,0,0,.22);

    transition:
        all .3s ease;

}


/* =====================================================
   TAB ACTIVE
===================================================== */

.slide-tab.active{

    background:
        linear-gradient(
            135deg,
            #f3c63f,
            #ffe37a,
            #e8ad24
        );

    color:#432f00;

    border:1px solid #ffd85c;

    box-shadow:
        0 0 18px
        rgba(255,211,72,.45),
        0 4px 10px
        rgba(0,0,0,.20);

    transform:scale(1.05);

}


/* =====================================================
   DATE
===================================================== */

.realtime-date{

    position:fixed;

    top:10px;
    left:20px;

    font-family:
        'TTCommonsCondensed',
        Arial,
        sans-serif;

    font-size:1.3rem;

    font-weight:800;

    color:#dff6ff;

    letter-spacing:.8px;

    z-index:9999;

    background:
        rgba(10,35,55,.85);

    padding:4px 10px;

    border-radius:8px;

    box-shadow:
        0 2px 6px rgba(0,0,0,.18);

}


/* =====================================================
   HIDE DATE
===================================================== */

.realtime-date{

    display:none !important;

}


/* =====================================================
   MONTH COMMON
===================================================== */

.july,
.august,
.september,
.october,
.november,
.december,
.point{

    width:70px;

    text-align:center;

    font-weight:800;

    flex-shrink:0;

}


/* =====================================================
   SLIDE 4 CARD ACCENT
===================================================== */

#slide4 .rank-card::after{

    content:"";

    position:absolute;

    right:0;
    top:0;

    width:3px;
    height:100%;

    background:
        linear-gradient(
            180deg,
            #22c1ff,
            #00e5a0
        );

    opacity:.7;

}


/* =====================================================
   SLIDE 4 POIN
===================================================== */

#slide4 .score-point{

    background:
        linear-gradient(
            135deg,
            #e0f7ff,
            #bdefff
        );

    border-radius:7px;

    padding:2px 5px;

    box-shadow:
        inset 0 0 0 1px
        rgba(14,165,233,.12);

}


/* =====================================================
   BOTTOM 5 POINT
===================================================== */

#slide4 .bottom-5 .score-point{

    background:
        rgba(255,255,255,.14);

    color:#ffffff;

}


/* =====================================================
   GOLD POINT
===================================================== */

#slide4 .rank-1 .score-point{

    background:
        linear-gradient(
            135deg,
            #fff5ad,
            #ffd84d
        );

    color:#4a3300;

}


/* =====================================================
   SILVER POINT
===================================================== */

#slide4 .rank-2 .score-point{

    background:
        linear-gradient(
            135deg,
            #f7fbff,
            #cbdbe5
        );

    color:#263746;

}


/* =====================================================
   BRONZE POINT
===================================================== */

#slide4 .rank-3 .score-point{

    background:
        linear-gradient(
            135deg,
            #ffe6c9,
            #efa86c
        );

    color:#4b230d;

}


/* ====================================================
   BWF INSPIRED — SLIDE 1 / 2 / 3 ONLY
   Slide 4 retains its existing appearance and logic.
==================================================== */
#slide1,#slide2,#slide3{min-height:0;overflow:hidden}
#slide1 .header,#slide2 .header,#slide3 .header{
 visibility:visible!important;height:19%;min-height:0;flex:0 0 19%;display:flex;align-items:flex-end;

        if(

/* =====================================================
   CELL VALUE
===================================================== */

function getCellValue(cell){

    if(!cell){

        return "";

    }


    return String(
        cell.f ??
        cell.v ??
        ""
    ).trim();

}


function findColumn(columns,target){

    const normalizeHeader =
        value => {

            return String(
                value || ""
            )
            .replace(
                /\u00A0/g,
                " "
            )
            .replace(
                /\s+/g,
                " "
            )
            .trim()
            .toUpperCase();

        };


    const targetHeader =
        normalizeHeader(target);


    return columns.findIndex(
        col =>
            normalizeHeader(
                col.label
            ) ===
            targetHeader
    );

}


/* =====================================================
   LOAD MONTHLY SHEET
===================================================== */

async function loadMonthlySheet(sheetName){

    const url =

        "https://docs.google.com/spreadsheets/d/" +

        SPREADSHEET_ID +

        "/gviz/tq?tqx=out:json&sheet=" +

        encodeURIComponent(sheetName) +

        "&t=" +

        Date.now();


    const response =
        await fetch(
            url,
            {
                cache:"no-store"
            }
        );


    if(!response.ok){

        throw new Error(
            `Sheet "${sheetName}" tidak dapat diakses.`
        );

    }


    const text =
        await response.text();


    let jsonText =
        text.trim();


    jsonText =
        jsonText.replace(
            /^\/\*[\s\S]*?\*\/\s*/,
            ""
        );


    const start =
        jsonText.indexOf("{");


    const end =
        jsonText.lastIndexOf("}");


    if(
        start === -1 ||
        end === -1
    ){

        throw new Error(
            `Format data sheet "${sheetName}" tidak valid.`
        );

    }


    jsonText =
        jsonText.substring(
            start,
            end + 1
        );


    const data =
        JSON.parse(
            jsonText
        );


    if(
        !data ||
        !data.table ||
        !data.table.cols
    ){

        throw new Error(
            `Data sheet "${sheetName}" tidak ditemukan.`
        );

    }


    const employeeColumn =
        findColumn(
            data.table.cols,
            "EMPLOYEE NAME"
        );


    const achColumn =
        findColumn(
            data.table.cols,
            "ACH MTD"
        );


    const targetTrxColumn =
        findColumn(
            data.table.cols,
            "TARGET TRX"
        );


    const trxMtdColumn =
        findColumn(
            data.table.cols,
            "TRX MTD"
        );


    const targetBsColumn =
        findColumn(
            data.table.cols,
            "TARGET BS"
        );


    const basketSizeColumn =
        findColumn(
            data.table.cols,
            "BASKET SIZE"
        );


    const requiredColumns = [

        [
            employeeColumn,
            "EMPLOYEE NAME"
        ],

        [
            achColumn,
            "ACH MTD"
        ],

        [
            targetTrxColumn,
            "TARGET TRX"
        ],

        [
            trxMtdColumn,
            "TRX MTD"
        ],

        [
            targetBsColumn,
            "TARGET BS"
        ],

        [
            basketSizeColumn,
            "BASKET SIZE"
        ]

    ];


    for(
        const [
            index,
            header
        ]
        of requiredColumns
    ){

        if(index === -1){

            throw new Error(
                `Header "${header}" tidak ditemukan di ${sheetName}`
            );

        }

    }


    const result = {};


    data.table.rows.forEach(
        row => {

            if(
                !row ||
                !row.c
            ){

                return;

            }


            const employeeName =
                getCellValue(
                    row.c[
                        employeeColumn

            if(!employeeName){

                return;

                    ]
                );

                getCellValue(
                    row.c[
                        targetTrxColumn
                    ]
                );

                    row.c[
                        trxMtdColumn
                    ]
                );

                    row.c[
                        targetBsColumn
                    ]
                );


            const basketSize =
                getCellValue(
                    row.c[
                        basketSizeColumn
                    ]
                );


            const key =
                normalizeEmployeeName(
                    employeeName
                );


            result[key] = {

                ach:ach,

                targetTrx:targetTrx,

                trxMtd:trxMtd,

                targetBs:targetBs,

                basketSize:basketSize

            };

        }
    );


    console.log(
        `DATA SHEET BULANAN: ${sheetName}`,
        result
    );


    return result;

/* =====================================================

===================================================== */

function normalizeEmployeeName(name){

    return String(
        name || ""

    .trim()
    .replace(
        /\s+/g,
        " "

    .toUpperCase();

}


/* =====================================================
   ACH CLASS
===================================================== */

function getAchClass(value){

    if(
        value === null ||
        value === undefined ||
        value === "" ||
        value === "-"
    ){

        return "";

    }


    let text =
        String(value)
            .replace("%","")
            .replace(",",".")
            .trim();


    let percentage =
        parseFloat(text);


    if(isNaN(percentage)){

        return "";

    }


    if(percentage > 100){

        return "ach-blue";

    }


    if(percentage >= 95){

        return "ach-green";

    }


    if(percentage > 85){

        return "ach-yellow";

    }


    return "ach-red";

}


/* =====================================================
   HITUNG POIN
===================================================== */

function calculateMonthlyPoint(monthlyData){

    if(!monthlyData){

        return 0;

    }


    let point = 0;


    const ach =
        parseNumber(
            monthlyData.ach
        );


    const hasAch =
        monthlyData.ach !== "" &&
        monthlyData.ach !== "-";


    if(hasAch){

        if(ach < 85){

            point -= 1;

        }

        else if(
            ach >= 85 &&
            ach < 95
        ){

            point += 1;

        }

        else if(
            ach >= 95 &&
            ach <= 100
        ){

            point += 2;

        }

        else if(
            ach > 100
        ){

            point += 3;

        }

    }


    const trxMtd =
        parseNumber(
            monthlyData.trxMtd
        );


    const targetTrx =
        parseNumber(
            monthlyData.targetTrx
        );


    const hasTrx =
        monthlyData.trxMtd !== "" &&
        monthlyData.trxMtd !== "-" &&
        monthlyData.targetTrx !== "" &&
        monthlyData.targetTrx !== "-";


    if(hasTrx){

        if(
            trxMtd >
            targetTrx
        ){

            point += 1;

        }

    }


    const basketSize =
        parseNumber(
            monthlyData.basketSize
        );


    const targetBs =
        parseNumber(
            monthlyData.targetBs
        );


    const hasBasket =
        monthlyData.basketSize !== "" &&
        monthlyData.basketSize !== "-" &&
        monthlyData.targetBs !== "" &&
        monthlyData.targetBs !== "-";


    if(hasBasket){

        if(
            basketSize >
            targetBs
        ){

            point += 1;

        }

    }


    return point;

}

function renderCards(gridId,data,type){

 if(!data.length){grid.innerHTML='<div class="error">Tidak ada data employee.</div>';return;}

 });

/* =====================================================
   PARSE NUMBER
===================================================== */

function parseNumber(value){

    if(
        value === null ||
        value === undefined ||
        value === ""
    ){

        return 0;

    }


    if(
        typeof value === "number"
    ){

        return value;

    }


    let text =
        String(value)
            .trim()
            .replace(
                /\u00A0/g,
                " "
            )
            .replace(
                /%/g,
                ""
            )
            .replace(
                /Rp/gi,
                ""
            )
            .replace(
                /\s/g,
                ""
            );


    if(
        text === "" ||
        text === "-"
    ){

        return 0;

    }


    if(
        text.includes(",") &&
        text.includes(".")
    ){

        text =
            text
                .replace(/\./g,"")
                .replace(",", ".");

    }

    else if(
        text.includes(",")
    ){

        const parts =
            text.split(",");


        if(
            parts.length === 2 &&
            parts[1].length <= 2
        ){

            text =
                parts[0] +
                "." +
                parts[1];

        }

        else{

            text =
                text.replace(
                    /,/g,
                    ""
                );

        }

    }

    else if(
        text.includes(".")
    ){

        const parts =
            text.split(".");


        if(
            parts.length === 2 &&
            parts[1].length <= 2
        ){

        }

        else{

            text =
                text.replace(
                    /\./g,
                    ""
                );

        }

    }


    const number =
        parseFloat(text);


    return isNaN(number)
        ? 0
        : number;

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(text){

    const div =
        document.createElement(
            "div"
        );


    div.textContent =
        text;


    return div.innerHTML;

}

/* =====================================================
   NEXT SLIDE
===================================================== */

function nextSlide(){

    document
        .getElementById(
            "slide" +
            currentSlide
        )
        .classList
        .remove(
            "active"
        );


    currentSlide++;


    if(
        currentSlide > 4
    ){

        currentSlide = 1;

    }


    document
        .getElementById(
            "slide" +
            currentSlide
        )
        .classList
        .add(
            "active"
        );


    updateSlideTabs();

}


/* =====================================================
   UPDATE TAB
===================================================== */

function updateSlideTabs(){

    document
        .querySelectorAll(
            '.slide-tab'
        )
        .forEach(
            tab =>
                tab.classList.remove(
                    'active'
                )
        );


    const activeTab =
        document.querySelector(
            `.slide-tab[data-slide="${currentSlide}"]`
        );


    if(activeTab){

        activeTab.classList.add(
            'active'
        );

    }

}


/* =====================================================
   TAB CLICK
===================================================== */

document
    .querySelectorAll(
        '.slide-tab'
    )
    .forEach(
        tab => {

            tab.style.cursor =
                'pointer';


            tab.addEventListener(
                'click',
                () => {

                    const targetSlide =
                        parseInt(
                            tab.dataset.slide
                        );


                    if(
                        targetSlide ===
                        currentSlide
                    ){

                        return;

                    }


                    document
                        .getElementById(
                            "slide" +
                            currentSlide
                        )
                        .classList
                        .remove(
                            "active"
                        );


                    currentSlide =
                        targetSlide;


                    document
                        .getElementById(
                            "slide" +
                            currentSlide
                        )
                        .classList
                        .add(
                            "active"
                        );


                    updateSlideTabs();


                    startSlideTimer();

                }
            );

        }
    );

        );
