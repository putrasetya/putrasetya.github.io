<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AZKO ULTRA TV DISPLAY</title>

<link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap"
    rel="stylesheet"
>

<style>

/* =========================================================
   RESET
========================================================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
}

body {
    font-family: "Poppins", sans-serif;
    overflow: hidden;
    color: #fff;
    cursor: pointer;

    background:
        linear-gradient(
            rgba(0, 0, 0, .25),
            rgba(0, 0, 0, .25)
        ),
        url("https://putrasetya.github.io/backgroundtv.png");

    background-position: center center;
    background-repeat: no-repeat;
    background-size: cover;
}


/* =========================================================
   GLOBAL TEXT
========================================================= */

body * {
    color: #fff !important;
}

.employee-name,
.employee-label,
.score-value,
.score-label,
.header h1,
.header p {
    text-shadow: 0 2px 6px rgba(0, 0, 0, .9);
}

.ach-green {
    color: #dcfce7 !important;
}

.ach-red {
    color: #ffe4e6 !important;
}


/* =========================================================
   BACKGROUND EFFECT
========================================================= */

body::before {
    content: "";
    position: fixed;
    inset: 0;

    background:
        linear-gradient(
            135deg,
            rgba(255, 255, 255, .03),
            transparent 35%,
            rgba(255, 255, 255, .02)
        );

    pointer-events: none;
    z-index: -2;
}

body::after {
    content: "";
    position: fixed;

    width: 200%;
    height: 200%;

    top: -50%;
    left: -50%;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255, 255, 255, .04),
            transparent
        );

    transform: rotate(25deg);

    pointer-events: none;
    z-index: -1;
}


/* =========================================================
   SLIDE
========================================================= */

.slide {
    position: absolute;
    inset: 0;

    width: 100vw;
    height: 100vh;

    padding: 1vh 2vw;

    display: flex;
    flex-direction: column;

    opacity: 0;
    visibility: hidden;
    pointer-events: none;

    transition: opacity .5s linear;
}

.slide.active {
    opacity: 1;
    visibility: visible;
    pointer-events: auto;
}


/* =========================================================
   HEADER
========================================================= */

.header {
    text-align: center;
    margin-bottom: 1vh;
}

.header h1 {
    font-size: 3vw;
    font-weight: 900;
    letter-spacing: 6px;
    text-transform: uppercase;
    color: #000;
}

.header p {
    margin-top: .2vh;
    font-size: 1vw;
    letter-spacing: 4px;
    color: #000;
    opacity: .9;
}


/* =========================================================
   PAUSE INDICATOR
========================================================= */

.pause-indicator {
    position: fixed;

    top: 20px;
    left: 20px;

    z-index: 9999;

    padding: 14px 24px;

    border-radius: 18px;

    background:
        linear-gradient(
            135deg,
            rgba(15, 23, 42, .92),
            rgba(30, 41, 59, .92)
        );

    border: 1px solid rgba(255, 255, 255, .15);

    font-size: 14px;
    font-weight: 800;
    letter-spacing: 2px;

    box-shadow: 0 10px 30px rgba(0, 0, 0, .45);

    opacity: 0;

    transform: translateY(-20px);

    transition: .35s ease;
}

.pause-indicator.show {
    opacity: 1;
    transform: translateY(0);
}


/* =========================================================
   RANK LIST
========================================================= */

.rank-list {
    display: flex;
    flex-direction: column;

    gap: 1.2vh;

    flex: 1;

    justify-content: space-evenly;
}


/* =========================================================
   RANK CARD
========================================================= */

.rank-card {
    position: relative;

    display: flex;
    align-items: center;

    height: 25vh;

    border-radius: 34px;
    overflow: hidden;

    border: 1px solid rgba(255, 255, 255, .08);

    opacity: 0;

    transform: translateX(-40px);

    will-change: auto;
}

.rank-card.show {
    animation: slideRight .5s forwards;
}

.rank-card:nth-child(1) {
    animation-delay: .1s;
}

.rank-card:nth-child(2) {
    animation-delay: .2s;
}

.rank-card:nth-child(3) {
    animation-delay: .3s;
}

@keyframes slideRight {
    from {
        opacity: 0;
        transform: translateX(-40px);
    }

    to {
        opacity: 1;
        transform: translateX(0);
    }
}


/* =========================================================
   TOP COLORS
========================================================= */

.gold {
    background:
        linear-gradient(
            135deg,
            #6b5300,
            #d4a514,
            #fff0a6,
            #d4a514,
            #6b5300
        );
}

.silver {
    background:
        linear-gradient(
            135deg,
            #737373,
            #d1d5db,
            #fff,
            #d1d5db,
            #737373
        );
}

.bronze {
    background:
        linear-gradient(
            135deg,
            #6d3f1d,
            #c87c3d,
            #efc08c,
            #c87c3d,
            #6d3f1d
        );
}


/* =========================================================
   BOTTOM COLORS
========================================================= */

.red-high {
    background:
        linear-gradient(
            135deg,
            #7f1d1d,
            #b91c1c,
            #dc2626,
            #ef4444,
            #f87171
        );
}

.red-mid {
    background:
        linear-gradient(
            135deg,
            #4a0404,
            #7f1d1d,
            #b91c1c,
            #dc2626,
            #ef4444
        );
}

.red-low {
    background:
        linear-gradient(
            135deg,
            #2b0000,
            #4a0404,
            #7f1d1d,
            #991b1b,
            #b91c1c
        );
}


/* =========================================================
   RANK NUMBER
========================================================= */

.rank-number {
    position: absolute;

    left: -.5vw;
    top: 50%;

    transform:
        translateY(-50%)
        skew(-10deg);

    font-size: 16vw;
    font-weight: 900;

    opacity: .20;

    letter-spacing: -10px;
}

.gold .rank-number {
    color: #facc15;
}

.silver .rank-number {
    color: #e2e8f0;
}

.bronze .rank-number {
    color: #fb923c;
}

.red-high .rank-number,
.red-mid .rank-number,
.red-low .rank-number {
    color: #fff;
}


/* =========================================================
   PHOTO
========================================================= */

.photo-box {
    width: 25vh;
    height: 25vh;

    aspect-ratio: 1 / 1;

    flex-shrink: 0;

    display: flex;
    align-items: flex-end;
    justify-content: center;

    overflow: hidden;
}

.photo-box img {
    width: 125%;
    height: 125%;

    max-width: none;
    max-height: none;

    display: block;

    object-fit: contain;
    object-position: center bottom;

    filter:
        drop-shadow(
            0 6px 10px rgba(0, 0, 0, .25)
        );
}


/* =========================================================
   EMPLOYEE
========================================================= */

.employee {
    flex: 1;

    padding-left: 1.5vw;

    overflow: hidden;

    min-width: 0;
}

.employee-name {
    font-size: 2vw;
    font-weight: 900;

    color: #111827;

    text-transform: uppercase;

    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.employee-label {
    margin-top: .5vh;

    font-size: 1.1vw;

    letter-spacing: 3px;

    text-transform: uppercase;

    color: #111827;
}

.red-high .employee-name,
.red-mid .employee-name,
.red-low .employee-name,
.red-high .employee-label,
.red-mid .employee-label,
.red-low .employee-label {
    color: #fff;
}


/* =========================================================
   RANK CHANGE
========================================================= */

.rank-change {
    width: 0;
    height: 0;

    flex-shrink: 0;

    margin-left: 1vw;
    margin-right: 1.4vw;

    opacity: 1;

    filter:
        drop-shadow(
            0 4px 5px rgba(0, 0, 0, .55)
        )
        drop-shadow(
            0 0 4px rgba(255, 255, 255, .25)
        );

    transform-origin: center center;

    position: relative;

    z-index: 5;
}


/* NAIK */

.rank-change.up {
    border-left: 15px solid transparent;
    border-right: 15px solid transparent;
    border-bottom: 28px solid #22c55e;

    filter:
        drop-shadow(
            0 4px 5px rgba(0,0,0,.65)
        )
        drop-shadow(
            0 0 12px rgba(134,239,172,.95)
        )
        drop-shadow(
            0 0 22px rgba(187,247,208,.75)
        );
}


/* TURUN */

.rank-change.down {
    border-left: 15px solid transparent;
    border-right: 15px solid transparent;
    border-top: 28px solid #ef4444;

    filter:
        drop-shadow(
            0 4px 5px rgba(0,0,0,.65)
        )
        drop-shadow(
            0 0 12px rgba(252,165,165,.95)
        )
        drop-shadow(
            0 0 22px rgba(254,202,202,.75)
        );
}


/* ANIMASI */

.rank-change.up,
.rank-change.down {
    animation:
        rankChangePulse 1.5s ease-in-out infinite;
}

@keyframes rankChangePulse {
    0% {
        transform: scale(1);
        opacity: .85;
    }

    50% {
        transform: scale(1.18);
        opacity: 1;
    }

    100% {
        transform: scale(1);
        opacity: .85;
    }
}


/* =========================================================
   SCORE
========================================================= */

.score {
    width: 31%;

    padding-right: 1.8vw;

    display: flex;
    flex-direction: column;
    align-items: flex-end;

    gap: 1vh;
}

.main-score {
    text-align: right;
}

.score-value {
    font-size: 2.5vw;
    font-weight: 900;
    color: #111827;
}

.score-label {
    margin-top: .2vh;

    font-size: .8vw;
    font-weight: 700;

    letter-spacing: 2px;

    color: #111827;
    opacity: .7;
}

.red-high .score-value,
.red-mid .score-value,
.red-low .score-value,
.red-high .score-label,
.red-mid .score-label,
.red-low .score-label {
    color: #fff;
}


/* =========================================================
   ACHIEVEMENT
========================================================= */

.ach-box {
    padding: 1vh 1.2vw;

    border-radius: 22px;

    min-width: 9vw;

    text-align: center;

    border: 1px solid rgba(255, 255, 255, .18);

    background: rgba(255, 255, 255, .12);
}

.ach-title {
    font-size: .72vw;

    font-weight: 800;

    letter-spacing: 2px;

    color: #fff;
}

.ach-value {
    margin-top: .45vh;

    font-size: 1.8vw;

    font-weight: 900;
}

.ach-green-box {
    background: rgba(22, 163, 74, .35) !important;
    border: 2px solid rgba(74, 222, 128, .65);
}

.ach-red-box {
    background: rgba(185, 28, 28, .35) !important;
    border: 2px solid rgba(252, 165, 165, .6);
}

.ach-normal {
    color: #fff !important;
}


/* =========================================================
   DATE & TIME
========================================================= */

#datetimeWidget {
    position: fixed;

    top: 20px;
    right: 25px;

    z-index: 999;

    display: flex;
    flex-direction: column;
    align-items: flex-end;

    gap: 4px;

    pointer-events: none;
}

#dateLine {
    color: #000;

    font-size: .8vw;
    font-weight: 700;

    letter-spacing: 2px;

    text-transform: uppercase;

    text-shadow:
        0 2px 10px rgba(255, 255, 255, .4);
}

#timeLine {
    padding: 6px 18px;

    border-radius: 999px;

    background: rgba(255, 255, 255, .18);

    backdrop-filter: blur(10px);

    border: 1px solid rgba(255, 255, 255, .25);

    color: #000;

    font-size: 1.2vw;
    font-weight: 900;

    letter-spacing: 3px;

    text-shadow:
        0 2px 10px rgba(255, 255, 255, .4);
}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 768px) {

    body {
        overflow: auto;
    }

    .slide {
        min-height: 100vh;
        height: auto;
        padding: 12px;
    }

    .header h1 {
        font-size: 30px;
    }

    .header p {
        font-size: 11px;
    }

    .rank-card {
        height: 130px;
    }

    .rank-number {
        font-size: 90px !important;
    }

    .photo-box {
        width: 95px;
        min-width: 95px;
    }

    .employee-name {
        font-size: 15px;
    }

    .employee-label {
        font-size: 10px;
    }

    .score {
        width: 42%;
    }

    .score-value {
        font-size: 18px;
    }

    .score-label {
        font-size: 9px;
    }

    .ach-box {
        min-width: 78px;
        padding: 8px 10px;
    }

    .ach-title {
        font-size: 8px;
    }

    .ach-value {
        font-size: 15px;
    }

    .rank-change {
        margin-left: 5px;
        margin-right: 8px;
    }

    .rank-change.up {
        border-left-width: 10px;
        border-right-width: 10px;
        border-bottom-width: 20px;
    }

    .rank-change.down {
        border-left-width: 10px;
        border-right-width: 10px;
        border-top-width: 20px;
    }

    #datetimeWidget {
        top: 81px;

        left: 50%;
        right: auto;

        transform: translateX(-50%);

        width: 100%;

        align-items: center;
        text-align: center;
    }

    #dateLine {
        font-size: 11px;
        letter-spacing: 1px;
        width: 100%;
    }

    #timeLine {
        font-size: 18px;
        min-width: 120px;
    }
}

</style>
</head>

<script>

/* =========================================================
   GOOGLE APPS SCRIPT
========================================================= */

const URL =
    "https://script.google.com/macros/s/AKfycbzeehvUo6QYriMFJTR4A88lN6IIHV6Qop9UphkdOTMkRLVxhVuJ13y69momo6h1pn9dTQ/exec";


/* =========================================================
   FOTO
========================================================= */

const photoRules = {

    "137391": "https://putrasetya.github.io/foto/putra.png",
    "193976": "https://putrasetya.github.io/foto/archi.png",
    "114636": "https://putrasetya.github.io/foto/budi.png",
    "183549": "https://putrasetya.github.io/foto/jaidun.png",
    "193978": "https://putrasetya.github.io/foto/ghofur.png",
    "194018": "https://putrasetya.github.io/foto/salim.png",
    "129403": "https://putrasetya.github.io/foto/nafi.png",
    "193977": "https://putrasetya.github.io/foto/avif.png",
    "195964": "https://putrasetya.github.io/foto/sherly.png",
    "94880": "https://putrasetya.github.io/foto/imam.png",
    "105194": "https://putrasetya.github.io/foto/shohib.png",
    "161295": "https://putrasetya.github.io/foto/arif.png",
    "134576": "https://putrasetya.github.io/foto/rifai.png",
    "136049": "https://putrasetya.github.io/foto/luluk.png",
    "193979": "https://putrasetya.github.io/foto/ima.png",
    "193980": "https://putrasetya.github.io/foto/hepi.png",
    "149296": "https://putrasetya.github.io/foto/ifa.png"

};


/* =========================================================
   GET FOTO
========================================================= */

function getPhoto(nik) {

    if (
        nik === null ||
        nik === undefined
    ) {
        return "";
    }

    const employeeNik =
        String(nik)
            .trim()
            .replace(/\.0+$/, "");

    return photoRules[employeeNik] || "";
}


/* =========================================================
   DATA STATE
========================================================= */

let lastData = [];
let lastRenderHash = "";


/* =========================================================
   LOCAL STORAGE RANK HISTORY
========================================================= */


const RANK_STORAGE_KEY =
    "azko_tv_rank_history_v2";

let rankHistory = {};
    
try {

    const saved =
        localStorage.getItem(
            RANK_STORAGE_KEY
        );

    if (saved) {
        rankHistory = JSON.parse(saved);
    }

} catch (error) {

    console.log(
        "RANK HISTORY READ ERROR:",
        error
    );

    rankHistory = {};
}

const RANK_CHANGE_STORAGE_KEY =
    "azko_tv_rank_change_v2";

let rankChangeHistory = {};

try {

    const saved =
        localStorage.getItem(
            RANK_CHANGE_STORAGE_KEY
        );

    if (saved) {
        rankChangeHistory =
            JSON.parse(saved);
    }

} catch (error) {

    console.log(
        "RANK CHANGE HISTORY ERROR:",
        error
    );

    rankChangeHistory = {};
}


function saveRankChangeHistory() {

    localStorage.setItem(
        RANK_CHANGE_STORAGE_KEY,
        JSON.stringify(
            rankChangeHistory
        )
    );
}    

function saveRankHistory() {

    try {

        localStorage.setItem(
            RANK_STORAGE_KEY,
            JSON.stringify(rankHistory)
        );

    } catch (error) {

        console.log(
            "RANK HISTORY SAVE ERROR:",
            error
        );
    }
}

/* =========================================================
   RANK CHANGE
========================================================= */

function getRankChange(
    storageGroup,
    nik,
    currentRank
) {

    if (!nik) {
        return "";
    }

    const employeeNik =
        String(nik)
            .trim()
            .replace(/\.0+$/, "");


    if (!rankHistory[storageGroup]) {
        rankHistory[storageGroup] = {};
    }

    if (!rankChangeHistory[storageGroup]) {
        rankChangeHistory[storageGroup] = {};
    }


    const previousRank =
        rankHistory[storageGroup][employeeNik];


    /*
       KARYAWAN BARU
       Belum ada rank sebelumnya.
    */

    if (
        previousRank === undefined ||
        previousRank === null
    ) {

        return (
            rankChangeHistory
                [storageGroup]
                [employeeNik]
            || ""
        );
    }


    /*
       RANK BERUBAH
    */

    if (currentRank < previousRank) {

        rankChangeHistory
            [storageGroup]
            [employeeNik] =
                "up";

        saveRankChangeHistory();

        return "up";
    }


    if (currentRank > previousRank) {

        rankChangeHistory
            [storageGroup]
            [employeeNik] =
                "down";

        saveRankChangeHistory();

        return "down";
    }


    /*
       RANK TIDAK BERUBAH
       Pertahankan segitiga
       terakhir.
    */

    return (
        rankChangeHistory
            [storageGroup]
            [employeeNik]
        || ""
    );
                           }

/* =========================================================
   SAVE CURRENT RANK
========================================================= */

function saveCurrentRanks(
    storageGroup,
    rankedData
) {

    if (!rankHistory[storageGroup]) {
        rankHistory[storageGroup] = {};
    }


    rankedData.forEach(item => {

        const nik =
            String(item.nik || "")
                .trim()
                .replace(/\.0+$/, "");


        if (!nik) {
            return;
        }


        rankHistory[storageGroup][nik] =
            item.rank;
    });


    saveRankHistory();
}


/* =========================================================
   GLOBAL RANK CALCULATOR
========================================================= */

function buildGlobalRanks(data) {

    const result = {
        sales: {},
        proteksi: {},
        trx: {}
    };


    /*
       SALES
       Ranking berdasarkan ACH MTD
    */

    const salesData =
        data
            .filter(item =>
                !isExcluded(item.dept) &&
                item.achSales > 0
            )
            .sort(
                (a, b) =>
                    b.achSales -
                    a.achSales
            );


    salesData.forEach(
        (item, index) => {

            const nik =
                String(item.nik || "")
                    .trim()
                    .replace(/\.0+$/, "");

            if (nik) {
                result.sales[nik] =
                    index + 1;
            }
        }
    );


    /*
       PROTEKSI
    */

    const proteksiData =
        data
            .filter(item =>
                item.proteksi >= 0
            )
            .sort(
                (a, b) =>
                    b.proteksi -
                    a.proteksi
            );


    proteksiData.forEach(
        (item, index) => {

            const nik =
                String(item.nik || "")
                    .trim()
                    .replace(/\.0+$/, "");

            if (nik) {
                result.proteksi[nik] =
                    index + 1;
            }
        }
    );


    /*
       TRX
    */

    const trxData =
        data
            .filter(item =>
                !isExcluded(item.dept) &&
                item.trx > 0
            )
            .sort(
                (a, b) =>
                    b.trx -
                    a.trx
            );


    trxData.forEach(
        (item, index) => {

            const nik =
                String(item.nik || "")
                    .trim()
                    .replace(/\.0+$/, "");

            if (nik) {
                result.trx[nik] =
                    index + 1;
            }
        }
    );


    return result;
    }
    
/* =========================================================
   HELPERS
========================================================= */

function clean(value) {

    if (!value) {
        return 0;
    }

    return parseFloat(
        value
            .toString()
            .replace(/[^\d.]/g, "")
    ) || 0;
}


function formatSalesJt(value) {

    const jt =
        value / 1000000;

    const rounded =
        Math.floor(jt * 10) / 10;

    if (Number.isInteger(rounded)) {
        return `${rounded.toFixed(0)} jt`;
    }

    return `${rounded
        .toFixed(1)
        .replace(".", ",")} jt`;
}


function isExcluded(dept) {

    const d =
        (dept || "").toLowerCase();

    return (
        d.includes("cashier") ||
        d.includes("kasir") ||
        d.includes("cs") ||
        d.includes("customer service")
    );
}


/* =========================================================
   GET DATA
========================================================= */

async function getData() {

    try {

        const response =
            await fetch(
                URL + "?t=" + Date.now()
            );

        const json =
            await response.json();

        if (
            !Array.isArray(json) ||
            json.length === 0
        ) {
            return lastData;
        }

        const mapped =
            json.map(row => ({

                nik:
                    row["NIP"] ||
                    row["NIK"] ||
                    "",

                name:
                    row["EMPLOYEE NAME"] ||
                    "UNKNOWN",

                dept:
                    row["DEPT"] ||
                    "-",

                sales:
                    clean(
                        row["SALES MTD"]
                    ),

                proteksi:
                    clean(
                        row["PROTEKSI"]
                    ),

                trx:
                    clean(
                        row["TRX"]
                    ),

                achSales:
                    clean(
                        row["ACH MTD"]
                    ),

                achProteksi:
                    clean(
                        row["ACH PROTEKSI"]
                    ),

                achTrx:
                    clean(
                        row["ACH BULANAN"]
                    )

            }));

        lastData =
            mapped;

        return mapped;

    } catch (error) {

        console.log(
            "GET DATA ERROR:",
            error
        );

        return lastData;
    }
}


/* =========================================================
   ACH STYLE
========================================================= */

function getAchStyle(value) {

    if (value >= 100) {

        return {
            valueClass:
                "ach-value ach-green",

            boxClass:
                "ach-box ach-green-box"
        };
    }

    if (value < 80) {

        return {
            valueClass:
                "ach-value ach-red",

            boxClass:
                "ach-box ach-red-box"
        };
    }

    return {
        valueClass:
            "ach-value ach-normal",

        boxClass:
            "ach-box"
    };
}


/* =========================================================
   RENDER
========================================================= */

function render(
    data,
    key,
    achKey,
    achTitle,
    containerId,
    label,
    mode = "top",
    globalRanks = null
) {

    const container =
        document.getElementById(
            containerId
        );

    if (!container) {
        return;
    }


    /* -----------------------------------------------------
       FILTER DATA
    ----------------------------------------------------- */

    let filteredData =
        [...data];

    if (
        containerId === "salesTop" ||
        containerId === "salesBottom" ||
        containerId === "trxTop" ||
        containerId === "trxBottom"
    ) {

        filteredData =
            filteredData.filter(
                item =>
                    !isExcluded(item.dept)
            );
    }


    let sorted = [];
    let styles = [];


    /* =====================================================
       TOP
    ===================================================== */

    if (mode === "top") {

        styles = [
            "gold",
            "silver",
            "bronze"
        ];


        if (
            containerId === "salesTop" ||
            containerId === "salesBottom"
        ) {

            sorted =
                filteredData
                    .filter(
                        item =>
                            item.achSales > 0
                    )
                    .sort(
                        (a, b) =>
                            b.achSales -
                            a.achSales
                    );

        } else {

            sorted =
                filteredData
                    .filter(
                        item =>
                            item[key] > 0
                    )
                    .sort(
                        (a, b) =>
                            b[key] -
                            a[key]
                    );
        }


        /*
            Tentukan peringkat aktual
            sebelum mengambil TOP 3.
        */

        sorted =
            sorted.map(
                (item, index) => ({
                    ...item,
                    actualRank:
                        index + 1
                })
            );


        sorted =
            sorted.slice(0, 3);


    } else {

        /* =================================================
           BOTTOM
        ================================================= */

        styles = [
            "red-high",
            "red-mid",
            "red-low"
        ];

        let allSorted;


        if (
            containerId === "salesBottom"
        ) {

            allSorted =
                filteredData
                    .filter(
                        item =>
                            item.achSales > 0
                    )
                    .sort(
                        (a, b) =>
                            a.achSales -
                            b.achSales
                    );

        } else {

            allSorted =
                filteredData
                    .filter(item => {

                        if (
                            containerId ===
                            "proteksiBottom"
                        ) {
                            return item[key] >= 0;
                        }

                        return item[key] > 0;
                    })
                    .sort(
                        (a, b) =>
                            a[key] -
                            b[key]
                    );
        }


        /*
            Rank aktual berdasarkan
            jumlah seluruh karyawan.
        */

        const total =
    globalRanks
        ? Object.keys(globalRanks).length
        : allSorted.length;

/*
   Simpan rank global masing-masing karyawan
*/
allSorted =
    allSorted.map(item => {

        const employeeNik =
            String(item.nik || "")
                .trim()
                .replace(/\.0+$/, "");

        return {
            ...item,

            globalRank:
                globalRanks &&
                globalRanks[employeeNik] !== undefined
                    ? globalRanks[employeeNik]
                    : null
        };
    });


/*
   Tetap gunakan RANK GLOBAL
   untuk menentukan 3 terbawah
*/
if (globalRanks) {

    allSorted.sort(
        (a, b) =>
            (a.globalRank || 999999) -
            (b.globalRank || 999999)
    );
}


/*
   Ambil 3 karyawan dengan
   rank global paling bawah
*/
sorted =
    allSorted.slice(-3);


/*
   Urutkan tampilan:
   15 → 16 → 17
*/
sorted.sort(
    (a, b) =>
        (a.globalRank || 0) -
        (b.globalRank || 0)
);


/*
   Nomor yang DITAMPILKAN
   mengikuti jumlah karyawan.

   Contoh total 17:
   15, 16, 17
*/
sorted =
    sorted.map(
        (item, index) => ({
            ...item,

            actualRank:
                total - 2 + index,

            totalRank:
                total
        })
    );


        /*
            Ambil 3 terbawah.
        */

        sorted =
            allSorted.slice(0, 3);


        /*
            Tampilkan dari rank
            tertinggi ke terendah.
        */

        sorted.reverse();
    }


    let html = "";

    let storageGroup = containerId;

if (
    containerId === "proteksiTop" ||
    containerId === "proteksiBottom"
) {
    storageGroup = "proteksi";
}

if (
    containerId === "salesTop" ||
    containerId === "salesBottom"
) {
    storageGroup = "sales";
}

if (
    containerId === "trxTop" ||
    containerId === "trxBottom"
) {
    storageGroup = "trx";
}

    const currentRankData = [];


    /* =====================================================
       BUILD CARD
    ===================================================== */

    sorted.forEach((d, i) => {

        const employeeNik =
    String(d.nik || "")
        .trim()
        .replace(/\.0+$/, "");


let rank;

if (mode === "bottom") {

    // Nomor yang tampil di Bottom
    rank = d.actualRank;

} else {

    // Top tetap menggunakan rank global
    rank =
        globalRanks &&
        globalRanks[employeeNik] !== undefined
            ? globalRanks[employeeNik]
            : d.actualRank;
}

        const achStyle =
            getAchStyle(
                d[achKey]
            );

        const photo =
            getPhoto(d.nik);

        const rankChange =
            getRankChange(
                storageGroup,
                d.nik,
                rank
            );


        currentRankData.push({
            nik: d.nik,
            rank: rank
        });


        let changeHTML = "";


        if (rankChange === "up") {

            changeHTML = `
                <div
                    class="rank-change up"
                    title="Peringkat naik">
                </div>
            `;
        }


        if (rankChange === "down") {

            changeHTML = `
                <div
                    class="rank-change down"
                    title="Peringkat turun">
                </div>
            `;
        }


        const photoSrc =
            photo ||
            `https://ui-avatars.com/api/?name=${encodeURIComponent(
                d.name
            )}&background=random&color=fff&size=512`;


        const scoreValue =
            key === "sales"
                ? formatSalesJt(d[key])
                : d[key].toLocaleString("id-ID");


        html += `

            <div
                class="rank-card show ${styles[i]}"
            >

                <div class="rank-number">
                    ${rank}
                </div>


                <div class="photo-box">

                    <img
                        src="${photoSrc}"
                        loading="eager"
                        decoding="async"
                        onerror="
                            this.onerror=null;
                            this.src='https://ui-avatars.com/api/?name=${encodeURIComponent(
                                d.name
                            )}&background=random&color=fff&size=512';
                        "
                    >

                </div>


                <div class="employee">

                    <div class="employee-name">
                        ${d.name}
                    </div>

                    <div class="employee-label">
                        ${d.dept}
                    </div>

                </div>


                ${changeHTML}


                <div class="score">

                    <div class="main-score">

                        <div class="score-value">
                            ${scoreValue}
                        </div>

                        <div class="score-label">
                            ${label}
                        </div>

                    </div>


                    <div
                        class="${achStyle.boxClass}"
                    >

                        <div class="ach-title">
                            ${achTitle}
                        </div>

                        <div
                            class="${achStyle.valueClass}"
                        >
                            ${d[achKey].toFixed(1)}%
                        </div>

                    </div>

                </div>

            </div>

        `;
    });


    container.innerHTML =
        html;

}


/* =========================================================
   SLIDES
========================================================= */

const slides =
    document.querySelectorAll(
        ".slide"
    );

let current = 0;
let isSliding = false;


function nextSlide() {

    if (isSliding) {
        return;
    }

    isSliding = true;


    slides[current]
        .classList.remove("active");


    current++;

    if (
        current >= slides.length
    ) {
        current = 0;
    }


    setTimeout(() => {

        slides[current]
            .classList.add("active");

        isSliding = false;

    }, 120);
}


/* =========================================================
   UPDATE
========================================================= */

async function update() {

    const data =
        await getData();

    if (
        !data ||
        data.length === 0
    ) {
        return;
    }


    const newHash =
        JSON.stringify(data);


    /*
        Jangan render ulang jika
        data tidak berubah.
    */

    if (
        newHash ===
        lastRenderHash
    ) {
        return;
    }


    lastRenderHash =
        newHash;
    
    const globalRanks =
    buildGlobalRanks(data);

    render(
    data,
    "sales",
    "achSales",
    "ACH MTD",
    "salesTop",
    "TOTAL SALES",
    "top",
    globalRanks.sales
);

    render(
    data,
    "sales",
    "achSales",
    "ACH MTD",
    "salesBottom",
    "TOTAL SALES",
    "bottom",
    globalRanks.sales
);

    render(
    data,
    "proteksi",
    "achProteksi",
    "ACH PROTEKSI",
    "proteksiTop",
    "TOTAL PROTEKSI",
    "top",
    globalRanks.proteksi
);


    render(
    data,
    "proteksi",
    "achProteksi",
    "ACH PROTEKSI",
    "proteksiBottom",
    "TOTAL PROTEKSI",
    "bottom",
    globalRanks.proteksi
);


    render(
    data,
    "trx",
    "achTrx",
    "ACH BULANAN",
    "trxTop",
    "TOTAL TRX",
    "top",
    globalRanks.trx
);

    render(
    data,
    "trx",
    "achTrx",
    "ACH BULANAN",
    "trxBottom",
    "TOTAL TRX",
    "bottom",
    globalRanks.trx
);

/* =====================================================
   SAVE GLOBAL RANK SNAPSHOT
===================================================== */

rankHistory.sales =
    globalRanks.sales;

rankHistory.proteksi =
    globalRanks.proteksi;

rankHistory.trx =
    globalRanks.trx;

saveRankHistory();
}


/* =========================================================
   INDICATOR
========================================================= */

const pauseIndicator =
    document.getElementById(
        "pauseIndicator"
    );


function showIndicator(text) {

    if (!pauseIndicator) {
        return;
    }

    pauseIndicator.innerHTML =
        text;

    pauseIndicator.classList.add(
        "show"
    );

    clearTimeout(
        window.indicatorTimeout
    );

    window.indicatorTimeout =
        setTimeout(() => {

            pauseIndicator.classList.remove(
                "show"
            );

        }, 1500);
}


/* =========================================================
   AUDIO
========================================================= */

const bgm =
    document.getElementById(
        "bgm"
    );


if (bgm) {
    bgm.volume = 0.35;
}


async function playMusic() {

    if (!bgm) {
        return;
    }

    try {

        await bgm.play();

    } catch (error) {

        console.log(
            "AUDIO PLAY ERROR:",
            error
        );
    }
}


/* =========================================================
   LOOP
========================================================= */

let isPaused = false;

let slideInterval;
let updateInterval;


function stopLoop() {

    clearInterval(
        slideInterval
    );

    clearInterval(
        updateInterval
    );
}


function startLoop() {

    stopLoop();


    slideInterval =
        setInterval(() => {

            if (!document.hidden) {
                nextSlide();
            }

        }, 8000);


    updateInterval =
        setInterval(() => {

            if (!document.hidden) {
                update();
            }

        }, 30000);
}


function togglePause() {

    isPaused =
        !isPaused;


    if (isPaused) {

        stopLoop();

        if (bgm) {
            bgm.pause();
        }

        showIndicator(
            "⏸ PAUSED"
        );

    } else {

        startLoop();

        playMusic();

        showIndicator(
            "▶ PLAYING"
        );
    }
}


/* =========================================================
   FULLSCREEN
========================================================= */

async function toggleFullscreen() {

    try {

        if (
            !document.fullscreenElement
        ) {

            await document
                .documentElement
                .requestFullscreen();

            showIndicator(
                "🖥 FULLSCREEN"
            );

        } else {

            await document
                .exitFullscreen();

            showIndicator(
                "❎ EXIT FULLSCREEN"
            );
        }

    } catch (error) {

        console.log(
            "FULLSCREEN ERROR:",
            error
        );
    }
}


/* =========================================================
   CLICK CONTROL
========================================================= */

let clickTimer = null;


document.addEventListener(
    "click",
    () => {

        if (clickTimer) {

            clearTimeout(
                clickTimer
            );
        }

        clickTimer =
            setTimeout(() => {

                togglePause();

            }, 250);
    }
);


document.addEventListener(
    "dblclick",
    () => {

        clearTimeout(

        );

        toggleFullscreen();
    }
);
