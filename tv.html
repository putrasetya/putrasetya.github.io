<script>

/* =====================================================
GOOGLE APPS SCRIPT
===================================================== */

const URL =
"https://script.google.com/macros/s/AKfycbzeehvUo6QYriMFJTR4A88lN6IIHV6Qop9UphkdOTMkRLVxhVuJ13y69momo6h1pn9dTQ/exec";


/* =====================================================
PHOTO RULES
===================================================== */

const photoRules = {

    "137391":
        "https://putrasetya.github.io/foto/putra.png",

    "193976":
        "https://putrasetya.github.io/foto/archi.png",

    "114636":
        "https://putrasetya.github.io/foto/budi.png",

    "183549":
        "https://putrasetya.github.io/foto/jaidun.png",

    "193978":
        "https://putrasetya.github.io/foto/ghofur.png",

    "194018":
        "https://putrasetya.github.io/foto/salim.png",

    "129403":
        "https://putrasetya.github.io/foto/nafi.png",

    "193977":
        "https://putrasetya.github.io/foto/avif.png",

    "195964":
        "https://putrasetya.github.io/foto/sherly.png",

    "94880":
        "https://putrasetya.github.io/foto/imam.png",

    "105194":
        "https://putrasetya.github.io/foto/shohib.png",

    "161295":
        "https://putrasetya.github.io/foto/arif.png",

    "134576":
        "https://putrasetya.github.io/foto/rifai.png",

    "136049":
        "https://putrasetya.github.io/foto/luluk.png",

    "193979":
        "https://putrasetya.github.io/foto/ima.png",

    "193980":
        "https://putrasetya.github.io/foto/hepi.png",

    "149296":
        "https://putrasetya.github.io/foto/ifa.png"

};


/* =====================================================
GET FOTO
===================================================== */

function getPhoto(nik){

    if(
        nik === null ||
        nik === undefined
    ){

        return "";

    }

    const employeeNik =
        String(nik)
        .trim()
        .replace(/\.0+$/, "");

    console.log(
        "NIK:",
        employeeNik,
        "FOTO:",
        photoRules[employeeNik]
    );

    return (
        photoRules[employeeNik] ||
        ""
    );

}


/* =====================================================
DATA
===================================================== */

let lastData = [];

let lastRenderHash = "";


/* =====================================================
LOCAL STORAGE RANK MEMORY
===================================================== */

const RANK_STORAGE_KEY =
    "azko_tv_previous_rank_v1";

let previousRanks = {};

try{

    previousRanks =
        JSON.parse(
            localStorage.getItem(
                RANK_STORAGE_KEY
            )
        ) || {};

}catch(err){

    console.log(
        "LOCAL STORAGE ERROR:",
        err
    );

    previousRanks = {};

}


/* =====================================================
HELPERS
===================================================== */

function clean(val){

    if(!val)
        return 0;

    return parseFloat(
        val.toString().replace(/[^\d.]/g,'')
    ) || 0;

}


function formatSalesJt(value){

    const jt =
        value / 1000000;

    const rounded =
        Math.floor(jt * 10) / 10;

    if(Number.isInteger(rounded)){

        return `${rounded.toFixed(0)} jt`;

    }

    return `${rounded.toFixed(1).replace('.',',')} jt`;

}


function isExcluded(dept){

    const d =
        (dept || "").toLowerCase();

    return (

        d.includes("cashier") ||
        d.includes("kasir") ||
        d.includes("cs") ||
        d.includes("customer service")

    );

}


/* =====================================================
GET DATA
===================================================== */

async function getData(){

    try{

        const res =
            await fetch(
                URL + "?t=" + Date.now()
            );

        const json =
            await res.json();

        if(
            !Array.isArray(json) ||
            json.length === 0
        ){

            return lastData;

        }


        const mapped =
            json.map(row => ({

                nik:
                    row["NIP"] ||
                    row["NIK"] ||
                    "",

                name:
                    row["EMPLOYEE NAME"] ||
                    "UNKNOWN",

                dept:
                    row["DEPT"] ||
                    "-",

                sales:
                    clean(
                        row["SALES MTD"]
                    ),

                proteksi:
                    clean(
                        row["PROTEKSI"]
                    ),

                trx:
                    clean(
                        row["TRX"]
                    ),

                achSales:
                    clean(
                        row["ACH MTD"]
                    ),

                achProteksi:
                    clean(
                        row["ACH PROTEKSI"]
                    ),

                achTrx:
                    clean(
                        row["ACH BULANAN"]
                    )

            }));


        lastData =
            mapped;

        return mapped;


    }catch(err){

        console.log(
            "GET DATA ERROR:",
            err
        );

        return lastData;

    }

}


/* =====================================================
ACH STYLE
===================================================== */

function getAchStyle(value){

    if(value >= 100){

        return {

            valueClass:
                "ach-value ach-green",

            boxClass:
                "ach-box ach-green-box"

        };

    }

    if(value < 80){

        return {

            valueClass:
                "ach-value ach-red",

            boxClass:
                "ach-box ach-red-box"

        };

    }

    return {

        valueClass:
            "ach-value ach-normal",

        boxClass:
            "ach-box"

    };

}


/* =====================================================
RANK CHANGE
===================================================== */

function getRankChange(
    nik,
    currentRank,
    type
){

    const employeeNik =
        String(nik || "").trim();

    if(!employeeNik){

        return "";

    }


    const key =
        type +
        "_" +
        employeeNik;


    const previousRank =
        previousRanks[key];


    if(
        previousRank === undefined ||
        previousRank === null
    ){

        return "";

    }


    /* NAIK */

    if(
        currentRank <
        previousRank
    ){

        return `

            <div
                class="rank-change rank-up"
                title="Naik peringkat"
            >
                ▲
            </div>

        `;

    }


    /* TURUN */

    if(
        currentRank >
        previousRank
    ){

        return `

            <div
                class="rank-change rank-down"
                title="Turun peringkat"
            >
                ▼
            </div>

        `;

    }


    return "";

}


/* =====================================================
BUILD CURRENT RANKS
===================================================== */

function buildCurrentRanks(data){

    const newRanks = {};


    /* SALES */

    [...data]

        .filter(
            item =>
                !isExcluded(item.dept) &&
                item.achSales > 0
        )

        .sort(
            (a,b) =>
                b.achSales -
                a.achSales
        )

        .forEach(
            (item,index)=>{

                const key =
                    "sales_" +
                    String(item.nik).trim();

                newRanks[key] =
                    index + 1;

            }
        );


    /* PROTEKSI */

    [...data]

        .filter(
            item =>
                item.proteksi > 0
        )

        .sort(
            (a,b) =>
                b.proteksi -
                a.proteksi
        )

        .forEach(
            (item,index)=>{

                const key =
                    "proteksi_" +
                    String(item.nik).trim();

                newRanks[key] =
                    index + 1;

            }
        );


    /* TRX */

    [...data]

        .filter(
            item =>
                !isExcluded(item.dept) &&
                item.trx > 0
        )

        .sort(
            (a,b) =>
                b.trx -
                a.trx
        )

        .forEach(
            (item,index)=>{

                const key =
                    "trx_" +
                    String(item.nik).trim();

                newRanks[key] =
                    index + 1;

            }
        );


    return newRanks;

}


/* =====================================================
SAVE CURRENT RANK
===================================================== */

function saveCurrentRanks(data){

    const newRanks =
        buildCurrentRanks(data);


    try{

        localStorage.setItem(
            RANK_STORAGE_KEY,
            JSON.stringify(newRanks)
        );

        previousRanks =
            newRanks;

    }catch(err){

        console.log(
            "SAVE RANK ERROR:",
            err
        );

    }

}


/* =====================================================
RENDER
===================================================== */

function render(
    data,
    key,
    achKey,
    achTitle,
    containerId,
    label,
    mode="top"
){

    const container =
        document.getElementById(
            containerId
        );

    if(!container)
        return;


    let filteredData =
        [...data];


    /* FILTER KASIR / CS */

    if(

        containerId === "salesTop" ||
        containerId === "salesBottom" ||
        containerId === "trxTop"

    ){

        filteredData =
            filteredData.filter(
                item =>
                    !isExcluded(item.dept)
            );

    }


    let sorted = [];

    let styles = [];


    /* RANK TYPE */

    const rankType =

        containerId.includes("sales")
            ? "sales"

            : containerId.includes("proteksi")
                ? "proteksi"

                : "trx";


    /* =========================
       TOP
    ========================= */

    if(mode === "top"){

        styles = [

            "gold",
            "silver",
            "bronze"

        ];


        if(

            containerId === "salesTop" ||
            containerId === "salesBottom"

        ){

            sorted =
                filteredData

                .filter(
                    v =>
                        v.achSales > 0
                )

                .sort(
                    (a,b) =>
                        b.achSales -
                        a.achSales
                )

                .slice(0,3);


        }else{

            sorted =
                filteredData

                .filter(
                    v =>
                        v[key] > 0
                )

                .sort(
                    (a,b) =>
                        b[key] -
                        a[key]
                )

                .slice(0,3);

        }


    }else{

        /* =========================
           BOTTOM
        ========================= */

        styles = [

            "red-high",
            "red-mid",
            "red-low"

        ];


        let allSorted;


        if(
            containerId ===
            "salesBottom"
        ){

            allSorted =
                filteredData

                .filter(
                    v =>
                        v.achSales > 0
                )

                .sort(
                    (a,b) =>
                        a.achSales -
                        b.achSales
                );


        }else{

            allSorted =
                filteredData

                .filter(v => {

                    if(
                        containerId ===
                        "proteksiBottom"
                    ){

                        return v[key] >= 0;

                    }

                    return v[key] > 0;

                })

                .sort(
                    (a,b) =>
                        a[key] -
                        b[key]
                );

        }


        sorted =
            allSorted.slice(0,3);


        sorted =
            sorted.map(
                (item,index) => ({

                    ...item,

                    bottomRank:
                        allSorted.length -
                        index

                })
            );


        sorted.reverse();

    }


    let html = "";


    sorted.forEach(
        (d,i)=>{

            const rank =

                mode === "top"

                ? i + 1

                : d.bottomRank;


            const achStyle =
                getAchStyle(
                    d[achKey]
                );


            const photo =
                getPhoto(
                    d.nik
                );


            const rankChange =
                getRankChange(
                    d.nik,
                    rank,
                    rankType
                );


            const avatar =
                `https://ui-avatars.com/api/?name=${encodeURIComponent(d.name)}&background=random&color=fff&size=512`;


            const photoSrc =
                photo ||
                avatar;


            html += `

                <div
                    class="rank-card show ${styles[i]}"
                >

                    <div class="rank-number">
                        ${rank}
                    </div>


                    <div class="photo-box">

                        <img
                            src="${photoSrc}"
                            loading="eager"
                            decoding="async"

                            onerror="
                                this.onerror=null;
                                this.src='${avatar}';
                            "
                        >

                    </div>


                    <div class="employee">

                        <div class="employee-name">

                            ${d.name}

                            ${rankChange}

                        </div>


                        <div class="employee-label">

                            ${d.dept}

                        </div>

                    </div>


                    <div class="score">

                        <div class="main-score">

                            <div class="score-value">

                                ${
                                    key === "sales"

                                    ? formatSalesJt(
                                        d[key]
                                    )

                                    : d[key].toLocaleString(
                                        'id-ID'
                                    )
                                }

                            </div>


                            <div class="score-label">

                                ${label}

                            </div>

                        </div>


                        <div
                            class="${achStyle.boxClass}"
                        >

                            <div class="ach-title">

                                ${achTitle}

                            </div>


                            <div
                                class="${achStyle.valueClass}"
                            >

                                ${d[achKey].toFixed(1)}%

                            </div>

                        </div>

                    </div>

                </div>

            `;

        }
    );


    container.innerHTML =
        html;

}


/* =====================================================
SLIDES
===================================================== */

const slides =
    document.querySelectorAll(
        ".slide"
    );


let current = 0;

let isSliding = false;


function nextSlide(){

    if(isSliding)
        return;


    isSliding = true;


    slides[current]
        .classList.remove(
            "active"
        );


    current++;


    if(
        current >= slides.length
    ){

        current = 0;

    }


    setTimeout(
        ()=>{

            slides[current]
                .classList.add(
                    "active"
                );

            isSliding = false;

        },
        120
    );

}


/* =====================================================
UPDATE
===================================================== */

async function update(){

    const data =
        await getData();


    if(
        !data ||
        data.length === 0
    ){

        return;

    }


    const newHash =
        JSON.stringify(
            data
        );


    if(
        newHash ===
        lastRenderHash
    ){

        return;

    }


    lastRenderHash =
        newHash;


    render(
        data,
        "sales",
        "achSales",
        "ACH MTD",
        "salesTop",
        "TOTAL SALES",
        "top"
    );


    render(
        data,
        "sales",
        "achSales",
        "ACH MTD",
        "salesBottom",
        "TOTAL SALES",
        "bottom"
    );


    render(
        data,
        "proteksi",
        "achProteksi",
        "ACH PROTEKSI",
        "proteksiTop",
        "TOTAL PROTEKSI",
        "top"
    );


    render(
        data,
        "proteksi",
        "achProteksi",
        "ACH PROTEKSI",
        "proteksiBottom",
        "TOTAL PROTEKSI",
        "bottom"
    );


    render(
        data,
        "trx",
        "achTrx",
        "ACH BULANAN",
        "trxTop",
        "TOTAL TRX",
        "top"
    );


    render(
        data,
        "trx",
        "achTrx",
        "ACH BULANAN",
        "trxBottom",
        "TOTAL TRX",
        "bottom"
    );


    /*
        Ranking terbaru disimpan
        SETELAH render selesai.
    */

    saveCurrentRanks(data);

}


/* =====================================================
INDICATOR
===================================================== */

const pauseIndicator =
    document.getElementById(
        "pauseIndicator"
    );


function showIndicator(text){

    if(!pauseIndicator)
        return;


    pauseIndicator.innerHTML =
        text;


    pauseIndicator.classList.add(
        "show"
    );


    clearTimeout(
        window.indicatorTimeout
    );


    window.indicatorTimeout =
        setTimeout(
            ()=>{

                pauseIndicator.classList.remove(
                    "show"
                );

            },
            1500
        );

}


/* =====================================================
AUDIO
===================================================== */

const bgm =
    document.getElementById(
        "bgm"
    );


if(bgm){

    bgm.volume = 0.35;

}


async function playMusic(){

    if(!bgm)
        return;


    try{

        await bgm.play();

    }catch(err){

        console.log(err);

    }

}


/* =====================================================
LOOP
===================================================== */

let isPaused = false;

let slideInterval;

let updateInterval;


function stopLoop(){

    clearInterval(
        slideInterval
    );

    clearInterval(
        updateInterval
    );

}


function startLoop(){

    stopLoop();


    slideInterval =
        setInterval(
            ()=>{

                if(
                    !document.hidden
                ){

                    nextSlide();

                }

            },
            8000
        );


    updateInterval =
        setInterval(
            ()=>{

                if(
                    !document.hidden
                ){

                    update();

                }

            },
            30000
        );

}


function togglePause(){

    isPaused =
        !isPaused;


    if(isPaused){

        stopLoop();


        if(bgm)
            bgm.pause();


        showIndicator(
            "⏸ PAUSED"
        );


    }else{

        startLoop();

        playMusic();


        showIndicator(
            "▶ PLAYING"
        );

    }

}


/* =====================================================
FULLSCREEN
===================================================== */

async function toggleFullscreen(){

    try{

        if(
            !document.fullscreenElement
        ){

            await document
                .documentElement
                .requestFullscreen();


            showIndicator(
                "🖥 FULLSCREEN"
            );


        }else{

            await document
                .exitFullscreen();


            showIndicator(
                "❎ EXIT FULLSCREEN"
            );

        }

    }catch(err){

        console.log(err);

    }

}


/* =====================================================
CLICK
===================================================== */

let clickTimer = null;


document.addEventListener(
    "click",
    ()=>{

        if(clickTimer){

            clearTimeout(
                clickTimer
            );

        }


        clickTimer =
            setTimeout(
                ()=>{

                    togglePause();

                },
                250
            );

    }
);


document.addEventListener(
    "dblclick",
    ()=>{

        clearTimeout(
            clickTimer
        );


        toggleFullscreen();

    }
);
