<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>AZKO SALES RANKING</title>


<style>

/* =====================================================
   RESET
===================================================== */

* {

    box-sizing: border-box;

    margin: 0;

    padding: 0;

    font-family:
        'Segoe UI',
        Arial,
        sans-serif;

}


/* =====================================================
   BODY
===================================================== */

body {

    width: 100vw;

    height: 100vh;

    background:
        linear-gradient(
            135deg,
            #e0f2fe 0%,
            #bae6fd 100%
        );

    display: flex;

    justify-content: center;

    align-items: center;

    padding: 15px;

    overflow: hidden;

}


/* =====================================================
   CONTAINER
===================================================== */

.container {

    width: 100%;

    max-width: 900px;

    height: 100%;

    display: flex;

    flex-direction: column;

    justify-content: space-between;

}


/* =====================================================
   HEADER
===================================================== */

.header {

    width: 100%;

    text-align: center;

    margin-bottom: 8px;

}


.title {

    font-size: 2rem;

    font-weight: 800;

    color: #0f172a;

    line-height: 1.1;

    letter-spacing: 1px;

}


/* =====================================================
   SLIDE
===================================================== */

.slide {

    width: 100%;

    height: 100%;

    display: none;

    flex-direction: column;

}


.slide.active {

    display: flex;

}


/* =====================================================
   RANK GRID
===================================================== */

.rank-grid {

    display: flex;

    flex-direction: column;

    justify-content: space-between;

    flex-grow: 1;

    gap: 2px;

}


/* =====================================================
   RANK CARD
===================================================== */

.rank-card {

    background: white;

    padding: 0 16px;

    height: 4.5vh;

    border-radius: 20px;

    display: flex;

    align-items: center;

    box-shadow:
        0 1px 4px rgba(0,0,0,0.04);

    font-size: 0.85rem;

    font-weight: 600;

}


/* =====================================================
   RANK 1
===================================================== */

.rank-card.rank-1 {

    background:
        linear-gradient(
            90deg,
            #fffbeb 0%,
            #fef3c7 50%,
            #fde68a 100%
        );

    border:
        1.5px solid #f59e0b;

    box-shadow:
        0 2px 8px
        rgba(245,158,11,0.18);

}


/* =====================================================
   RANK 2
===================================================== */

.rank-card.rank-2 {

    background:
        linear-gradient(
            90deg,
            #f8fafc 0%,
            #e2e8f0 50%,
            #cbd5e1 100%
        );

    border:
        1.5px solid #94a3b8;

    box-shadow:
        0 2px 8px
        rgba(100,116,139,0.15);

}


/* =====================================================
   RANK 3
===================================================== */

.rank-card.rank-3 {

    background:
        linear-gradient(
            90deg,
            #fff7ed 0%,
            #ffedd5 50%,
            #fed7aa 100%
        );

    border:
        1.5px solid #d97706;

    box-shadow:
        0 2px 8px
        rgba(217,119,6,0.15);

}


/* =====================================================
   5 TERBAWAH
===================================================== */

.rank-card.bottom-5 {

    background:
        linear-gradient(
            90deg,
            #fef2f2 0%,
            #fee2e2 50%,
            #fecaca 100%
        );

    border:
        1px solid #fca5a5;

}


/* =====================================================
   RANK NUMBER
===================================================== */

.rank-num {

    width: 30px;

    color: #475569;

    font-weight: 700;

    flex-shrink: 0;

}


/* =====================================================
   CHANGE
===================================================== */

.change {

    width: 40px;

    font-size: 0.75rem;

    font-weight: 700;

    flex-shrink: 0;

}


.up {

    color: #16a34a;

}


.down {

    color: #dc2626;

}


.same {

    color: #94a3b8;

}


/* =====================================================
   EMPLOYEE
===================================================== */

.employee-name {

    flex-grow: 1;

    color: #0f172a;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;

}


/* =====================================================
   SLIDE 1
   SALES
===================================================== */

.sales {

    width: 110px;

    font-weight: 800;

    color: #0f172a;

    margin-left: 10px;

    white-space: nowrap;

    text-align: right;

    flex-shrink: 0;

}


/* =====================================================
   SLIDE 1
   ACH
===================================================== */

.ach {

    width: 85px;

    font-weight: 800;

    color: #0f172a;

    margin-left: 15px;

    white-space: nowrap;

    text-align: right;

    flex-shrink: 0;

}


/* =====================================================
   SLIDE 2
   PROTEKSI
===================================================== */

.proteksi {

    width: 110px;

    font-weight: 800;

    color: #0f172a;

    margin-left: 15px;

    white-space: nowrap;

    text-align: right;

    flex-shrink: 0;

}


/* =====================================================
   SLIDE 3
   TRANSAKSI
===================================================== */

.transaksi {

    width: 110px;

    font-weight: 800;

    color: #0f172a;

    margin-left: 15px;

    white-space: nowrap;

    text-align: right;

    flex-shrink: 0;

}


/* =====================================================
   LOADING
===================================================== */

.loading,
.error {

    text-align: center;

    padding: 20px;

    font-weight: 600;

}


.loading {

    color: #475569;

}


.error {

    color: #dc2626;

}


/* =====================================================
   MOBILE
===================================================== */

@media (
    max-width: 768px
),
(
    max-aspect-ratio: 1/1
) {

    body {

        height: auto;

        min-height: 100vh;

        overflow: auto;

        align-items: flex-start;

    }


    .container {

        height: auto;

        justify-content: flex-start;

        gap: 10px;

    }


    .title {

        font-size: 1.5rem;

    }


    .rank-grid {

        gap: 6px;

    }


    .rank-card {

        height: 42px;

        font-size: 0.9rem;

        padding: 0 10px;

    }


    .rank-num {

        width: 28px;

    }


    .change {

        width: 38px;

    }


    .sales {

        width: 95px;

        margin-left: 8px;

    }


    .ach {

        width: 70px;

        margin-left: 10px;

    }


    .proteksi {

        width: 95px;

        margin-left: 8px;

    }


    .transaksi {

        width: 95px;

        margin-left: 8px;

    }

}

</style>

</head>


<body>


<div class="container">


    <!-- =================================================
         SLIDE 1
    ================================================== -->

    <div
        class="slide active"
        id="slide1"
    >

        <div class="header">

            <h1 class="title">
                ACH MTD SALES ID
            </h1>

        </div>


        <div
            class="rank-grid"
            id="rankGrid1"
        >

            <div class="loading">
                Memuat data...
            </div>

        </div>

    </div>



    <!-- =================================================
         SLIDE 2
    ================================================== -->

    <div
        class="slide"
        id="slide2"
    >

        <div class="header">

            <h1 class="title">
                PROTEKSI
            </h1>

        </div>


        <div
            class="rank-grid"
            id="rankGrid2"
        >

            <div class="loading">
                Memuat data...
            </div>

        </div>

    </div>



    <!-- =================================================
         SLIDE 3
    ================================================== -->

    <div
        class="slide"
        id="slide3"
    >

        <div class="header">

            <h1 class="title">
                TRANSAKSI
            </h1>

        </div>


        <div
            class="rank-grid"
            id="rankGrid3"
        >

            <div class="loading">
                Memuat data...
            </div>

        </div>

    </div>


</div>



<script>

/* =====================================================
   GOOGLE SPREADSHEET
===================================================== */

const SPREADSHEET_ID =
    "16Alf0KUmqeaBx1zlsKfbcM5oPbzc18dBMgtlZYhP66M";


const SHEET_NAME =
    "Sheet1";


const SHEET_URL =

    "https://docs.google.com/spreadsheets/d/" +

    SPREADSHEET_ID +

    "/gviz/tq?tqx=out:json&sheet=" +

    encodeURIComponent(
        SHEET_NAME
    );


/* =====================================================
   SLIDE CONFIG
===================================================== */

const SLIDE_DURATION =
    5000;


/* =====================================================
   DATA RANK CHANGE
===================================================== */

const rankingData = [

    {
        change: "same",
        changeText: "-"
    },

    {
        change: "same",
        changeText: "-"
    },

    {
        change: "up",
        changeText: "▲ 2"
    },

    {
        change: "same",
        changeText: "-"
    },

    {
        change: "up",
        changeText: "▲ 1"
    },

    {
        change: "up",
        changeText: "▲ 1"
    },

    {
        change: "down",
        changeText: "▼ 4"
    },

    {
        change: "same",
        changeText: "-"
    },

    {
        change: "same",
        changeText: "-"
    },

    {
        change: "up",
        changeText: "▲ 1"
    },

    {
        change: "down",
        changeText: "▼ 1"
    },

    {
        change: "same",
        changeText: "-"
    },

    {
        change: "up",
        changeText: "▲ 2"
    },

    {
        change: "down",
        changeText: "▼ 1"
    },

    {
        change: "same",
        changeText: "-"
    },

    {
        change: "up",
        changeText: "▲ 1"
    },

    {
        change: "down",
        changeText: "▼ 2"
    }

];


/* =====================================================
   DATA GLOBAL
===================================================== */

let employeeData = [];


/* =====================================================
   CURRENT SLIDE
===================================================== */

let currentSlide = 1;


/* =====================================================
   LOAD DATA
===================================================== */

async function loadData() {


    try {


        const response =
            await fetch(
                SHEET_URL +
                "&t=" +
                Date.now()
            );


        if (!response.ok) {

            throw new Error(
                "Spreadsheet tidak dapat diakses."
            );

        }


        const text =
            await response.text();


        let jsonText =
            text.trim();


        /* =============================================
           HAPUS HEADER GVIZ
        ============================================= */

        jsonText =
            jsonText.replace(
                /^\/\*[\s\S]*?\*\/\s*/,
                ""
            );


        const start =
            jsonText.indexOf("{");


        const end =
            jsonText.lastIndexOf("}");


        if (
            start === -1 ||
            end === -1
        ) {

            throw new Error(
                "Format data Google Sheets tidak valid."
            );

        }


        jsonText =
            jsonText.substring(
                start,
                end + 1
            );


        const data =
            JSON.parse(
                jsonText
            );


        if (
            !data ||
            !data.table ||
            !data.table.cols
        ) {

            throw new Error(
                "Data spreadsheet tidak ditemukan."
            );

        }


        /* =============================================
           CARI COLUMN
        ============================================= */

        const employeeColumn =
            findColumn(
                data.table.cols,
                "EMPLOYEE NAME"
            );


        const salesColumn =
            findColumn(
                data.table.cols,
                "SALES MTD"
            );


        const achColumn =
            findColumn(
                data.table.cols,
                "ACH MTD"
            );


        const proteksiColumn =
            findColumn(
                data.table.cols,
                "PROTEKSI"
            );


        const trxColumn =
            findColumn(
                data.table.cols,
                "TRX"
            );


        /* =============================================
           VALIDASI
        ============================================= */

        if (
            employeeColumn === -1
        ) {

            throw new Error(
                'Header "EMPLOYEE NAME" tidak ditemukan.'
            );

        }


        if (
            salesColumn === -1
        ) {

            throw new Error(
                'Header "SALES MTD" tidak ditemukan.'
            );

        }


        if (
            achColumn === -1
        ) {

            throw new Error(
                'Header "ACH MTD" tidak ditemukan.'
            );

        }


        if (
            proteksiColumn === -1
        ) {

            throw new Error(
                'Header "PROTEKSI" tidak ditemukan.'
            );

        }


        if (
            trxColumn === -1
        ) {

            throw new Error(
                'Header "TRX" tidak ditemukan.'
            );

        }


        /* =============================================
           AMBIL DATA
        ============================================= */

        employeeData =

            data.table.rows

                .map(
                    row => {


                        if (!row.c) {

                            return null;

                        }


                        const employeeCell =
                            row.c[
                                employeeColumn
                            ];


                        const salesCell =
                            row.c[
                                salesColumn
                            ];


                        const achCell =
                            row.c[
                                achColumn
                            ];


                        const proteksiCell =
                            row.c[
                                proteksiColumn
                            ];


                        const trxCell =
                            row.c[
                                trxColumn
                            ];



                        const name =
                            employeeCell

                                ? String(
                                    employeeCell.f ??
                                    employeeCell.v ??
                                    ""
                                ).trim()

                                : "";



                        if (
                            name === ""
                        ) {

                            return null;

                        }



                        return {

                            name:
                                name,

                            sales:
                                getCellValue(
                                    salesCell
                                ),

                            ach:
                                getCellValue(
                                    achCell
                                ),

                            proteksi:
                                getCellValue(
                                    proteksiCell
                                ),

                            trx:
                                getCellValue(
                                    trxCell
                                )

                        };

                    }
                )

                .filter(
                    item =>
                        item !== null
                );



        /* =============================================
           RENDER SEMUA SLIDE
        ============================================= */

        renderSlide1();

        renderSlide2();

        renderSlide3();


    }


    catch (error) {


        console.error(
            "Gagal mengambil data:",
            error
        );


        showError(
            "rankGrid1",
            error.message
        );


        showError(
            "rankGrid2",
            error.message
        );


        showError(
            "rankGrid3",
            error.message
        );

    }

}


/* =====================================================
   GET CELL VALUE
===================================================== */

function getCellValue(
    cell
) {


    if (
        !cell
    ) {

        return "";

    }


    return String(
        cell.f ??
        cell.v ??
        ""
    ).trim();

}


/* =====================================================
   FIND COLUMN
===================================================== */

function findColumn(
    columns,
    target
) {


    return columns.findIndex(
        col =>

            String(
                col.label || ""
            )
            .trim()
            .toUpperCase() ===
            target.toUpperCase()
    );

}


/* =====================================================
   SLIDE 1
   ACH MTD SALES ID
===================================================== */

function renderSlide1() {


    const data =
        [...employeeData];


    /* =============================================
       SORT ACH MTD
       TERBESAR → TERKECIL
    ============================================= */

    data.sort(
        (a, b) =>

            parseNumber(
                b.ach
            ) -

            parseNumber(
                a.ach
            )
    );


    renderCards(
        "rankGrid1",
        data,
        "sales-ach"
    );

}


/* =====================================================
   SLIDE 2
   PROTEKSI
===================================================== */

function renderSlide2() {


    const data =
        [...employeeData];


    /* =============================================
       SORT PROTEKSI
       TERBESAR → TERKECIL
    ============================================= */

    data.sort(
        (a, b) =>

            parseNumber(
                b.proteksi
            ) -

            parseNumber(
                a.proteksi
            )
    );


    renderCards(
        "rankGrid2",
        data,
        "proteksi"
    );

}


/* =====================================================
   SLIDE 3
   TRANSAKSI
===================================================== */

function renderSlide3() {


    const data =
        [...employeeData];


    /* =============================================
       SORT TRX
       TERBESAR → TERKECIL
    ============================================= */

    data.sort(
        (a, b) =>

            parseNumber(
                b.trx
            ) -

            parseNumber(
                a.trx
            )
    );


    renderCards(
        "rankGrid3",
        data,
        "transaksi"
    );

}


/* =====================================================
   RENDER CARDS
===================================================== */

function renderCards(
    gridId,
    data,
    type
) {


    const grid =
        document.getElementById(
            gridId
        );


    grid.innerHTML =
        "";


    const total =
        data.length;


    data.forEach(
        (
            employee,
            index
        ) => {


            const rank =
                index + 1;


            /* =========================================
               CLASS RANK
            ========================================= */

            let rankClass =
                "rank-card";


            if (
                rank === 1
            ) {

                rankClass +=
                    " rank-1";

            }

            else if (
                rank === 2
            ) {

                rankClass +=
                    " rank-2";

            }

            else if (
                rank === 3
            ) {

                rankClass +=
                    " rank-3";

            }

            else if (
                rank >
                total - 5
            ) {

                rankClass +=
                    " bottom-5";

            }


            /* =========================================
               CHANGE
            ========================================= */

            const changeInfo =
                rankingData[index] || {

                    change:
                        "same",

                    changeText:
                        "-"

                };


            /* =========================================
               CARD
            ========================================= */

            const card =
                document.createElement(
                    "div"
                );


            card.className =
                rankClass;


            let valueHTML =
                "";


            /* =========================================
               SLIDE 1
            ========================================= */

            if (
                type ===
                "sales-ach"
            ) {

                valueHTML = `

                    <span
                        class="sales"
                    >
                        ${escapeHtml(
                            employee.sales ||
                            "-"
                        )}
                    </span>

                    <span
                        class="ach"
                    >
                        ${escapeHtml(
                            employee.ach ||
                            "-"
                        )}
                    </span>

                `;

            }


            /* =========================================
               SLIDE 2
            ========================================= */

            else if (
                type ===
                "proteksi"
            ) {

                valueHTML = `

                    <span
                        class="proteksi"
                    >
                        ${escapeHtml(
                            employee.proteksi ||
                            "-"
                        )}
                    </span>

                `;

            }


            /* =========================================
               SLIDE 3
            ========================================= */

            else if (
                type ===
                "transaksi"
            ) {

                valueHTML = `

                    <span
                        class="transaksi"
                    >
                        ${escapeHtml(
                            employee.trx ||
                            "-"
                        )}
                    </span>

                `;

            }



            card.innerHTML = `

                <span
                    class="rank-num"
                >
                    ${rank}
                </span>


                <span
                    class="change
                    ${changeInfo.change}"
                >
                    ${escapeHtml(
                        changeInfo.changeText
                    )}
                </span>


                <span
                    class="employee-name"
                >
                    ${escapeHtml(
                        employee.name
                    )}
                </span>


                ${valueHTML}

            `;


            grid.appendChild(
                card
            );

        }
    );

}


/* =====================================================
   PARSE NUMBER
===================================================== */

function parseNumber(
    value
) {


    if (
        value === null ||
        value === undefined ||
        value === ""
    ) {

        return 0;

    }


    if (
        typeof value === "number"
    ) {

        return value;

    }


    let text =
        String(value)
            .trim();


    /* =============================================
       HAPUS SIMBOL NON ANGKA
    ============================================= */

    text =
        text.replace(
            /[^\d,.\-]/g,
            ""
        );


    if (
        text === ""
    ) {

        return 0;

    }


    /* =============================================
       FORMAT INDONESIA
    ============================================= */

    if (
        text.includes(".") &&
        text.includes(",")
    ) {

        text =
            text
                .replace(
                    /\./g,
                    ""
                )
                .replace(
                    ",",
                    "."
                );

    }

    else if (
        text.includes(",")
    ) {

        const parts =
            text.split(",");


        if (
            parts.length === 2 &&
            parts[1].length <= 2
        ) {

            text =
                parts[0] +
                "." +
                parts[1];

        }

        else {

            text =
                text.replace(
                    /,/g,
                    ""
                );

        }

    }

    else if (
        text.includes(".")
    ) {

        const parts =
            text.split(".");


        if (
            parts.length === 2 &&
            parts[1].length <= 2
        ) {

            /* decimal */

        }

        else {

            text =
                text.replace(
                    /\./g,
                    ""
                );

        }

    }


    const number =
        parseFloat(
            text
        );


    if (
        isNaN(number)
    ) {

        return 0;

    }


    return number;

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(
    text
) {


    const div =
        document.createElement(
            "div"
        );


    div.textContent =
        text;


    return div.innerHTML;

}


/* =====================================================
   ERROR
===================================================== */

function showError(
    gridId,
    message
) {


    const grid =
        document.getElementById(
            gridId
        );


    grid.innerHTML = `

        <div class="error">

            <b>
                Gagal mengambil data.
            </b>

            <br>

            <small>
                ${escapeHtml(
                    message
                )}
            </small>

        </div>

    `;

}


/* =====================================================
   SLIDE ROTATION
   5 DETIK / SLIDE
===================================================== */

function nextSlide() {


    document
        .getElementById(
            "slide" +
            currentSlide
        )
        .classList
        .remove(
            "active"
        );


    currentSlide++;


    if (
        currentSlide > 3
    ) {

        currentSlide = 1;

    }


    document
        .getElementById(
            "slide" +
            currentSlide
        )
        .classList
        .add(
            "active"
        );

}


/* =====================================================
   MULAI SLIDE
===================================================== */

setInterval(
    nextSlide,
    SLIDE_DURATION
);


/* =====================================================
   LOAD DATA PERTAMA
===================================================== */

loadData();


/* =====================================================
   UPDATE DATA SETIAP 30 DETIK
===================================================== */

setInterval(
    loadData,
    30000
);

</script>


</body>
</html>
