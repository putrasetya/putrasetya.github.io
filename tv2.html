<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ACH SALES ID</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Arial, sans-serif;
        }

        body {
            width: 100vw;
            height: 100vh;
            background: linear-gradient(135deg, #e0f2fe 0%, #bae6fd 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
            overflow: hidden;
        }

        .container {
            width: 100%;
            max-width: 900px;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* =========================================
           HEADER
        ========================================= */

        .header {
            width: 100%;
            text-align: center;
            margin-bottom: 8px;
        }

        .title {
            font-size: 2rem;
            font-weight: 800;
            color: #0f172a;
            line-height: 1.1;
            letter-spacing: 1px;
        }

        /* =========================================
           RANKING GRID
        ========================================= */

        .rank-grid {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            flex-grow: 1;
            gap: 2px;
        }

        /* =========================================
           RANK CARD
        ========================================= */

        .rank-card {
            background: white;
            padding: 0 16px;
            height: 4.5vh;
            border-radius: 20px;
            display: flex;
            align-items: center;
            box-shadow: 0 1px 4px rgba(0,0,0,0.04);
            font-size: 0.85rem;
            font-weight: 600;
        }

        /* =========================================
           RANK 1 - GOLD
        ========================================= */

        .rank-card.rank-1 {
            background: linear-gradient(
                90deg,
                #fffbeb 0%,
                #fef3c7 50%,
                #fde68a 100%
            );

            border: 1.5px solid #f59e0b;

            box-shadow:
                0 2px 8px rgba(245,158,11,0.18);
        }

        /* =========================================
           RANK 2 - SILVER
        ========================================= */

        .rank-card.rank-2 {
            background: linear-gradient(
                90deg,
                #f8fafc 0%,
                #e2e8f0 50%,
                #cbd5e1 100%
            );

            border: 1.5px solid #94a3b8;

            box-shadow:
                0 2px 8px rgba(100,116,139,0.15);
        }

        /* =========================================
           RANK 3 - BRONZE
        ========================================= */

        .rank-card.rank-3 {
            background: linear-gradient(
                90deg,
                #fff7ed 0%,
                #ffedd5 50%,
                #fed7aa 100%
            );

            border: 1.5px solid #d97706;

            box-shadow:
                0 2px 8px rgba(217,119,6,0.15);
        }

        /* =========================================
           BOTTOM 5 - MERAH
        ========================================= */

        .rank-card.bottom-5 {
            background: linear-gradient(
                90deg,
                #fef2f2 0%,
                #fee2e2 50%,
                #fecaca 100%
            );

            border: 1px solid #fca5a5;
        }

        /* =========================================
           NOMOR RANK
        ========================================= */

        .rank-num {
            width: 30px;
            color: #475569;
            font-weight: 700;
            flex-shrink: 0;
        }

        /* =========================================
           PERUBAHAN RANK
        ========================================= */

        .change {
            width: 40px;
            font-size: 0.75rem;
            font-weight: 700;
            flex-shrink: 0;
        }

        .up {
            color: #16a34a;
        }

        .down {
            color: #dc2626;
        }

        .same {
            color: #94a3b8;
        }

        /* =========================================
           EMPLOYEE NAME
        ========================================= */

        .employee-name {
            flex-grow: 1;
            color: #0f172a;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* =========================================
           POINTS
        ========================================= */

        .points {
            font-weight: 800;
            color: #0f172a;
            margin-left: 10px;
            white-space: nowrap;
        }

        /* =========================================
           LOADING
        ========================================= */

        .loading {
            text-align: center;
            color: #475569;
            font-size: 1rem;
            font-weight: 600;
            padding: 20px;
        }

        /* =========================================
           ERROR
        ========================================= */

        .error {
            text-align: center;
            color: #dc2626;
            font-size: 0.9rem;
            font-weight: 600;
            padding: 20px;
        }

        /* =========================================
           MOBILE
        ========================================= */

        @media (max-width: 768px), (max-aspect-ratio: 1/1) {

            body {
                height: auto;
                min-height: 100vh;
                overflow: auto;
                align-items: flex-start;
            }

            .container {
                height: auto;
                justify-content: flex-start;
                gap: 10px;
            }

            .title {
                font-size: 1.5rem;
            }

            .rank-grid {
                gap: 6px;
            }

            .rank-card {
                height: 42px;
                font-size: 0.9rem;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <!-- HEADER -->
        <div class="header">
            <h1 class="title">ACH SALES ID</h1>
        </div>

        <!-- RANKING -->
        <div class="rank-grid" id="rankGrid">

            <div class="loading">
                Memuat employee name...
            </div>

        </div>

    </div>


    <script>

        /* =====================================================
           GOOGLE SPREADSHEET
        ===================================================== */

        const SPREADSHEET_ID =
            "16Alf0KUmqeaBx1zlsKfbcM5oPbzc18dBMgtlZYhP66M";

        const SHEET_NAME = "Sheet1";


        /* =====================================================
           URL GOOGLE SHEETS
        ===================================================== */

        const SHEET_URL =
            `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(SHEET_NAME)}`;


        /* =====================================================
           DATA RANKING CONTOH
           
           Bagian ini hanya sebagai data dummy untuk:
           - change
           - points

           NAMA EMPLOYEE akan diambil dari spreadsheet.
        ===================================================== */

        const rankingData = [
            {
                change: "same",
                changeText: "-"
            },
            {
                change: "same",
                changeText: "-"
            },
            {
                change: "up",
                changeText: "▲ 2"
            },
            {
                change: "same",
                changeText: "-"
            },
            {
                change: "up",
                changeText: "▲ 1"
            },
            {
                change: "up",
                changeText: "▲ 1"
            },
            {
                change: "down",
                changeText: "▼ 4"
            },
            {
                change: "same",
                changeText: "-"
            },
            {
                change: "same",
                changeText: "-"
            },
            {
                change: "up",
                changeText: "▲ 1"
            },
            {
                change: "down",
                changeText: "▼ 1"
            },
            {
                change: "same",
                changeText: "-"
            },
            {
                change: "up",
                changeText: "▲ 2"
            },
            {
                change: "down",
                changeText: "▼ 1"
            },
            {
                change: "same",
                changeText: "-"
            },
            {
                change: "up",
                changeText: "▲ 1"
            },
            {
                change: "down",
                changeText: "▼ 2"
            }
        ];


        /* =====================================================
           POINTS CONTOH
        ===================================================== */

        const pointsData = [
            "98.715",
            "92.184",
            "89.211",
            "87.754",
            "82.815",
            "81.598",
            "79.701",
            "78.598",
            "75.847",
            "69.856",
            "68.306",
            "66.407",
            "65.288",
            "64.221",
            "60.101",
            "59.970",
            "57.080"
        ];


        /* =====================================================
           AMBIL DATA GOOGLE SHEETS
        ===================================================== */

        async function loadEmployeeNames() {

            const rankGrid =
                document.getElementById("rankGrid");

            try {

                const response =
                    await fetch(SHEET_URL);

                if (!response.ok) {
                    throw new Error(
                        "Gagal mengakses Google Spreadsheet."
                    );
                }

                const text =
                    await response.text();


                /* =========================================
                   GOOGLE GVIZ MENGEMBALIKAN:

                   google.visualization.Query.setResponse({...});
                ========================================= */

                const jsonText =
                    text
                        .replace(
                            /^\s*google\.visualization\.Query\.setResponse\(/,
                            ""
                        )
                        .replace(
                            /\);\s*$/,
                            ""
                        );

                const data =
                    JSON.parse(jsonText);


                /* =========================================
                   AMBIL HEADER
                ========================================= */

                const headers =
                    data.table.cols.map(col =>
                        String(col.label || "")
                            .trim()
                            .toLowerCase()
                    );


                /* =========================================
                   CARI KOLOM "EMPLOYEE NAME"
                ========================================= */

                const employeeColumn =
    data.table.cols.findIndex(
        col =>
            String(col.label || "").trim() === "EMPLOYEE NAME"
    );


                if (employeeColumn === -1) {

                    throw new Error(
                        'Kolom "employee name" tidak ditemukan.'
                    );

                }


                /* =========================================
                   AMBIL SEMUA NAMA EMPLOYEE
                ========================================= */

                const employeeNames =
                    data.table.rows
                        .map(row => {

                            const cell =
                                row.c[
                                    employeeColumn
                                ];

                            if (!cell) {
                                return "";
                            }

                            return String(
                                cell.f ??
                                cell.v ??
                                ""
                            ).trim();

                        })
                        .filter(name => name !== "");


                if (employeeNames.length === 0) {

                    throw new Error(
                        "Tidak ada employee name di spreadsheet."
                    );

                }


                renderRanking(employeeNames);


            } catch (error) {

                console.error(
                    "ERROR:",
                    error
                );

                rankGrid.innerHTML = `
                    <div class="error">
                        Gagal mengambil employee name.<br>
                        <small>${error.message}</small>
                    </div>
                `;

            }

        }


        /* =====================================================
           RENDER RANKING
        ===================================================== */

        function renderRanking(employeeNames) {

            const rankGrid =
                document.getElementById("rankGrid");


            rankGrid.innerHTML = "";


            const total =
                employeeNames.length;


            employeeNames.forEach(
                (employeeName, index) => {

                    const rank =
                        index + 1;


                    /* =====================================
                       CLASS WARNA
                    ===================================== */

                    let rankClass =
                        "rank-card";


                    if (rank === 1) {

                        rankClass +=
                            " rank-1";

                    }
                    else if (rank === 2) {

                        rankClass +=
                            " rank-2";

                    }
                    else if (rank === 3) {

                        rankClass +=
                            " rank-3";

                    }
                    else if (
                        rank > total - 5
                    ) {

                        rankClass +=
                            " bottom-5";

                    }


                    /* =====================================
                       CHANGE
                    ===================================== */

                    const changeInfo =
                        rankingData[index] || {
                            change: "same",
                            changeText: "-"
                        };


                    /* =====================================
                       POINTS
                    ===================================== */

                    const points =
                        pointsData[index] || "-";


                    /* =====================================
                       BUAT CARD
                    ===================================== */

                    const card =
                        document.createElement("div");

                    card.className =
                        rankClass;


                    card.innerHTML = `
                        <span class="rank-num">
                            ${rank}
                        </span>

                        <span class="change ${changeInfo.change}">
                            ${changeInfo.changeText}
                        </span>

                        <span class="employee-name">
                            ${escapeHtml(employeeName)}
                        </span>

                        <span class="points">
                            ${points}
                        </span>
                    `;


                    rankGrid.appendChild(card);

                }
            );

        }


        /* =====================================================
           KEAMANAN TEXT EMPLOYEE NAME
        ===================================================== */

        function escapeHtml(text) {

            const div =
                document.createElement("div");

            div.textContent =
                text;

            return div.innerHTML;

        }


        /* =====================================================
           LOAD DATA SAAT HALAMAN DIBUKA
        ===================================================== */

        loadEmployeeNames();


        /* =====================================================
           AUTO REFRESH DATA EMPLOYEE
           SETIAP 30 DETIK
        ===================================================== */

        setInterval(
            loadEmployeeNames,
            30000
        );

    </script>

</body>
</html>
