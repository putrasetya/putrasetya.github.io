<script>

/* =====================================================
   GOOGLE SPREADSHEET
===================================================== */

const SPREADSHEET_ID =
    "16Alf0KUmqeaBx1zlsKfbcM5oPbzc18dBMgtlZYhP66M";


const SHEET_NAME =
    "Sheet1";


const SHEET_URL =

    "https://docs.google.com/spreadsheets/d/" +

    SPREADSHEET_ID +

    "/gviz/tq?tqx=out:json&sheet=" +

    encodeURIComponent(
        SHEET_NAME
    );


/* =====================================================
   SLIDE SETTINGS
===================================================== */

const SLIDE_DURATION =
    5000;


let currentSlide =
    1;


let employeeData =
    [];


/* =====================================================
   RANK CHANGE
===================================================== */

const rankingData = [

    {
        change: "same",
        changeText: "-"
    },

    {
        change: "same",
        changeText: "-"
    },

    {
        change: "up",
        changeText: "▲ 2"
    },

    {
        change: "same",
        changeText: "-"
    },

    {
        change: "up",
        changeText: "▲ 1"
    },

    {

        changeText: "▲ 1"
    },

    {
        change: "down",
        changeText: "▼ 4"
    },

    {
        change: "same",
        changeText: "-"
    },

    {
        change: "same",
        changeText: "-"
    },

    {
        change: "up",
        changeText: "▲ 1"
    },

    {
        change: "down",
        changeText: "▼ 1"
    },

    {
        change: "same",
        changeText: "-"
    },

    {
        change: "up",
        changeText: "▲ 2"
    },

    {
        change: "down",
        changeText: "▼ 1"
    },

    {
        change: "same",
        changeText: "-"
    },

    {
        change: "up",
        changeText: "▲ 1"
    },

    {
        change: "down",
        changeText: "▼ 2"
    }

];


/* =====================================================
   LOAD DATA
===================================================== */

async function loadData() {

    try {

        const response =
            await fetch(
                SHEET_URL +
                "&t=" +
                Date.now()
            );


        if (!response.ok) {

            throw new Error(
                "Spreadsheet tidak dapat diakses."
            );

        }


        const text =
            await response.text();


        let jsonText =
            text.trim();


        jsonText =
            jsonText.replace(
                /^\/\*[\s\S]*?\*\/\s*/,
                ""
            );


        const start =
            jsonText.indexOf("{");


        const end =
            jsonText.lastIndexOf("}");


        if (
            start === -1 ||
            end === -1
        ) {

            throw new Error(
                "Format data Google Sheets tidak valid."
            );

        }


        jsonText =
            jsonText.substring(
                start,
                end + 1
            );


        const data =
            JSON.parse(
                jsonText
            );


        if (
            !data ||
            !data.table ||
            !data.table.cols
        ) {

            throw new Error(
                "Data spreadsheet tidak ditemukan."
            );

        }


        /* =============================================
           HEADER
        ============================================= */

        const employeeColumn =
            findColumn(
                data.table.cols,
                "EMPLOYEE NAME"
            );


        const codeJobColumn =
            findColumn(
                data.table.cols,
                "CODE JOB"
            );


        const salesColumn =
            findColumn(
                data.table.cols,
                "SALES MTD"
            );


        const achColumn =
            findColumn(
                data.table.cols,
                "ACH MTD"
            );


        const proteksiColumn =
            findColumn(
                data.table.cols,
                "PROTEKSI"
            );


        const achProteksiColumn =
            findColumn(
                data.table.cols,
                "ACH PROTEKSI"
            );


        const trxColumn =
            findColumn(
                data.table.cols,
                "TRX"
            );


        const achBulananColumn =
            findColumn(
                data.table.cols,
                "ACH BULANAN"
            );


        /* =============================================
           VALIDASI
        ============================================= */

        const requiredColumns = [

            [
                employeeColumn,
                "EMPLOYEE NAME"
            ],

            [
                codeJobColumn,
                "CODE JOB"
            ],

            [
                salesColumn,
                "SALES MTD"
            ],

            [
                achColumn,
                "ACH MTD"
            ],

            [
                proteksiColumn,
                "PROTEKSI"
            ],

            [
                achProteksiColumn,
                "ACH PROTEKSI"
            ],

            [
                trxColumn,
                "TRX"
            ],

            [
                achBulananColumn,
                "ACH BULANAN"
            ]

        ];


        for (
            const [
                index,
                name
            ]
            of requiredColumns
        ) {

            if (
                index === -1
            ) {

                throw new Error(
                    `Header "${name}" tidak ditemukan.`
                );

            }

        }


        /* =============================================
           DATA
        ============================================= */

        employeeData =

            data.table.rows

                .map(
                    row => {

                        if (
                            !row.c
                        ) {

                            return null;

                        }


                        const name =
                            getCellValue(
                                row.c[
                                    employeeColumn
                                ]
                            );


                        if (
                            name === ""
                        ) {

                            return null;

                        }


                        return {

                            name:
                                name,

                            codeJob:
                                getCellValue(
                                    row.c[
                                        codeJobColumn
                                    ]
                                ),

                            sales:
                                getCellValue(
                                    row.c[
                                        salesColumn
                                    ]
                                ),

                            ach:
                                getCellValue(
                                    row.c[
                                        achColumn
                                    ]
                                ),

                            proteksi:
                                getCellValue(
                                    row.c[
                                        proteksiColumn
                                    ]
                                ),

                            achProteksi:
                                getCellValue(
                                    row.c[
                                        achProteksiColumn
                                    ]
                                ),

                            trx:
                                getCellValue(
                                    row.c[
                                        trxColumn
                                    ]
                                ),

                            achBulanan:
                                getCellValue(
                                    row.c[
                                        achBulananColumn
                                    ]
                                )

                        };

                    }
                )

                .filter(
                    item =>
                        item !== null
                );


        /* =============================================
           RENDER
        ============================================= */

        renderSlide1();

        renderSlide2();

        renderSlide3();

    }

    catch (error) {

        console.error(
            error
        );


        showError(
            "rankGrid1",
            error.message
        );


        showError(
            "rankGrid2",
            error.message
        );


        showError(
            "rankGrid3",
            error.message
        );

    }

}


/* =====================================================
   GET CELL VALUE
===================================================== */

function getCellValue(
    cell
) {

    if (
        !cell
    ) {

        return "";

    }


    return String(
        cell.f ??
        cell.v ??
        ""
    ).trim();

}


/* =====================================================
   FIND COLUMN
===================================================== */

function findColumn(
    columns,
    target
) {

    return columns.findIndex(
        col =>

            String(
                col.label || ""
            )
            .trim()
            .toUpperCase() ===
            target.toUpperCase()
    );

}


/* =====================================================
   EXCLUDE CASHIER / CS
===================================================== */

function isExcludedCodeJob(
    codeJob
) {

    const value =
        String(
            codeJob || ""
        )
        .trim()
        .toUpperCase();


    return (
        value === "CASHIER" ||
        value === "CS"
    );

}


/* =====================================================
   SLIDE 1
   SORT ACH MTD
===================================================== */

function renderSlide1() {

    const data =
        employeeData
            .filter(
                employee =>
                    !isExcludedCodeJob(
                        employee.codeJob
                    )
            );


    data.sort(
        (a, b) =>
            parseNumber(
                b.ach
            ) -
            parseNumber(
                a.ach
            )
    );


    renderCards(
        "rankGrid1",
        data,
        "sales-ach"
    );

}


/* =====================================================
   SLIDE 2
   SORT PROTEKSI
===================================================== */

function renderSlide2() {

    const data =
        [...employeeData];


    data.sort(
        (a, b) =>
            parseNumber(
                b.proteksi
            ) -
            parseNumber(
                a.proteksi
            )
    );


    renderCards(
        "rankGrid2",
        data,
        "proteksi"
    );

}


/* =====================================================
   SLIDE 3
   SORT TRX
===================================================== */

function renderSlide3() {

    const data =
        employeeData
            .filter(
                employee =>
                    !isExcludedCodeJob(
                        employee.codeJob
                    )
            );


    data.sort(
        (a, b) =>
            parseNumber(
                b.trx
            ) -
            parseNumber(
                a.trx
            )
    );


    renderCards(
        "rankGrid3",
        data,
        "transaksi"
    );

}


/* =====================================================
   RENDER CARDS
===================================================== */

function renderCards(
    gridId,
    data,
    type
) {

    const grid =
        document.getElementById(
            gridId
        );


    grid.innerHTML =
        "";


    if (
        data.length === 0
    ) {

        grid.innerHTML = `

            <div class="error">
                Tidak ada data employee.
            </div>

        `;

        return;

    }


    const total =
        data.length;


    data.forEach(
        (
            employee,
            index
        ) => {

            const rank =
                index + 1;


            let rankClass =
                "rank-card";


            if (
                rank === 1
            ) {

                rankClass +=
                    " rank-1";

            }

            else if (
                rank === 2
            ) {

                rankClass +=
                    " rank-2";

            }

            else if (
                rank === 3
            ) {

                rankClass +=
                    " rank-3";

            }

            else if (
                rank >
                total - 5
            ) {

                rankClass +=
                    " bottom-5";

            }


            const changeInfo =
                rankingData[index] || {

                    change:
                        "same",

                    changeText:
                        "-"

                };


            let valueHTML =
                "";


            /* =========================================
               SLIDE 1
            ========================================= */

            if (
                type ===
                "sales-ach"
            ) {

                valueHTML = `

                    <span class="sales">
                        ${escapeHtml(
                            employee.sales || "-"
                        )}
                    </span>

                    <span class="ach">
                        ${escapeHtml(
                            employee.ach || "-"
                        )}
                    </span>

                `;

            }


            /* =========================================
               SLIDE 2
            ========================================= */

            else if (
                type ===
                "proteksi"
            ) {

                valueHTML = `

                    <span class="proteksi">
                        ${escapeHtml(
                            employee.proteksi || "-"
                        )}
                    </span>

                    <span class="ach-proteksi">
                        ${escapeHtml(
                            employee.achProteksi || "-"
                        )}
                    </span>

                `;

            }


            /* =========================================
               SLIDE 3
            ========================================= */

            else if (
                type ===
                "transaksi"
            ) {

                valueHTML = `

                    <span class="transaksi">
                        ${escapeHtml(
                            employee.trx || "-"
                        )}
                    </span>

                    <span class="ach-bulanan">
                        ${escapeHtml(
                            employee.achBulanan || "-"
                        )}
                    </span>

                `;

            }


            const card =
                document.createElement(
                    "div"
                );


            card.className =
                rankClass;


            card.innerHTML = `

                <span class="rank-num">
                    ${rank}
                </span>

                <span class="change ${changeInfo.change}">
                    ${escapeHtml(
                        changeInfo.changeText
                    )}
                </span>

                <span class="employee-name">
                    ${escapeHtml(
                        employee.name
                    )}
                </span>

                ${valueHTML}

            `;


            grid.appendChild(
                card
            );

        }
    );

}


/* =====================================================
   PARSE NUMBER
===================================================== */

function parseNumber(
    value
) {

    if (
        value === null ||
        value === undefined ||
        value === ""
    ) {

        return 0;

    }


    if (
        typeof value === "number"
    ) {

        return value;

    }


    let text =
        String(value)
            .trim();


    text =
        text.replace(
            /[^\d,.\-]/g,
            ""
        );


    if (
        text === ""
    ) {

        return 0;

    }


    if (
        text.includes(".") &&
        text.includes(",")
    ) {

        text =
            text
                .replace(
                    /\./g,
                    ""
                )
                .replace(
                    ",",
                    "."
                );

    }

    else if (
        text.includes(",")
    ) {

        const parts =
            text.split(",");


        if (
            parts.length === 2 &&
            parts[1].length <= 2
        ) {

            text =
                parts[0] +
                "." +
                parts[1];

        }

        else {

            text =
                text.replace(
                    /,/g,
                    ""
                );

        }

    }

    else if (
        text.includes(".")
    ) {

        const parts =
            text.split(".");


        if (
            !(
                parts.length === 2 &&
                parts[1].length <= 2
            )
        ) {

            text =
                text.replace(
                    /\./g,
                    ""
                );

        }

    }


    const number =
        parseFloat(
            text
        );


    return isNaN(number)
        ? 0
        : number;

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(
    text
) {

    const div =
        document.createElement(
            "div"
        );


    div.textContent =
        text;


    return div.innerHTML;

}


/* =====================================================

function showError(
    gridId,
    message
) {

    const grid =
        document.getElementById(
            gridId
        );


    grid.innerHTML = `

        <div class="error">

            <b>
                Gagal mengambil data.
            </b>

            <br>

            <small>
                ${escapeHtml(
                    message
                )}
            </small>

        </div>

    `;

}


/* =====================================================

===================================================== */

function nextSlide() {

    document
        .getElementById(
            "slide" +
            currentSlide
        )
        .classList
        .remove(
            "active"
        );


    currentSlide++;


    if (
        currentSlide > 3
    ) {

        currentSlide = 1;

    }


    document
        .getElementById(
            "slide" +
            currentSlide
        )
        .classList
        .add(
            "active"
        );

}
