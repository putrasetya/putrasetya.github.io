<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>AZKO SALES RANKING</title>

<style>

/* =====================================================
   RESET
===================================================== */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: 'Segoe UI', Arial, sans-serif;
}


/* =====================================================
   BODY
===================================================== */

html,
body {

    width: 100%;
    height: 100%;

    overflow: hidden;
}


body {

    background:
        linear-gradient(
            135deg,
            #e0f2fe 0%,
            #bae6fd 100%
        );

    display: flex;

    justify-content: center;
    align-items: center;

    padding: 10px;
}


/* =====================================================
   CONTAINER
===================================================== */

.container {

    width: 100%;
    max-width: 1100px;

    height: 100%;

    display: flex;
    flex-direction: column;

    min-height: 0;
}


/* =====================================================
   SLIDE
===================================================== */

.slide {

    width: 100%;
    height: 100%;

    display: none;

    flex-direction: column;

    min-height: 0;

    overflow: hidden;
}


.slide.active {

    display: flex;
}


/* =====================================================
   HEADER
===================================================== */

.header {

    width: 100%;

    text-align: center;

    flex-shrink: 0;

    margin-bottom: 6px;
}


.title {

    font-size: 2rem;

    font-weight: 800;

    color: #0f172a;

    line-height: 1.1;

    letter-spacing: 1px;
}


/* =====================================================
   RANK GRID
===================================================== */

.rank-grid {

    width: 100%;

    flex: 1 1 auto;

    min-height: 0;

    display: flex;

    flex-direction: column;

    justify-content: flex-start;

    gap: 2px;

    overflow: hidden;
}


/* =====================================================
   RANK CARD
===================================================== */

.rank-card {

    width: 100%;

    height: 4.5vh;

    min-height: 30px;

    flex-shrink: 0;

    background: white;

    padding: 0 16px;

    border-radius: 20px;

    display: flex;

    align-items: center;

    box-shadow:
        0 1px 4px
        rgba(0,0,0,0.04);

    font-size: 0.85rem;

    font-weight: 600;
}


/* =====================================================
   RANK 1
===================================================== */

.rank-card.rank-1 {

    background:
        linear-gradient(
            90deg,
            #fffbeb 0%,
            #fef3c7 50%,
            #fde68a 100%
        );

    border:
        1.5px solid #f59e0b;

    box-shadow:
        0 2px 8px
        rgba(245,158,11,0.18);
}


/* =====================================================
   RANK 2
===================================================== */

.rank-card.rank-2 {

    background:
        linear-gradient(
            90deg,
            #f8fafc 0%,
            #e2e8f0 50%,
            #cbd5e1 100%
        );

    border:
        1.5px solid #94a3b8;

    box-shadow:
        0 2px 8px
        rgba(100,116,139,0.15);
}


/* =====================================================
   RANK 3
===================================================== */

.rank-card.rank-3 {

    background:
        linear-gradient(
            90deg,
            #fff7ed 0%,
            #ffedd5 50%,
            #fed7aa 100%
        );

    border:
        1.5px solid #d97706;

    box-shadow:
        0 2px 8px
        rgba(217,119,6,0.15);
}


/* =====================================================
   BOTTOM 5
===================================================== */

.rank-card.bottom-5 {

    background:
        linear-gradient(
            90deg,
            #fef2f2 0%,
            #fee2e2 50%,
            #fecaca 100%
        );

    border:
        1px solid #fca5a5;
}


/* =====================================================
   RANK NUMBER
===================================================== */

.rank-num {

    width: 30px;

    color: #475569;

    font-weight: 700;

    flex-shrink: 0;
}


/* =====================================================
   CHANGE
===================================================== */

.change {

    width: 40px;

    font-size: 0.75rem;

    font-weight: 700;

    flex-shrink: 0;
}


.up {
    color: #16a34a;
}


.down {
    color: #dc2626;
}


.same {
    color: #94a3b8;
}


/* =====================================================
   EMPLOYEE NAME
===================================================== */

.employee-name {

    flex: 1 1 auto;

    min-width: 0;

    color: #0f172a;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;
}


/* =====================================================
   SALES
===================================================== */

.sales {

    width: 110px;

    font-weight: 800;

    color: #0f172a;

    margin-left: 10px;

    white-space: nowrap;

    text-align: right;

    flex-shrink: 0;
}


/* =====================================================
   ACH MTD
===================================================== */

.ach {

    width: 85px;

    font-weight: 800;

    color: #0f172a;

    margin-left: 15px;

    white-space: nowrap;

    text-align: right;

    flex-shrink: 0;
}


/* =====================================================
   PROTEKSI
===================================================== */

.proteksi {

    width: 110px;

    font-weight: 800;

    color: #0f172a;

    margin-left: 15px;

    white-space: nowrap;

    text-align: right;

    flex-shrink: 0;
}


/* =====================================================
   ACH PROTEKSI
===================================================== */

.ach-proteksi {

    width: 85px;

    font-weight: 800;

    color: #0f172a;

    margin-left: 15px;

    white-space: nowrap;

    text-align: right;

    flex-shrink: 0;
}


/* =====================================================
   TRANSAKSI
===================================================== */

.transaksi {

    width: 110px;

    font-weight: 800;

    color: #0f172a;

    margin-left: 15px;

    white-space: nowrap;

    text-align: right;

    flex-shrink: 0;
}


/* =====================================================
   ACH BULANAN
===================================================== */

.ach-bulanan {

    width: 85px;

    font-weight: 800;

    color: #0f172a;

    margin-left: 15px;

    white-space: nowrap;

    text-align: right;

    flex-shrink: 0;
}


/* =====================================================
   LOADING / ERROR
===================================================== */

.loading,
.error {

    text-align: center;

    padding: 20px;

    font-weight: 600;
}


.loading {
    color: #475569;
}


.error {
    color: #dc2626;
}


/* =====================================================
   MOBILE / TABLET
===================================================== */

@media (
    max-width: 768px
),
(
    max-aspect-ratio: 1/1
) {

    html,
    body {

        height: auto;

        min-height: 100%;

        overflow: auto;
    }


    body {

        align-items: flex-start;

        padding: 15px;
    }


    .container {

        height: auto;

        min-height: 0;
    }


    .title {

        font-size: 1.5rem;
    }


    .rank-grid {

        gap: 6px;

        overflow: visible;
    }


    .rank-card {

        height: 42px;

        min-height: 42px;

        font-size: 0.9rem;

        padding: 0 10px;
    }


    .rank-num {

        width: 28px;
    }


    .change {

        width: 38px;
    }


    .sales {

        width: 95px;

        margin-left: 8px;
    }


    .ach {

        width: 70px;

        margin-left: 10px;
    }


    .proteksi {

        width: 95px;

        margin-left: 8px;
    }


    .ach-proteksi {

        width: 70px;

        margin-left: 10px;
    }


    .transaksi {

        width: 95px;

        margin-left: 8px;
    }


    .ach-bulanan {

        width: 70px;

        margin-left: 10px;
    }

}


/* =====================================================
   TV LANDSCAPE
===================================================== */

@media screen and
(min-width: 1200px) and
(orientation: landscape) {

    body {

        padding: 8px;
    }


    .container {

        max-width: 1100px;

        height: 100%;
    }


    .rank-card {

        background: #ffffff !important;
    }


    .rank-card.rank-1 {

        background: #ffffff !important;
    }


    .rank-card.rank-2 {

        background: #ffffff !important;
    }


    .rank-card.rank-3 {

        background: #ffffff !important;
    }


    .rank-card.bottom-5 {

        background: #ffffff !important;
    }


    /*
       Proteksi dikontrol JavaScript.
       CSS hanya memastikan tidak ada overflow.
    */

    #slide2 {

        height: 100%;

        min-height: 0;

        overflow: hidden;
    }


    #slide2 .header {

        flex-shrink: 0;

        margin-bottom: 2px;
    }


    #slide2 .rank-grid {

        flex: 1 1 auto;

        min-height: 0;

        height: auto;

        overflow: hidden;

        gap: 1px;
    }


    #slide2 .rank-card {

        min-height: 0;

        max-height: none;

        height: auto;

        border-radius: 12px;

        padding: 0 12px;

        font-size: 0.78rem;
    }

}


/* =====================================================
   TV BESAR
===================================================== */

@media screen and
(min-width: 1800px) and
(orientation: landscape) {

    .title {

        font-size: 2.2rem;
    }


    #slide2 .rank-card {

        font-size: 0.9rem;

        border-radius: 14px;
    }

}


/* =====================================================
   TV SANGAT BESAR / 4K
===================================================== */

@media screen and
(min-width: 3000px) and
(orientation: landscape) {

    .container {

        max-width: 1500px;
    }


    .title {

        font-size: 2.8rem;
    }


    #slide2 .rank-card {

        font-size: 1.1rem;
    }

}

</style>

</head>

<div class="container">


    <!-- =================================================
         SLIDE 1
    ================================================== -->

    <div
        class="slide active"
        id="slide1"
    >

        <div class="header">

            <h1 class="title">
                ACH MTD SALES ID
            </h1>

        </div>


        <div
            class="rank-grid"
            id="rankGrid1"
        >

            <div class="loading">
                Memuat data...
            </div>

        </div>

    </div>


    <!-- =================================================
         SLIDE 2
    ================================================== -->

    <div
        class="slide"
        id="slide2"
    >

        <div class="header">

            <h1 class="title">
                PROTEKSI
            </h1>

        </div>


        <div
            class="rank-grid"
            id="rankGrid2"
        >

            <div class="loading">
                Memuat data...
            </div>

        </div>

    </div>


    <!-- =================================================
         SLIDE 3
    ================================================== -->

    <div
        class="slide"
        id="slide3"
    >

        <div class="header">

            <h1 class="title">
                TRANSAKSI
            </h1>

        </div>


        <div
            class="rank-grid"
            id="rankGrid3"
        >

            <div class="loading">
                Memuat data...
            </div>

        </div>

    </div>

</div>


<script>

/* =====================================================
   GOOGLE SPREADSHEET
===================================================== */

const SPREADSHEET_ID =
    "16Alf0KUmqeaBx1zlsKfbcM5oPbzc18dBMgtlZYhP66M";


const SHEET_NAME =
    "Sheet1";


const SHEET_URL =
    "https://docs.google.com/spreadsheets/d/" +
    SPREADSHEET_ID +
    "/gviz/tq?tqx=out:json&sheet=" +
    encodeURIComponent(
        SHEET_NAME
    );


/* =====================================================
   SLIDE
===================================================== */

const SLIDE_DURATION =
    5000;


let currentSlide =
    1;


let employeeData =
    [];


/* =====================================================
   RANK CHANGE
===================================================== */

const rankingData = [

    {
        change: "same",
        changeText: "-"
    },

    {
        change: "same",
        changeText: "-"
    },

    {
        change: "up",
        changeText: "▲ 2"
    },

    {
        change: "same",
        changeText: "-"
    },

    {
        change: "up",
        changeText: "▲ 1"
    },

    {
        change: "up",
        changeText: "▲ 1"
    },

    {
        change: "down",
        changeText: "▼ 4"
    },

    {
        change: "same",
        changeText: "-"
    },

    {
        change: "same",
        changeText: "-"
    },

    {
        change: "up",
        changeText: "▲ 1"
    },

    {
        change: "down",
        changeText: "▼ 1"
    },

    {
        change: "same",
        changeText: "-"
    },

    {
        change: "up",
        changeText: "▲ 2"
    },

    {
        change: "down",
        changeText: "▼ 1"
    },

    {
        change: "same",
        changeText: "-"
    },

    {
        change: "up",
        changeText: "▲ 1"
    },

    {
        change: "down",
        changeText: "▼ 2"
    }

];


/* =====================================================
   LOAD DATA
===================================================== */

async function loadData() {

    try {

        const response =
            await fetch(
                SHEET_URL +
                "&t=" +
                Date.now()
            );


        if (!response.ok) {

            throw new Error(
                "Spreadsheet tidak dapat diakses."
            );

        }


        const text =
            await response.text();


        let jsonText =
            text.trim();


        jsonText =
            jsonText.replace(
                /^\/\*[\s\S]*?\*\/\s*/,
                ""
            );


        const start =
            jsonText.indexOf("{");


        const end =
            jsonText.lastIndexOf("}");


        if (
            start === -1 ||
            end === -1
        ) {

            throw new Error(
                "Format data Google Sheets tidak valid."
            );

        }


        jsonText =
            jsonText.substring(
                start,
                end + 1
            );


        const data =
            JSON.parse(
                jsonText
            );


        if (
            !data ||
            !data.table ||
            !data.table.cols
        ) {

            throw new Error(
                "Data spreadsheet tidak ditemukan."
            );

        }


        /* =============================================
           HEADER
        ============================================= */

        const employeeColumn =
            findColumn(
                data.table.cols,
                "EMPLOYEE NAME"
            );


        const codeJobColumn =
            findColumn(
                data.table.cols,
                "CODE JOB"
            );


        const salesColumn =
            findColumn(
                data.table.cols,
                "SALES MTD"
            );


        const achColumn =
            findColumn(
                data.table.cols,
                "ACH MTD"
            );


        const proteksiColumn =
            findColumn(
                data.table.cols,
                "PROTEKSI"
            );


        const achProteksiColumn =
            findColumn(
                data.table.cols,
                "ACH PROTEKSI"
            );


        const trxColumn =
            findColumn(
                data.table.cols,
                "TRX"
            );


        const achBulananColumn =
            findColumn(
                data.table.cols,
                "ACH BULANAN"
            );


        const requiredColumns = [

            [
                employeeColumn,
                "EMPLOYEE NAME"
            ],

            [
                codeJobColumn,
                "CODE JOB"
            ],

            [
                salesColumn,
                "SALES MTD"
            ],

            [
                achColumn,
                "ACH MTD"
            ],

            [
                proteksiColumn,
                "PROTEKSI"
            ],

            [
                achProteksiColumn,
                "ACH PROTEKSI"
            ],

            [
                trxColumn,
                "TRX"
            ],

            [
                achBulananColumn,
                "ACH BULANAN"
            ]

        ];


        for (
            const [
                index,
                name
            ]
            of requiredColumns
        ) {

            if (
                index === -1
            ) {

                throw new Error(
                    `Header "${name}" tidak ditemukan.`
                );

            }

        }


        /* =============================================
           DATA
        ============================================= */

        employeeData =

            data.table.rows

                .map(
                    row => {

                        if (
                            !row.c
                        ) {

                            return null;

                        }


                        const name =
                            getCellValue(
                                row.c[
                                    employeeColumn
                                ]
                            );


                        if (
                            name === ""
                        ) {

                            return null;

                        }


                        return {

                            name:
                                name,

                            codeJob:
                                getCellValue(
                                    row.c[
                                        codeJobColumn
                                    ]
                                ),

                            sales:
                                getCellValue(
                                    row.c[
                                        salesColumn
                                    ]
                                ),

                            ach:
                                getCellValue(
                                    row.c[
                                        achColumn
                                    ]
                                ),

                            proteksi:
                                getCellValue(
                                    row.c[
                                        proteksiColumn
                                    ]
                                ),

                            achProteksi:
                                getCellValue(
                                    row.c[
                                        achProteksiColumn
                                    ]
                                ),

                            trx:
                                getCellValue(
                                    row.c[
                                        trxColumn
                                    ]
                                ),

                            achBulanan:
                                getCellValue(
                                    row.c[
                                        achBulananColumn
                                    ]
                                )

                        };

                    }
                )

                .filter(
                    item =>
                        item !== null
                );


        renderSlide1();

        renderSlide2();

        renderSlide3();


        /*
           Setelah data selesai dirender,
           hitung ulang ukuran Proteksi.
        */

        setTimeout(
            fitProteksiToScreen,
            50
        );

    }

    catch (error) {

        console.error(
            "Gagal mengambil data:",
            error
        );


        showError(
            "rankGrid1",
            error.message
        );


        showError(
            "rankGrid2",
            error.message
        );


        showError(
            "rankGrid3",
            error.message
        );

    }

}


/* =====================================================
   CELL VALUE
===================================================== */

function getCellValue(
    cell
) {

    if (
        !cell
    ) {

        return "";

    }


    return String(
        cell.f ??
        cell.v ??
        ""
    ).trim();

}


/* =====================================================
   FIND COLUMN
===================================================== */

function findColumn(
    columns,
    target
) {

    return columns.findIndex(
        col =>

            String(
                col.label || ""
            )
            .trim()
            .toUpperCase() ===
            target.toUpperCase()
    );

}


/* =====================================================
   EXCLUDE CASHIER / CS
===================================================== */

function isExcludedCodeJob(
    codeJob
) {

    const value =
        String(
            codeJob || ""
        )
        .trim()
        .toUpperCase();


    return (
        value === "CASHIER" ||
        value === "CS"
    );

}


/* =====================================================
   SLIDE 1
===================================================== */

function renderSlide1() {

    const data =
        employeeData
            .filter(
                employee =>
                    !isExcludedCodeJob(
                        employee.codeJob
                    )
            );


    data.sort(
        (a, b) =>
            parseNumber(
                b.ach
            ) -
            parseNumber(
                a.ach
            )
    );


    renderCards(
        "rankGrid1",
        data,
        "sales-ach"
    );

}


/* =====================================================
   SLIDE 2
===================================================== */

function renderSlide2() {

    const data =
        [...employeeData];


    data.sort(
        (a, b) =>
            parseNumber(
                b.proteksi
            ) -
            parseNumber(
                a.proteksi
            )
    );


    renderCards(
        "rankGrid2",
        data,
        "proteksi"
    );

}


/* =====================================================
   SLIDE 3
===================================================== */

function renderSlide3() {

    const data =
        employeeData
            .filter(
                employee =>
                    !isExcludedCodeJob(
                        employee.codeJob
                    )
            );


    data.sort(
        (a, b) =>
            parseNumber(
                b.trx
            ) -
            parseNumber(
                a.trx
            )
    );


    renderCards(
        "rankGrid3",
        data,
        "transaksi"
    );

}


/* =====================================================
   RENDER CARDS
===================================================== */

function renderCards(
    gridId,
    data,
    type
) {

    const grid =
        document.getElementById(
            gridId
        );


    grid.innerHTML =
        "";


    if (
        data.length === 0
    ) {

        grid.innerHTML = `

            <div class="error">
                Tidak ada data employee.
            </div>

        `;

        return;

    }


    const total =
        data.length;


    data.forEach(
        (
            employee,
            index
        ) => {

            const rank =
                index + 1;


            let rankClass =
                "rank-card";


            if (
                rank === 1
            ) {

                rankClass +=
                    " rank-1";

            }

            else if (
                rank === 2
            ) {

                rankClass +=
                    " rank-2";

            }

            else if (
                rank === 3
            ) {

                rankClass +=
                    " rank-3";

            }

            else if (
                rank >
                total - 5
            ) {

                rankClass +=
                    " bottom-5";

            }


            const changeInfo =
                rankingData[index] || {

                    change:
                        "same",

                    changeText:
                        "-"

                };


            let valueHTML =
                "";


            if (
                type ===
                "sales-ach"
            ) {

                valueHTML = `

                    <span class="sales">
                        ${escapeHtml(
                            employee.sales || "-"
                        )}
                    </span>

                    <span class="ach">
                        ${escapeHtml(
                            employee.ach || "-"
                        )}
                    </span>

                `;

            }


            else if (
                type ===
                "proteksi"
            ) {

                valueHTML = `

                    <span class="proteksi">
                        ${escapeHtml(
                            employee.proteksi || "-"
                        )}
                    </span>

                    <span class="ach-proteksi">
                        ${escapeHtml(
                            employee.achProteksi || "-"
                        )}
                    </span>

                `;

            }


            else if (
                type ===
                "transaksi"
            ) {

                valueHTML = `

                    <span class="transaksi">
                        ${escapeHtml(
                            employee.trx || "-"
                        )}
                    </span>

                    <span class="ach-bulanan">
                        ${escapeHtml(
                            employee.achBulanan || "-"
                        )}
                    </span>

                `;

            }


            const card =
                document.createElement(
                    "div"
                );


            card.className =
                rankClass;


            card.innerHTML = `

                <span class="rank-num">
                    ${rank}
                </span>

                <span class="change ${changeInfo.change}">
                    ${escapeHtml(
                        changeInfo.changeText
                    )}
                </span>

                <span class="employee-name">
                    ${escapeHtml(
                        employee.name
                    )}
                </span>

                ${valueHTML}

            `;


            grid.appendChild(
                card
            );

        }
    );

}


/* =====================================================
   FIT PROTEKSI
   ==============================================
   INI BAGIAN UTAMA UNTUK TV
===================================================== */

function fitProteksiToScreen() {

    const slide =
        document.getElementById(
            "slide2"
        );


    const grid =
        document.getElementById(
            "rankGrid2"
        );


    if (
        !slide ||
        !grid
    ) {

        return;

    }


    const cards =
        grid.querySelectorAll(
            ".rank-card"
        );


    if (
        cards.length === 0
    ) {

        return;

    }


    /*
       Hanya jalankan mode ini
       untuk landscape / TV.
    */

    if (
        window.innerWidth < 1200 ||
        window.innerWidth <= window.innerHeight
    ) {

        return;

    }


    /*
       Ukuran viewport sebenarnya
       yang diberikan browser TV.
    */

    const viewportHeight =
        window.innerHeight;


    /*
       Ambil posisi grid dari viewport.
    */

    const gridRect =
        grid.getBoundingClientRect();


    /*
       Tinggi area grid yang benar-benar
       tersedia.
    */

    let availableHeight =
        viewportHeight -
        gridRect.top -
        4;


    /*
       Safety margin.
    */

    availableHeight =
        Math.max(
            availableHeight,
            100
        );


    /*
       Jumlah rank aktual.
       Kalau 17, maka dibagi 17.
    */

    const total =
        cards.length;


    /*
       Gap antar card.
    */

    const gap =
        1;


    /*
       Total gap.
    */

    const totalGap =
        gap *
        Math.max(
            total - 1,
            0
        );


    /*
       Tinggi masing-masing card.
    */

    let cardHeight =
        (
            availableHeight -
            totalGap
        ) /
        total;


    /*
       Jangan sampai terlalu kecil.
       Untuk TV 43", biasanya masih
       jauh di atas angka ini.
    */

    cardHeight =
        Math.max(
            cardHeight,
            1
        );


    /*
       Terapkan langsung ke semua
       card Proteksi.
    */

    cards.forEach(
        card => {

            card.style.height =
                cardHeight +
                "px";

            card.style.minHeight =
                "0px";

            card.style.maxHeight =
                cardHeight +
                "px";

            card.style.flex =
                "0 0 " +
                cardHeight +
                "px";

        }
    );


    /*
       Pastikan grid tidak membuat
       scroll.
    */

    grid.style.height =
        availableHeight +
        "px";

    grid.style.maxHeight =
        availableHeight +
        "px";

    grid.style.overflow =
        "hidden";


    /*
       Jika masih ada selisih 1-2 px,
       kurangi sedikit tinggi semua card.
    */

    const actualHeight =
        Array.from(cards)
            .reduce(
                (
                    totalHeight,
                    card
                ) =>
                    totalHeight +
                    card.getBoundingClientRect()
                        .height,
                0
            );


    const actualGap =
        gap *
        Math.max(
            total - 1,
            0
        );


    const totalUsed =
        actualHeight +
        actualGap;


    if (
        totalUsed >
        availableHeight
    ) {

        const correction =
            (
                totalUsed -
                availableHeight
            ) /
            total;


        cards.forEach(
            card => {

                const newHeight =
                    Math.max(
                        cardHeight -
                        correction -
                        0.5,
                        1
                    );


                card.style.height =
                    newHeight +
                    "px";

                card.style.maxHeight =
                    newHeight +
                    "px";

                card.style.flex =
                    "0 0 " +
                    newHeight +
                    "px";

            }
        );

    }

}


/* =====================================================
   PARSE NUMBER
===================================================== */

function parseNumber(
    value
) {

    if (
        value === null ||
        value === undefined ||
        value === ""
    ) {

        return 0;

    }


    if (
        typeof value === "number"
    ) {

        return value;

    }


    let text =
        String(value)
            .trim();


    text =
        text.replace(
            /[^\d,.\-]/g,
            ""
        );


    if (
        text === ""
    ) {

        return 0;

    }


    if (
        text.includes(".") &&
        text.includes(",")
    ) {

        text =
            text
                .replace(
                    /\./g,
                    ""
                )
                .replace(
                    ",",
                    "."
                );

    }

    else if (
        text.includes(",")
    ) {

        const parts =
            text.split(",");


        if (
            parts.length === 2 &&
            parts[1].length <= 2
        ) {

            text =
                parts[0] +
                "." +
                parts[1];

        }

        else {

            text =
                text.replace(
                    /,/g,
                    ""
                );

        }

    }

    else if (
        text.includes(".")
    ) {

        const parts =
            text.split(".");


        if (
            !(
                parts.length === 2 &&
                parts[1].length <= 2
            )
        ) {

            text =
                text.replace(
                    /\./g,
                    ""
                );

        }

    }


    const number =
        parseFloat(
            text
        );


    return isNaN(number)
        ? 0
        : number;

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(
    text
) {

    const div =
        document.createElement(
            "div"
        );


    div.textContent =
        text;


    return div.innerHTML;

}


/* =====================================================
   ERROR
===================================================== */

function showError(
    gridId,
    message
) {

    const grid =
        document.getElementById(
            gridId
        );


    grid.innerHTML = `

        <div class="error">

            <b>
                Gagal mengambil data.
            </b>

            <br>

            <small>
                ${escapeHtml(
                    message
                )}
            </small>

        </div>

    `;

}


/* =====================================================
   GANTI SLIDE
===================================================== */

function nextSlide() {

    document
        .getElementById(
            "slide" +
            currentSlide
        )
        .classList
        .remove(
            "active"
        );


    currentSlide++;


    if (
        currentSlide > 3
    ) {

        currentSlide = 1;

    }


    document
        .getElementById(
            "slide" +
            currentSlide
        )
        .classList
        .add(
            "active"
        );


    /*
       Saat masuk slide Proteksi,
       hitung ulang ukuran card.
    */

    if (
        currentSlide === 2
    ) {

        requestAnimationFrame(
            () => {

                fitProteksiToScreen();

            }
        );

    }

}


/* =====================================================
   SLIDE 5 DETIK
===================================================== */

setInterval(
    nextSlide,
    SLIDE_DURATION
);

   LOAD DATA
===================================================== */

loadData();

   UPDATE DATA 30 DETIK
===================================================== */

setInterval(

   RESIZE TV / BROWSER
===================================================== */

window.addEventListener(
    "resize",
    () => {

        setTimeout(
            fitProteksiToScreen,
            100
        );

    }
);


/* =====================================================
   ORIENTATION CHANGE
===================================================== */

window.addEventListener(
    "orientationchange",
    () => {

        setTimeout(
            fitProteksiToScreen,
            300
        );

    }
);


/* =====================================================
   PERIODIC FIT
   Untuk browser TV yang viewport-nya
   berubah setelah halaman dibuka.
===================================================== */

setInterval(
    fitProteksiToScreen,
    1000
);
