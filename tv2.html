<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>AZKO SALES RANKING</title>

<style>

@font-face{
    font-family:'TTCommonsCondensed';
    src:url('https://putrasetya.github.io/font/TT%20Commons%20Pro%20Trial%20Condensed%20ExtraBold.woff2') format('woff2');
    font-weight:800;
    font-style:normal;
}

/* =====================================================
   RESET
===================================================== */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: 'Segoe UI', Arial, sans-serif;
}


/* =====================================================
   BODY
===================================================== */

body {

    width: 100vw;
    height: 100vh;

    background:
        linear-gradient(
            135deg,
            #dbe7ef 0%,
            #c9d7e1 100%
        );

    display: flex;
    justify-content: center;
    align-items: center;

    padding: 15px;

    overflow: hidden;
}


/* =====================================================
   CONTAINER
===================================================== */

.container {

    width: 100%;
    max-width: 900px;
    height: 100%;

    display: flex;
    flex-direction: column;

    justify-content: space-between;
}


/* =====================================================
   SLIDE
===================================================== */

.slide {

    width: 100%;
    height: 100%;

    display: none;
    flex-direction: column;
}


.slide.active {
    display: flex;
}


/* =====================================================
   HEADER
===================================================== */

.header {

    width: 100%;

    text-align: center;

    margin-bottom: 8px;
}

.title{
    font-family:'TTCommonsCondensed', Arial, sans-serif;
    font-weight:800;
    letter-spacing:3px;
    transform:scaleY(1.02);
}


/* =====================================================
   RANK GRID
===================================================== */

.rank-grid {

    display: flex;

    flex-direction: column;

    justify-content: flex-start;

    flex-grow: 1;

    gap: 2px;

    overflow: hidden;
}


/* =====================================================
   RANK CARD
===================================================== */

.rank-card {

    background: #ffffff;

    padding: 0 16px;

    height: 4.5vh;

    min-height: 30px;

    border-radius: 16px;

    display: flex;

    align-items: center;

    box-shadow:
        0 1px 4px rgba(15,23,42,0.08);

    font-size: 0.85rem;

    font-weight: 600;

    flex-shrink: 0;
}


/* =====================================================
   RANK 1
===================================================== */

.rank-card.rank-1 {

    background:
        linear-gradient(
            90deg,
            #fff9e6,
            #f9edbd
        );

    border:
        1px solid #e4bd58;

    box-shadow:
        0 2px 6px
        rgba(160,120,30,0.12);
}


/* =====================================================
   RANK 2
===================================================== */

.rank-card.rank-2 {

    background:
        linear-gradient(
            90deg,
            #f4f6f8,
            #e1e5e9
        );

    border:
        1px solid #aeb7c0;

    box-shadow:
        0 2px 6px
        rgba(80,90,100,0.10);
}


/* =====================================================
   RANK 3
===================================================== */

.rank-card.rank-3 {

    background:
        linear-gradient(
            90deg,
            #fff5e9,
            #f5ddc3
        );

    border:
        1px solid #d5a36a;

    box-shadow:
        0 2px 6px
        rgba(150,90,30,0.10);
}


/* =====================================================
   5 TERBAWAH
===================================================== */

.rank-card.bottom-5 {

    background:
        linear-gradient(
            90deg,
            #fff4f4,
            #f9dddd
        );

    border:
        1px solid #e7b1b1;
}


/* =====================================================
   RANK NUMBER
===================================================== */

.rank-num {

    width: 30px;

    color: #475569;

    font-weight: 700;

    flex-shrink: 0;
}


/* =====================================================
   CHANGE
===================================================== */

.change {

    width: 40px;

    font-size: 0.75rem;

    font-weight: 700;

    flex-shrink: 0;
}


.up {
    color: #16803c;
}


.down {
    color: #c53030;
}


.same {
    color: #8995a1;
}


/* =====================================================
   EMPLOYEE NAME
===================================================== */

.employee-name {

    flex-grow: 1;

    color: #17212b;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;
}


/* =====================================================
   SALES
===================================================== */

.sales {

    width: 110px;

    font-weight: 800;

    color: #17212b;

    margin-left: 10px;

    white-space: nowrap;

    text-align: right;

    flex-shrink: 0;
}


/* =====================================================
   ACH MTD
===================================================== */

.ach {

    width: 85px;

    font-weight: 800;

    color: #17212b;

    margin-left: 15px;

    white-space: nowrap;

    text-align: right;

    flex-shrink: 0;
}


/* =====================================================
   PROTEKSI
===================================================== */

.proteksi {

    width: 110px;

    font-weight: 800;

    color: #17212b;

    margin-left: 15px;

    white-space: nowrap;

    text-align: right;

    flex-shrink: 0;
}


/* =====================================================
   ACH PROTEKSI
===================================================== */

.ach-proteksi {

    width: 85px;

    font-weight: 800;

    color: #17212b;

    margin-left: 15px;

    white-space: nowrap;

    text-align: right;

    flex-shrink: 0;
}


/* =====================================================
   TRANSAKSI
===================================================== */

.transaksi {

    width: 110px;

    font-weight: 800;

    color: #17212b;

    margin-left: 15px;

    white-space: nowrap;

    text-align: right;

    flex-shrink: 0;
}


/* =====================================================
   ACH BULANAN
===================================================== */

.ach-bulanan {

    width: 85px;

    font-weight: 800;

    color: #17212b;

    margin-left: 15px;

    white-space: nowrap;

    text-align: right;

    flex-shrink: 0;
}


/* =====================================================
   LOADING / ERROR
===================================================== */

.loading,
.error {

    text-align: center;

    padding: 20px;

    font-weight: 600;
}


.loading {
    color: #52616d;
}


.error {
    color: #b83232;
}


/* =====================================================
   MOBILE / TABLET
===================================================== */

@media (
    max-width: 768px
),
(
    max-aspect-ratio: 1/1
) {

    body {

        height: auto;

        min-height: 100vh;

        overflow: auto;

        align-items: flex-start;
    }


    .container {

        height: auto;

        justify-content: flex-start;

        gap: 10px;
    }


    .title {

        font-size: 1.5rem;
    }


    .rank-grid {

        gap: 6px;

        overflow: visible;
    }


    .rank-card {

        height: 42px;

        font-size: 0.9rem;

        padding: 0 10px;
    }


    .rank-num {
        width: 28px;
    }


    .change {
        width: 38px;
    }


    .sales {
        width: 95px;
        margin-left: 8px;
    }


    .ach {
        width: 70px;
        margin-left: 10px;
    }


    .proteksi {
        width: 95px;
        margin-left: 8px;
    }


    .ach-proteksi {
        width: 70px;
        margin-left: 10px;
    }


    .transaksi {
        width: 95px;
        margin-left: 8px;
    }


    .ach-bulanan {
        width: 70px;
        margin-left: 10px;
    }

}


/* =====================================================
   TV 43 INCH
   TAMPILAN LEBIH NYAMAN UNTUK MATA
===================================================== */

@media screen and (min-width: 1200px) and (orientation: landscape) {

    body {

        background:
            linear-gradient(
                135deg,
                #d5e0e7 0%,
                #c5d2db 100%
            );

        padding: 10px;

    }


    .container {

        max-width: 1100px;

    }


    .header {

        margin-bottom: 5px;

    }


    .title {

        font-size: 1.8rem;

        color: #26343f;

    }


    .rank-grid {

        gap: 2px;

        overflow: hidden;

    }


    .rank-card {

        background: #fdfdfd;

        border-color: #d7dde2;

        box-shadow:
            0 1px 3px
            rgba(30,45,60,0.08);

        border-radius: 14px;

        color: #26343f;

    }


    .rank-card.rank-1 {

        background: #f9efca !important;

        border-color: #d9b957;

    }


    .rank-card.rank-2 {

        background: #e9edf0 !important;

        border-color: #aeb7bf;

    }


    .rank-card.rank-3 {

        background: #f5e1cc !important;

        border-color: #d3a477;

    }


    .rank-card.bottom-5 {

        background: #f8e4e4 !important;

        border-color: #dfb3b3;

    }


    .employee-name,
    .sales,
    .ach,
    .proteksi,
    .ach-proteksi,
    .transaksi,
    .ach-bulanan {

        color: #26343f;

    }


    .rank-num {

        color: #53616c;

    }


    .up {

        color: #19733a;

    }


    .down {

        color: #b93838;

    }


    .same {

        color: #7b8790;

    }


    /* =============================================
       PROTEKSI 17 RANK
       DIPAKSA MASUK SATU LAYAR TV
    ============================================= */

    #slide2 .rank-grid {

        height: calc(100vh - 75px);

        flex-grow: 0;

        gap: 2px;

        overflow: hidden;

    }


    #slide2 .rank-card {

        height:
            calc(
                (100vh - 75px - 32px)
                / 17
            );

        min-height: 0;

        max-height: none;

        flex-shrink: 0;

    }


    /* =============================================
       SLIDE 1 & 3
       MENYESUAIKAN JUMLAH RANK
    ============================================= */

    #slide1 .rank-card,
    #slide3 .rank-card {

        height: calc(
            (100vh - 75px - 32px)
            / 17
        );

        min-height: 0;

        flex-shrink: 0;

    }

}


/* =====================================================
   TV LEBIH KECIL
===================================================== */

@media screen
and (min-width: 1000px)
and (max-width: 1199px)
and (orientation: landscape) {

    .rank-card {

        height: 4.2vh;

    }

}


/* =====================================================
   TV EXTRA LARGE
===================================================== */

@media screen and (min-width: 1800px) and (orientation: landscape) {

    .container {

        max-width: 1250px;

    }


    .title {

        font-size: 2rem;

    }


    .rank-card {

        font-size: 0.9rem;

    }

}

</style>

</head>


<body>


<div class="container">


    <!-- =================================================
         SLIDE 1
         ACH MTD SALES ID
    ================================================== -->

    <div
        class="slide active"
        id="slide1"
    >

        <div class="header">

            <h1 class="title">
                ACH MTD SALES ID
            </h1>

        </div>


        <div
            class="rank-grid"
            id="rankGrid1"
        >

            <div class="loading">
                Memuat data...
            </div>

        </div>

    </div>


    <!-- =================================================
         SLIDE 2
         PROTEKSI
    ================================================== -->

    <div
        class="slide"
        id="slide2"
    >

        <div class="header">

            <h1 class="title">
                PROTEKSI
            </h1>

        </div>


        <div
            class="rank-grid"
            id="rankGrid2"
        >

            <div class="loading">
                Memuat data...
            </div>

        </div>

    </div>


    <!-- =================================================
         SLIDE 3
         TRANSAKSI
    ================================================== -->

    <div
        class="slide"
        id="slide3"
    >

        <div class="header">

            <h1 class="title">
                TRANSAKSI
            </h1>

        </div>


        <div
            class="rank-grid"
            id="rankGrid3"
        >

            <div class="loading">
                Memuat data...
            </div>

        </div>

    </div>


</div>


<script>

/* =====================================================
   GOOGLE SPREADSHEET
===================================================== */

const SPREADSHEET_ID =
    "16Alf0KUmqeaBx1zlsKfbcM5oPbzc18dBMgtlZYhP66M";


const SHEET_NAME =
    "Sheet1";


const SHEET_URL =

    "https://docs.google.com/spreadsheets/d/" +

    SPREADSHEET_ID +

    "/gviz/tq?tqx=out:json&sheet=" +

    encodeURIComponent(
        SHEET_NAME
    );


/* =====================================================
   SLIDE SETTINGS
===================================================== */

const SLIDE_DURATION =
    5000;


let currentSlide =
    1;


let employeeData =
    [];


/* =====================================================
   RANK CHANGE
===================================================== */

const rankingData = [

    {
        change: "same",
        changeText: "-"
    },

    {
        change: "same",
        changeText: "-"
    },

    {
        change: "up",
        changeText: "▲ 2"
    },

    {
        change: "same",
        changeText: "-"
    },

    {
        change: "up",
        changeText: "▲ 1"
    },

    {
        change: "up",
        changeText: "▲ 1"
    },

    {
        change: "down",
        changeText: "▼ 4"
    },

    {
        change: "same",
        changeText: "-"
    },

    {
        change: "same",
        changeText: "-"
    },

    {
        change: "up",
        changeText: "▲ 1"
    },

    {
        change: "down",
        changeText: "▼ 1"
    },

    {
        change: "same",
        changeText: "-"
    },

    {
        change: "up",
        changeText: "▲ 2"
    },

    {
        change: "down",
        changeText: "▼ 1"
    },

    {
        change: "same",
        changeText: "-"
    },

    {
        change: "up",
        changeText: "▲ 1"
    },

    {
        change: "down",
        changeText: "▼ 2"
    }

];


/* =====================================================
   LOAD DATA
===================================================== */

async function loadData() {

    try {

        const response =
            await fetch(
                SHEET_URL +
                "&t=" +
                Date.now()
            );


        if (!response.ok) {

            throw new Error(
                "Spreadsheet tidak dapat diakses."
            );

        }


        const text =
            await response.text();


        let jsonText =
            text.trim();


        jsonText =
            jsonText.replace(
                /^\/\*[\s\S]*?\*\/\s*/,
                ""
            );


        const start =
            jsonText.indexOf("{");


        const end =
            jsonText.lastIndexOf("}");


        if (
            start === -1 ||
            end === -1
        ) {

            throw new Error(
                "Format data Google Sheets tidak valid."
            );

        }


        jsonText =
            jsonText.substring(
                start,
                end + 1
            );


        const data =
            JSON.parse(
                jsonText
            );


        if (
            !data ||
            !data.table ||
            !data.table.cols
        ) {

            throw new Error(
                "Data spreadsheet tidak ditemukan."
            );

        }


        /* =============================================
           HEADER
        ============================================= */

        const employeeColumn =
            findColumn(
                data.table.cols,
                "EMPLOYEE NAME"
            );


        const codeJobColumn =
            findColumn(
                data.table.cols,
                "CODE JOB"
            );


        const salesColumn =
            findColumn(
                data.table.cols,
                "SALES MTD"
            );


        const achColumn =
            findColumn(
                data.table.cols,
                "ACH MTD"
            );


        const proteksiColumn =
            findColumn(
                data.table.cols,
                "PROTEKSI"
            );


        const achProteksiColumn =
            findColumn(
                data.table.cols,
                "ACH PROTEKSI"
            );


        const trxColumn =
            findColumn(
                data.table.cols,
                "TRX"
            );


        const achBulananColumn =
            findColumn(
                data.table.cols,
                "ACH BULANAN"
            );


        /* =============================================
           VALIDASI
        ============================================= */

        const requiredColumns = [

            [
                employeeColumn,
                "EMPLOYEE NAME"
            ],

            [
                codeJobColumn,
                "CODE JOB"
            ],

            [
                salesColumn,
                "SALES MTD"
            ],

            [
                achColumn,
                "ACH MTD"
            ],

            [
                proteksiColumn,
                "PROTEKSI"
            ],

            [
                achProteksiColumn,
                "ACH PROTEKSI"
            ],

            [
                trxColumn,
                "TRX"
            ],

            [
                achBulananColumn,
                "ACH BULANAN"
            ]

        ];


        for (
            const [
                index,
                header
            ]
            of requiredColumns
        ) {

            if (
                index === -1
            ) {

                throw new Error(
                    `Header "${header}" tidak ditemukan.`
                );

            }

        }


        /* =============================================
           DATA
        ============================================= */

        employeeData =

            data.table.rows

                .map(
                    row => {

                        if (
                            !row.c
                        ) {

                            return null;

                        }


                        const name =
                            getCellValue(
                                row.c[
                                    employeeColumn
                                ]
                            );


                        if (
                            name === ""
                        ) {

                            return null;

                        }


                        return {

                            name:
                                name,

                            codeJob:
                                getCellValue(
                                    row.c[
                                        codeJobColumn
                                    ]
                                ),

                            sales:
                                getCellValue(
                                    row.c[
                                        salesColumn
                                    ]
                                ),

                            ach:
                                getCellValue(
                                    row.c[
                                        achColumn
                                    ]
                                ),

                            proteksi:
                                getCellValue(
                                    row.c[
                                        proteksiColumn
                                    ]
                                ),

                            achProteksi:
                                getCellValue(
                                    row.c[
                                        achProteksiColumn
                                    ]
                                ),

                            trx:
                                getCellValue(
                                    row.c[
                                        trxColumn
                                    ]
                                ),

                            achBulanan:
                                getCellValue(
                                    row.c[
                                        achBulananColumn
                                    ]
                                )

                        };

                    }
                )

                .filter(
                    item =>
                        item !== null
                );


        renderSlide1();

        renderSlide2();

        renderSlide3();

    }


    catch (error) {

        console.error(
            error
        );


        showError(
            "rankGrid1",
            error.message
        );


        showError(
            "rankGrid2",
            error.message
        );


        showError(
            "rankGrid3",
            error.message
        );

    }

}


/* =====================================================
   CELL VALUE
===================================================== */

function getCellValue(
    cell
) {

    if (
        !cell
    ) {

        return "";

    }


    return String(
        cell.f ??
        cell.v ??
        ""
    ).trim();

}


/* =====================================================
   FIND COLUMN
===================================================== */

function findColumn(
    columns,
    target
) {

    return columns.findIndex(
        col =>

            String(
                col.label || ""
            )
            .trim()
            .toUpperCase() ===
            target.toUpperCase()
    );

}


/* =====================================================
   FILTER CASHIER / CS
===================================================== */

function isExcludedCodeJob(
    codeJob
) {

    const value =
        String(
            codeJob || ""
        )
        .trim()
        .toUpperCase();


    return (

        value === "CASHIER" ||

        value === "CS"

    );

}


/* =====================================================
   SLIDE 1
===================================================== */

function renderSlide1() {

    const data =

        employeeData

            .filter(
                employee =>
                    !isExcludedCodeJob(
                        employee.codeJob
                    )
            );


    data.sort(
        (a, b) =>

            parseNumber(
                b.ach
            ) -

            parseNumber(
                a.ach
            )
    );


    renderCards(
        "rankGrid1",
        data,
        "sales-ach"
    );

}


/* =====================================================
   SLIDE 2
   SEMUA EMPLOYEE
===================================================== */

function renderSlide2() {

    const data =
        [...employeeData];


    data.sort(
        (a, b) =>

            parseNumber(
                b.proteksi
            ) -

            parseNumber(
                a.proteksi
            )
    );


    renderCards(
        "rankGrid2",
        data,
        "proteksi"
    );

}


/* =====================================================
   SLIDE 3
===================================================== */

function renderSlide3() {

    const data =

        employeeData

            .filter(
                employee =>
                    !isExcludedCodeJob(
                        employee.codeJob
                    )
            );


    data.sort(
        (a, b) =>

            parseNumber(
                b.trx
            ) -

            parseNumber(
                a.trx
            )
    );


    renderCards(
        "rankGrid3",
        data,
        "transaksi"
    );

}


/* =====================================================
   RENDER CARDS
===================================================== */

function renderCards(
    gridId,
    data,
    type
) {

    const grid =
        document.getElementById(
            gridId
        );


    grid.innerHTML =
        "";


    if (
        data.length === 0
    ) {

        grid.innerHTML = `

            <div class="error">
                Tidak ada data employee.
            </div>

        `;

        return;

    }


    const total =
        data.length;


    data.forEach(
        (
            employee,
            index
        ) => {

            const rank =
                index + 1;


            let rankClass =
                "rank-card";


            if (
                rank === 1
            ) {

                rankClass +=
                    " rank-1";

            }

            else if (
                rank === 2
            ) {

                rankClass +=
                    " rank-2";

            }

            else if (
                rank === 3
            ) {

                rankClass +=
                    " rank-3";

            }

            else if (
                rank >
                total - 5
            ) {

                rankClass +=
                    " bottom-5";

            }


            const changeInfo =
                rankingData[index] || {

                    change:
                        "same",

                    changeText:
                        "-"

                };


            let valueHTML =
                "";


            /* =====================================
               SLIDE 1
            ===================================== */

            if (
                type ===
                "sales-ach"
            ) {

                valueHTML = `

                    <span class="sales">
                        ${escapeHtml(
                            employee.sales || "-"
                        )}
                    </span>

                    <span class="ach">
                        ${escapeHtml(
                            employee.ach || "-"
                        )}
                    </span>

                `;

            }


            /* =====================================
               SLIDE 2
            ===================================== */

            else if (
                type ===
                "proteksi"
            ) {

                valueHTML = `

                    <span class="proteksi">
                        ${escapeHtml(
                            employee.proteksi || "-"
                        )}
                    </span>

                    <span class="ach-proteksi">
                        ${escapeHtml(
                            employee.achProteksi || "-"
                        )}
                    </span>

                `;

            }


            /* =====================================
               SLIDE 3
            ===================================== */

            else if (
                type ===
                "transaksi"
            ) {

                valueHTML = `

                    <span class="transaksi">
                        ${escapeHtml(
                            employee.trx || "-"
                        )}
                    </span>

                    <span class="ach-bulanan">
                        ${escapeHtml(
                            employee.achBulanan || "-"
                        )}
                    </span>

                `;

            }


            const card =
                document.createElement(
                    "div"
                );


            card.className =
                rankClass;


            card.innerHTML = `

                <span class="rank-num">
                    ${rank}
                </span>

                <span
                    class="change ${changeInfo.change}"
                >
                    ${escapeHtml(
                        changeInfo.changeText
                    )}
                </span>

                <span class="employee-name">
                    ${escapeHtml(
                        employee.name
                    )}
                </span>

                ${valueHTML}

            `;


            grid.appendChild(
                card
            );

        }
    );

}


/* =====================================================
   PARSE NUMBER
===================================================== */

function parseNumber(
    value
) {

    if (
        value === null ||
        value === undefined ||
        value === ""
    ) {

        return 0;

    }


    if (
        typeof value === "number"
    ) {

        return value;

    }


    let text =
        String(value)
            .trim();


    text =
        text.replace(
            /[^\d,.\-]/g,
            ""
        );


    if (
        text === ""
    ) {

        return 0;

    }


    if (
        text.includes(".") &&
        text.includes(",")
    ) {

        text =
            text
                .replace(
                    /\./g,
                    ""
                )
                .replace(
                    ",",
                    "."
                );

    }

    else if (
        text.includes(",")
    ) {

        const parts =
            text.split(",");


        if (
            parts.length === 2 &&
            parts[1].length <= 2
        ) {

            text =
                parts[0] +
                "." +
                parts[1];

        }

        else {

            text =
                text.replace(
                    /,/g,
                    ""
                );

        }

    }

    else if (
        text.includes(".")
    ) {

        const parts =
            text.split(".");


        if (
            !(
                parts.length === 2 &&
                parts[1].length <= 2
            )
        ) {

            text =
                text.replace(
                    /\./g,
                    ""
                );

        }

    }


    const number =
        parseFloat(
            text
        );


    return isNaN(number)
        ? 0
        : number;

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(
    text
) {

    const div =
        document.createElement(
            "div"
        );


    div.textContent =
        text;


    return div.innerHTML;

}


/* =====================================================
   ERROR
===================================================== */

function showError(
    gridId,
    message
) {

    const grid =
        document.getElementById(
            gridId
        );


    grid.innerHTML = `

        <div class="error">

            <b>
                Gagal mengambil data.
            </b>

            <br>

            <small>
                ${escapeHtml(
                    message
                )}
            </small>

        </div>

    `;

}


/* =====================================================
   NEXT SLIDE
===================================================== */

function nextSlide() {

    document
        .getElementById(
            "slide" +
            currentSlide
        )
        .classList
        .remove(
            "active"
        );


    currentSlide++;


    if (
        currentSlide > 3
    ) {

        currentSlide =
            1;

    }


    document
        .getElementById(
            "slide" +
            currentSlide
        )
        .classList
        .add(
            "active"
        );

}
