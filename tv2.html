<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ACH MTD SALES ID</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Arial, sans-serif;
        }

        body {
            width: 100vw;
            height: 100vh;
            background: linear-gradient(135deg, #e0f2fe 0%, #bae6fd 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
            overflow: hidden;
        }

        .container {
            width: 100%;
            max-width: 900px;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .header {
            width: 100%;
            text-align: center;
            margin-bottom: 8px;
        }

        .title {
            font-size: 2rem;
            font-weight: 800;
            color: #0f172a;
            line-height: 1.1;
            letter-spacing: 1px;
        }

        .rank-grid {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            flex-grow: 1;
            gap: 2px;
        }

        .rank-card {
            background: white;
            padding: 0 16px;
            height: 4.5vh;
            border-radius: 20px;
            display: flex;
            align-items: center;
            box-shadow: 0 1px 4px rgba(0,0,0,0.04);
            font-size: 0.85rem;
            font-weight: 600;
        }

        /* =========================================
           RANK 1 - GOLD
        ========================================= */

        .rank-card.rank-1 {
            background: linear-gradient(
                90deg,
                #fffbeb 0%,
                #fef3c7 50%,
                #fde68a 100%
            );

            border: 1.5px solid #f59e0b;

            box-shadow:
                0 2px 8px rgba(245,158,11,0.18);
        }

        /* =========================================
           RANK 2 - SILVER
        ========================================= */

        .rank-card.rank-2 {
            background: linear-gradient(
                90deg,
                #f8fafc 0%,
                #e2e8f0 50%,
                #cbd5e1 100%
            );

            border: 1.5px solid #94a3b8;

            box-shadow:
                0 2px 8px rgba(100,116,139,0.15);
        }

        /* =========================================
           RANK 3 - BRONZE
        ========================================= */

        .rank-card.rank-3 {
            background: linear-gradient(
                90deg,
                #fff7ed 0%,
                #ffedd5 50%,
                #fed7aa 100%
            );

            border: 1.5px solid #d97706;

            box-shadow:
                0 2px 8px rgba(217,119,6,0.15);
        }

        /* =========================================
           5 TERBAWAH - MERAH
        ========================================= */

        .rank-card.bottom-5 {
            background: linear-gradient(
                90deg,
                #fef2f2 0%,
                #fee2e2 50%,
                #fecaca 100%
            );

            border: 1px solid #fca5a5;
        }

        /* =========================================
           RANK NUMBER
        ========================================= */

        .rank-num {
            width: 30px;
            color: #475569;
            font-weight: 700;
            flex-shrink: 0;
        }

        /* =========================================
           CHANGE
        ========================================= */

        .change {
            width: 40px;
            font-size: 0.75rem;
            font-weight: 700;
            flex-shrink: 0;
        }

        .up {
            color: #16a34a;
        }

        .down {
            color: #dc2626;
        }

        .same {
            color: #94a3b8;
        }

        /* =========================================
           EMPLOYEE NAME
        ========================================= */

        .employee-name {
            flex-grow: 1;
            color: #0f172a;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* =========================================
           SALES MTD
        ========================================= */

        .sales {
            width: 110px;
            font-weight: 800;
            color: #0f172a;
            margin-left: 10px;
            white-space: nowrap;
            text-align: right;
            flex-shrink: 0;
        }

        /* =========================================
           ACH MTD
        ========================================= */

        .ach {
            width: 85px;
            font-weight: 800;
            color: #0f172a;
            margin-left: 15px;
            white-space: nowrap;
            text-align: right;
            flex-shrink: 0;
        }

        /* =========================================
           LOADING / ERROR
        ========================================= */

        .loading,
        .error {
            text-align: center;
            padding: 20px;
            font-weight: 600;
        }

        .loading {
            color: #475569;
        }

        .error {
            color: #dc2626;
        }

        /* =========================================
           MOBILE / TABLET
        ========================================= */

        @media (max-width: 768px), (max-aspect-ratio: 1/1) {

            body {
                height: auto;
                min-height: 100vh;
                overflow: auto;
                align-items: flex-start;
            }

            .container {
                height: auto;
                justify-content: flex-start;
                gap: 10px;
            }

            .title {
                font-size: 1.5rem;
            }

            .rank-grid {
                gap: 6px;
            }

            .rank-card {
                height: 42px;
                font-size: 0.9rem;
                padding: 0 10px;
            }

            .rank-num {
                width: 28px;
            }

            .change {
                width: 38px;
            }

            .sales {
                width: 95px;
                margin-left: 8px;
            }

            .ach {
                width: 70px;
                margin-left: 10px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1 class="title">ACH MTD SALES ID</h1>
    </div>

    <div class="rank-grid" id="rankGrid">

        <div class="loading">
            Memuat data...
        </div>

    </div>

</div>


<script>

/* =====================================================
   GOOGLE SPREADSHEET
===================================================== */

const SPREADSHEET_ID =
    "16Alf0KUmqeaBx1zlsKfbcM5oPbzc18dBMgtlZYhP66M";


/* =====================================================
   NAMA SHEET
===================================================== */

const SHEET_NAME =
    "Sheet1";


/* =====================================================
   GOOGLE GVIZ URL
===================================================== */

const SHEET_URL =
    "https://docs.google.com/spreadsheets/d/" +
    SPREADSHEET_ID +
    "/gviz/tq?tqx=out:json&sheet=" +
    encodeURIComponent(SHEET_NAME);


/* =====================================================
   DATA PERUBAHAN RANK
   SEMENTARA
===================================================== */

const rankingData = [

    { change: "same", changeText: "-" },
    { change: "same", changeText: "-" },
    { change: "up", changeText: "▲ 2" },
    { change: "same", changeText: "-" },
    { change: "up", changeText: "▲ 1" },
    { change: "up", changeText: "▲ 1" },
    { change: "down", changeText: "▼ 4" },
    { change: "same", changeText: "-" },
    { change: "same", changeText: "-" },
    { change: "up", changeText: "▲ 1" },
    { change: "down", changeText: "▼ 1" },
    { change: "same", changeText: "-" },
    { change: "up", changeText: "▲ 2" },
    { change: "down", changeText: "▼ 1" },
    { change: "same", changeText: "-" },
    { change: "up", changeText: "▲ 1" },
    { change: "down", changeText: "▼ 2" }

];


/* =====================================================
   LOAD DATA GOOGLE SHEETS
===================================================== */

async function loadEmployeeData() {

    const rankGrid =
        document.getElementById("rankGrid");


    try {

        /* =============================================
           FETCH GOOGLE SHEETS
        ============================================= */

        const response =
            await fetch(
                SHEET_URL +
                "&t=" +
                Date.now()
            );


        if (!response.ok) {

            throw new Error(
                "Spreadsheet tidak dapat diakses."
            );

        }


        const text =
            await response.text();


        /* =============================================
           HAPUS HEADER GOOGLE GVIZ
        ============================================= */

        let jsonText =
            text.trim();


        jsonText =
            jsonText.replace(
                /^\/\*[\s\S]*?\*\/\s*/,
                ""
            );


        /* =============================================
           CARI JSON
        ============================================= */

        const start =
            jsonText.indexOf("{");


        const end =
            jsonText.lastIndexOf("}");


        if (
            start === -1 ||
            end === -1
        ) {

            throw new Error(
                "Format data Google Sheets tidak valid."
            );

        }


        jsonText =
            jsonText.substring(
                start,
                end + 1
            );


        /* =============================================
           PARSE JSON
        ============================================= */

        const data =
            JSON.parse(jsonText);


        /* =============================================
           VALIDASI DATA
        ============================================= */

        if (
            !data ||
            !data.table ||
            !data.table.cols
        ) {

            throw new Error(
                "Data spreadsheet tidak ditemukan."
            );

        }


        /* =============================================
           CARI HEADER EMPLOYEE NAME
        ============================================= */

        const employeeColumn =
            data.table.cols.findIndex(
                col =>

                    String(
                        col.label || ""
                    )
                    .trim()
                    .toUpperCase() ===
                    "EMPLOYEE NAME"
            );


        /* =============================================
           CARI HEADER SALES MTD
        ============================================= */

        const salesColumn =
            data.table.cols.findIndex(
                col =>

                    String(
                        col.label || ""
                    )
                    .trim()
                    .toUpperCase() ===
                    "SALES MTD"
            );


        /* =============================================
           CARI HEADER ACH MTD
        ============================================= */

        const achColumn =
            data.table.cols.findIndex(
                col =>

                    String(
                        col.label || ""
                    )
                    .trim()
                    .toUpperCase() ===
                    "ACH MTD"
            );


        /* =============================================
           VALIDASI EMPLOYEE NAME
        ============================================= */

        if (
            employeeColumn === -1
        ) {

            throw new Error(
                'Kolom "EMPLOYEE NAME" tidak ditemukan.'
            );

        }


        /* =============================================
           VALIDASI SALES MTD
        ============================================= */

        if (
            salesColumn === -1
        ) {

            throw new Error(
                'Kolom "SALES MTD" tidak ditemukan.'
            );

        }


        /* =============================================
           VALIDASI ACH MTD
        ============================================= */

        if (
            achColumn === -1
        ) {

            throw new Error(
                'Kolom "ACH MTD" tidak ditemukan.'
            );

        }


        /* =============================================
           AMBIL DATA
        ============================================= */

        const employeeData =
            data.table.rows
                .map(row => {

                    if (!row.c) {
                        return null;
                    }


                    /* =================================
                       EMPLOYEE NAME
                    ================================= */

                    const employeeCell =
                        row.c[employeeColumn];


                    const employeeName =
                        employeeCell
                            ? String(
                                employeeCell.f ??
                                employeeCell.v ??
                                ""
                            ).trim()
                            : "";


                    /* =================================
                       SALES MTD
                    ================================= */

                    const salesCell =
                        row.c[salesColumn];


                    const salesValue =
                        salesCell
                            ? (
                                salesCell.f ??
                                salesCell.v ??
                                ""
                            )
                            : "";


                    /* =================================
                       ACH MTD
                    ================================= */

                    const achCell =
                        row.c[achColumn];


                    const achValue =
                        achCell
                            ? (
                                achCell.f ??
                                achCell.v ??
                                ""
                            )
                            : "";


                    /* =================================
                       SKIP BARIS KOSONG
                    ================================= */

                    if (
                        employeeName === ""
                    ) {

                        return null;

                    }


                    return {

                        name:
                            employeeName,

                        sales:
                            salesValue,

                        ach:
                            achValue

                    };

                })
                .filter(
                    item =>
                        item !== null
                );


        /* =============================================
           VALIDASI DATA
        ============================================= */

        if (
            employeeData.length === 0
        ) {

            throw new Error(
                "Data EMPLOYEE NAME kosong."
            );

        }


        /* =============================================
           RENDER
        ============================================= */

        renderRanking(
            employeeData
        );


    } catch (error) {

        console.error(
            "Gagal mengambil data:",
            error
        );


        rankGrid.innerHTML = `

            <div class="error">

                <b>
                    Gagal mengambil data.
                </b>

                <br>

                <small>
                    ${escapeHtml(
                        error.message
                    )}
                </small>

            </div>

        `;

    }

}


/* =====================================================
   RENDER RANKING
===================================================== */

function renderRanking(
    employeeData
) {

    const rankGrid =
        document.getElementById(
            "rankGrid"
        );


    rankGrid.innerHTML =
        "";


    /* =============================================
       SORT BERDASARKAN ACH MTD
       TERBESAR → TERKECIL
    ============================================= */

    employeeData.sort(
        (a, b) => {

            const achA =
                parseAchValue(
                    a.ach
                );


            const achB =
                parseAchValue(
                    b.ach
                );


            return achB - achA;

        }
    );


    const total =
        employeeData.length;


    /* =============================================
       RENDER SETELAH SORTING
    ============================================= */

    employeeData.forEach(
        (employee, index) => {

            const rank =
                index + 1;


            /* =====================================
               CLASS RANK
            ===================================== */

            let rankClass =
                "rank-card";


            if (
                rank === 1
            ) {

                rankClass +=
                    " rank-1";

            }

            else if (
                rank === 2
            ) {

                rankClass +=
                    " rank-2";

            }

            else if (
                rank === 3
            ) {

                rankClass +=
                    " rank-3";

            }

            else if (
                rank > total - 5
            ) {

                rankClass +=
                    " bottom-5";

            }


            /* =====================================
               CHANGE RANK
            ===================================== */

            const changeInfo =
                rankingData[index] || {

                    change:
                        "same",

                    changeText:
                        "-"

                };


            /* =====================================
               SALES MTD
            ===================================== */

            const sales =
                employee.sales !== "" &&
                employee.sales !== null &&
                employee.sales !== undefined

                    ? employee.sales

                    : "-";


            /* =====================================
               ACH MTD
            ===================================== */

            const ach =
                employee.ach !== "" &&
                employee.ach !== null &&
                employee.ach !== undefined

                    ? employee.ach

                    : "-";


            /* =====================================
               CREATE CARD
            ===================================== */

            const card =
                document.createElement(
                    "div"
                );


            card.className =
                rankClass;


            card.innerHTML = `

                <span class="rank-num">
                    ${rank}
                </span>


                <span
                    class="change ${changeInfo.change}"
                >
                    ${escapeHtml(
                        changeInfo.changeText
                    )}
                </span>


                <span
                    class="employee-name"
                >
                    ${escapeHtml(
                        employee.name
                    )}
                </span>


                <span
                    class="sales"
                >
                    ${escapeHtml(
                        String(sales)
                    )}
                </span>


                <span
                    class="ach"
                >
                    ${escapeHtml(
                        String(ach)
                    )}
                </span>

            `;


            rankGrid.appendChild(
                card
            );

        }
    );

}


/* =====================================================
   PARSE ACH MTD
===================================================== */

function parseAchValue(
    value
) {

    if (
        value === null ||
        value === undefined ||
        value === ""
    ) {

        return 0;

    }


    /* =============================================
       JIKA SUDAH NUMBER
    ============================================= */

    if (
        typeof value === "number"
    ) {

        return value;

    }


    let text =
        String(value)
            .trim();


    /* =============================================
       HAPUS SIMBOL
    ============================================= */

    text =
        text.replace(
            /[^\d,.\-%]/g,
            ""
        );


    /* =============================================
       DETEKSI PERSENTASE
    ============================================= */

    const isPercent =
        text.includes("%");


    text =
        text.replace(
            "%",
            ""
        );


    /* =============================================
       FORMAT ANGKA
    ============================================= */

    if (
        text.includes(".") &&
        text.includes(",")
    ) {

        text =
            text
                .replace(/\./g, "")
                .replace(",", ".");

    }

    else if (
        text.includes(",")
    ) {

        const parts =
            text.split(",");


        if (
            parts.length === 2 &&
            parts[1].length <= 2
        ) {

            text =
                parts[0] +
                "." +
                parts[1];

        }

        else {

            text =
                text.replace(
                    /,/g,
                    ""
                );

        }

    }

    else if (
        text.includes(".")
    ) {

        const parts =
            text.split(".");


        if (
            parts.length === 2 &&
            parts[1].length <= 2
        ) {

            /* Desimal */

        }

        else {

            text =
                text.replace(
                    /\./g,
                    ""
                );

        }

    }


    let number =
        parseFloat(text);


    if (
        isNaN(number)
    ) {

        return 0;

    }


    /* =============================================
       GOOGLE SHEETS BISA MEMBERIKAN
       PERSENTASE SEBAGAI DESIMAL

       0.98715 → 98.715
    ============================================= */

    if (
        !isPercent &&
        number > 0 &&
        number < 1
    ) {

        number =
            number * 100;

    }


    return number;

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(
    text
) {

    const div =
        document.createElement(
            "div"
        );


    div.textContent =
        text;


    return div.innerHTML;

}


/* =====================================================
   LOAD PERTAMA
===================================================== */

loadEmployeeData();


/* =====================================================
   AUTO UPDATE 30 DETIK
===================================================== */

setInterval(
    loadEmployeeData,
    30000
);

</script>

</body>
</html>
