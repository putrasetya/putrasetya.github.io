<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>AZKO SALES RANKING</title>

<style>

/* =========================================================
   1. FONT
========================================================= */

@font-face{
    font-family:'TTCommonsCondensed';
    src:url('https://putrasetya.github.io/font/TT%20Commons%20Pro%20Trial%20Condensed%20ExtraBold.woff2')
        format('woff2');
    font-weight:800;
    font-style:normal;
}


/* =========================================================
   2. RESET
========================================================= */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    width:100%;
    height:100%;
}

body{
    overflow:hidden;
    font-family:'Segoe UI',Arial,sans-serif;
    background:
        radial-gradient(
            circle at 50% 35%,
            #12385b 0%,
            #08243d 45%,
            #041525 100%
        );
    color:#fff;
}


/* =========================================================
   3. MAIN CONTAINER
========================================================= */

.container{
    width:100%;
    max-width:900px;
    height:100vh;
    margin:0 auto;
    padding:12px 10px 10px;
    display:flex;
    flex-direction:column;
    justify-content:center;
}


/* =========================================================
   4. SLIDE SYSTEM
========================================================= */

.slide{
    display:none;
    width:100%;
    height:100%;
    flex-direction:column;
    justify-content:center;
}

.slide.active{
    display:flex;
}


/* =========================================================
   5. HEADER
========================================================= */

.header{
    visibility:hidden;
    text-align:center;
    margin-bottom:10px;
}

.header h1{
    font-family:'TTCommonsCondensed','Segoe UI',sans-serif;
    font-size:2rem;
    font-weight:800;
    letter-spacing:1px;
    line-height:1;
    text-transform:uppercase;
}

.header p{
    margin-top:3px;
    font-size:.8rem;
    opacity:.75;
}


/* =========================================================
   6. GENERAL RANKING GRID
========================================================= */

.rank-grid{
    width:100%;
    display:flex;
    flex-direction:column;
    gap:5px;
}


/* =========================================================
   7. GENERAL RANK CARD
========================================================= */

.rank-card{
    position:relative;
    width:100%;
    height:calc((100vh - 110px) / 10);

    display:flex;
    align-items:center;

    padding:0 12px 0 9px;

    border-radius:8px;

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.96),
            rgba(239,245,250,.96)
        );

    border:1px solid rgba(255,255,255,.18);

    box-shadow:
        0 3px 10px rgba(0,0,0,.28),
        inset 0 1px 0 rgba(255,255,255,.75);

    overflow:hidden;
}

.rank-card::before{
    content:"";
    position:absolute;
    left:0;
    top:0;
    bottom:0;
    width:5px;
    background:#1785d1;
}

.rank-card::after{
    content:"";
    position:absolute;
    inset:0;
    pointer-events:none;
    background:
        linear-gradient(
            90deg,
            rgba(255,255,255,.08),
            transparent 35%,
            transparent 70%,
            rgba(255,255,255,.04)
        );
}


/* =========================================================
   8. RANK 1 / 2 / 3
========================================================= */

.rank-card.rank-1{
    background:
        linear-gradient(
            135deg,
            #fff7d0,
            #f5d66d,
            #fff2b5
        );
    border-color:#e5bd43;
}

.rank-card.rank-1::before{
    background:
        linear-gradient(
            180deg,
            #fff1a8,
            #dcae24
        );
}

.rank-card.rank-2{
    background:
        linear-gradient(
            135deg,
            #f7f9fb,
            #cfd6dd,
            #ffffff
        );
    border-color:#b8c0c8;
}

.rank-card.rank-2::before{
    background:
        linear-gradient(
            180deg,
            #ffffff,
            #9da7b1
        );
}

.rank-card.rank-3{
    background:
        linear-gradient(
            135deg,
            #ffe8d1,
            #d99b63,
            #ffead5
        );
    border-color:#c7824e;
}

.rank-card.rank-3::before{
    background:
        linear-gradient(
            180deg,
            #ffd0a3,
            #a85d2c
        );
}


/* =========================================================
   9. BOTTOM 5
========================================================= */

.rank-card.bottom-5{
    background:
        linear-gradient(
            135deg,
            #5a1d27,
            #38151d
        );

    border-color:rgba(255,100,100,.25);
}

.rank-card.bottom-5::before{
    background:
        linear-gradient(
            180deg,
            #ff5f6d,
            #9e1f2d
        );
}

.rank-card.bottom-5 .rank-num,
.rank-card.bottom-5 .employee-name,
.rank-card.bottom-5 .sales,
.rank-card.bottom-5 .ach,
.rank-card.bottom-5 .proteksi,
.rank-card.bottom-5 .ach-proteksi,
.rank-card.bottom-5 .transaksi,
.rank-card.bottom-5 .ach-bulanan{
    color:#fff;
}


/* =========================================================
   10. RANK NUMBER
========================================================= */

.rank-num{
    width:36px;
    flex:0 0 36px;

    font-family:'TTCommonsCondensed','Segoe UI',sans-serif;
    font-size:1.15rem;
    font-weight:800;
    text-align:center;

    color:#172b3a;
}


/* =========================================================
   11. CHANGE INDICATOR
========================================================= */

.change{
    width:18px;
    flex:0 0 18px;
    margin-right:5px;

    font-size:.65rem;
    font-weight:800;
    text-align:center;
}

.change.up{
    color:#20a55a;
}

.change.down{
    color:#e53935;
}

.change.same{
    color:#8a949c;
}


/* =========================================================
   12. EMPLOYEE NAME
========================================================= */

.employee-name{
    min-width:0;
    flex:1;

    padding-left:4px;
    padding-right:8px;

    font-family:'TTCommonsCondensed','Segoe UI',sans-serif;
    font-size:.85rem;
    font-weight:800;

    color:#172b3a;

    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}


/* =========================================================
   13. GENERAL DATA VALUES
========================================================= */

.sales,
.ach,
.proteksi,
.ach-proteksi,
.transaksi,
.ach-bulanan{
    flex-shrink:0;

    font-family:'TTCommonsCondensed','Segoe UI',sans-serif;
    font-size:.85rem;
    font-weight:800;

    color:#172b3a;

    text-align:right;
    white-space:nowrap;
}


/* =========================================================
   14. DATA COLUMN WIDTH
========================================================= */

.sales{
    width:92px;
}

.ach{
    width:58px;
    margin-left:8px;
}

.proteksi{
    width:82px;
}

.ach-proteksi{
    width:58px;
    margin-left:8px;
}

.transaksi{
    width:68px;
}

.ach-bulanan{
    width:60px;
}


/* =========================================================
   15. SLIDE 4 - HEADER
========================================================= */

.score-column-header{
    width:100%;

    display:flex;
    align-items:center;

    margin-bottom:5px;
    padding:0 12px 0 9px;

    color:#ffffff;
}

.score-rank-head{
    width:36px;
    flex:0 0 36px;

    font-family:'TTCommonsCondensed',sans-serif;
    font-size:.85rem;
    font-weight:800;
    text-align:center;
}

.score-change-head{
    width:18px;
    flex:0 0 18px;
    margin-right:5px;
}

.score-name-head{
    min-width:0;
    flex:1;

    padding-left:4px;
    padding-right:8px;

    font-family:'TTCommonsCondensed',sans-serif;
    font-size:.85rem;
    font-weight:800;

    white-space:nowrap;
}

.score-month-head{
    width:55px;
    flex:0 0 55px;

    font-family:'TTCommonsCondensed',sans-serif;
    font-size:.85rem;
    font-weight:800;

    text-align:center;
}

.score-point-head{
    width:58px;
    flex:0 0 58px;

    font-family:'TTCommonsCondensed',sans-serif;
    font-size:.85rem;
    font-weight:800;

    text-align:right;
}


/* =========================================================
   16. SLIDE 4 - RANK CARD
========================================================= */

#slide4 .rank-grid{
    gap:4px;
}

#slide4 .rank-card{
    height:calc((100vh - 75px - 32px) / 17);

    padding:0 12px 0 9px;
}


/* =========================================================
   17. SLIDE 4 - EMPLOYEE NAME
========================================================= */

#slide4 .employee-name{

}


/* =========================================================
   18. SLIDE 4 - MONTH DATA
========================================================= */

.score-month{

    font-family:'TTCommonsCondensed',sans-serif;
    font-size:.85rem;
    font-weight:800;

/* =========================================================
   19. SLIDE 4 - POINT
========================================================= */

.score-point{

    font-weight:800;

/* =========================================================
   20. SLIDE 4 - ACH COLORS
========================================================= */

.ach-blue{

}

.ach-green{
    color:#149447;
}

.ach-yellow{
    color:#d59600;
}

.ach-red{
    color:#d52f35;
}


/* =========================================================
   21. SLIDE 4 - POINT BACKGROUND
========================================================= */

#slide4 .score-point{
    padding:3px 7px;
    border-radius:5px;

    background:
        linear-gradient(
            135deg,
            rgba(23,133,209,.18),
            rgba(23,133,209,.05)

}


/* Rank 1 point */

#slide4 .rank-1 .score-point{
    background:
        linear-gradient(
            135deg,
            #f5d66d,
            #fff1a7

    color:#6d5000;
}


/* Rank 2 point */

#slide4 .rank-2 .score-point{
    background:
        linear-gradient(
            135deg,
            #cbd2d9,
            #f7f9fb
        );

    color:#4c555d;
}


/* Rank 3 point */

#slide4 .rank-3 .score-point{
    background:
        linear-gradient(
            135deg,
            #d99b63,
            #ffe4c9
        );

    color:#693714;
}


/* Bottom 5 point */

#slide4 .bottom-5 .score-point{
    background:
        linear-gradient(
            135deg,
            #8d2634,
            #531923
        );

    color:#fff;
}


/* =========================================================
   22. SLIDE 4 - RIGHT ACCENT
========================================================= */

#slide4 .rank-card::after{
    content:"";

    position:absolute;
    top:0;
    right:0;
    bottom:0;

    width:3px;

    background:
        linear-gradient(
            180deg,
            rgba(23,133,209,.8),
            rgba(23,133,209,.15)

}


/* =========================================================
   23. LOADING
========================================================= */

.loading{
    display:flex;
    align-items:center;
    justify-content:center;

    width:100%;
    height:100%;

    font-family:'TTCommonsCondensed',sans-serif;
    font-size:1.2rem;
    font-weight:800;

    color:#fff;
}


/* =========================================================
   24. ERROR
========================================================= */

.error{
    padding:20px;

    font-size:.9rem;
    line-height:1.5;
    text-align:center;

    color:#ff8a8a;
}


/* =========================================================
   25. REALTIME CLOCK
========================================================= */

.realtime-clock{
    position:fixed;
    top:10px;
    right:14px;
    z-index:100;

    font-family:'TTCommonsCondensed','Segoe UI',sans-serif;
    font-size:1.1rem;
    font-weight:800;

    color:#fff;

    text-shadow:
        0 2px 5px rgba(0,0,0,.4);

    letter-spacing:.5px;
}

.realtime-date{
    display:none !important;
}


/* =========================================================
   26. SLIDE TABS
========================================================= */

.slide-tabs{
    position:fixed;
    top:8px;
    left:10px;
    z-index:100;

    display:flex;
    align-items:center;

    gap:4px;
}

.slide-tab{
    padding:5px 8px;

    border-radius:5px;

    font-family:'TTCommonsCondensed','Segoe UI',sans-serif;
    font-size:.62rem;
    font-weight:800;

    color:rgba(255,255,255,.58);

    background:rgba(255,255,255,.06);

    border:1px solid rgba(255,255,255,.08);

    white-space:nowrap;

    transition:
        background .2s ease,
        color .2s ease,
        transform .2s ease;
}

.slide-tab.active{
    color:#fff;

    background:
        linear-gradient(
            135deg,
            rgba(23,133,209,.9),
            rgba(13,91,150,.9)
        );

    border-color:rgba(255,255,255,.18);

    box-shadow:
        0 2px 8px rgba(0,0,0,.25);
}


/* =========================================================
   27. COMMON MONTH CLASSES
========================================================= */

.july,
.august,
.september,
.october,
.november,
.december,
.point{
    font-family:'TTCommonsCondensed',sans-serif;
    font-weight:800;
}


/* =========================================================
   28. HIDE CHANGE
========================================================= */

.change{
    display:none !important;
}

.rank-card{
    padding-left:9px;
}

.rank-num{
    margin-right:3px;
}

/* =====================================================
   CELL VALUE
===================================================== */

function getCellValue(cell){

    if(!cell){

        return "";

    }


    return String(
        cell.f ??
        cell.v ??
        ""
    ).trim();

}


function findColumn(columns,target){

    const normalizeHeader =
        value => {

            return String(
                value || ""
            )
            .replace(
                /\u00A0/g,
                " "
            )
            .replace(
                /\s+/g,
                " "
            )
            .trim()
            .toUpperCase();

        };


    const targetHeader =
        normalizeHeader(target);


    return columns.findIndex(
        col =>
            normalizeHeader(
                col.label
            ) ===
            targetHeader
    );

}

/* =====================================================
   NORMALIZE NAMA
===================================================== */

function normalizeEmployeeName(name){

    return String(
        name || ""
    )
    .trim()
    .replace(
        /\s+/g,
        " "
    )
    .toUpperCase();

}


/* =====================================================
   ACH CLASS
===================================================== */

function getAchClass(value){

    if(
        value === null ||
        value === undefined ||
        value === "" ||
        value === "-"
    ){

        return "";

    }


    let text =
        String(value)
            .replace("%","")
            .replace(",",".")
            .trim();


    let percentage =
        parseFloat(text);


    if(isNaN(percentage)){

        return "";

    }


    if(percentage > 100){

        return "ach-blue";

    }


    if(percentage >= 95){

        return "ach-green";

    }


    if(percentage > 85){

        return "ach-yellow";

    }


    return "ach-red";

}


/* =====================================================
   HITUNG POIN
===================================================== */

function calculateMonthlyPoint(monthlyData){

    if(!monthlyData){

        return 0;

    }


    let point = 0;


    const ach =
        parseNumber(
            monthlyData.ach
        );


    const hasAch =
        monthlyData.ach !== "" &&
        monthlyData.ach !== "-";


    if(hasAch){

        if(ach < 85){

            point -= 1;

        }

        else if(
            ach >= 85 &&
            ach < 95
        ){

            point += 1;

        }

        else if(
            ach >= 95 &&
            ach <= 100
        ){

            point += 2;

        }

        else if(
            ach > 100
        ){

            point += 3;

        }

    }


    const trxMtd =
        parseNumber(
            monthlyData.trxMtd
        );


    const targetTrx =
        parseNumber(
            monthlyData.targetTrx
        );


    const hasTrx =
        monthlyData.trxMtd !== "" &&
        monthlyData.trxMtd !== "-" &&
        monthlyData.targetTrx !== "" &&
        monthlyData.targetTrx !== "-";


    if(hasTrx){

        if(
            trxMtd >
            targetTrx
        ){

            point += 1;

        }

    }


    const basketSize =
        parseNumber(
            monthlyData.basketSize
        );


    const targetBs =
        parseNumber(
            monthlyData.targetBs
        );


    const hasBasket =
        monthlyData.basketSize !== "" &&
        monthlyData.basketSize !== "-" &&
        monthlyData.targetBs !== "" &&
        monthlyData.targetBs !== "-";


    if(hasBasket){

        if(
            basketSize >
            targetBs
        ){

            point += 1;

        }

    }


    return point;

}

                document.createElement(
                    "div"
                );


            card.className =
                rankClass;


            card.innerHTML = `

                <span class="rank-num">
                    ${rank}
                </span>

                <span
                    class="change ${changeInfo.change}"
                >
                    ${escapeHtml(
                        changeInfo.changeText
                    )}
                </span>

                <span class="employee-name">
                    ${escapeHtml(
                        employee.name
                    )}
                </span>

                ${valueHTML}

            `;


            grid.appendChild(
                card
            );

        }
    );

}


/* =====================================================
   PARSE NUMBER
===================================================== */

function parseNumber(value){

    if(
        value === null ||
        value === undefined ||
        value === ""
    ){

        return 0;

    }


    if(
        typeof value === "number"
    ){

        return value;

    }


    let text =
        String(value)
            .trim()
            .replace(
                /\u00A0/g,
                " "
            )
            .replace(
                /%/g,
                ""
            )
            .replace(
                /Rp/gi,
                ""
            )
            .replace(
                /\s/g,
                ""
            );


    if(
        text === "" ||
        text === "-"
    ){

        return 0;

    }


    if(
        text.includes(",") &&
        text.includes(".")
    ){

        text =
            text
                .replace(/\./g,"")
                .replace(",", ".");

    }

    else if(
        text.includes(",")
    ){

        const parts =
            text.split(",");


        if(
            parts.length === 2 &&
            parts[1].length <= 2
        ){

            text =
                parts[0] +
                "." +
                parts[1];

        }

        else{

            text =
                text.replace(
                    /,/g,
                    ""
                );

        }

    }

    else if(
        text.includes(".")
    ){

        const parts =
            text.split(".");


        if(
            parts.length === 2 &&
            parts[1].length <= 2
        ){

        }

        else{

            text =
                text.replace(
                    /\./g,
                    ""
                );

        }

    }


    const number =
        parseFloat(text);


    return isNaN(number)
        ? 0
        : number;

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(text){

    const div =
        document.createElement(
            "div"
        );


    div.textContent =
        text;


    return div.innerHTML;

}

/* =====================================================
   NEXT SLIDE
===================================================== */

function nextSlide(){

    document
        .getElementById(
            "slide" +
            currentSlide
        )
        .classList
        .remove(
            "active"
        );


    currentSlide++;


    if(
        currentSlide > 4
    ){

        currentSlide = 1;

    }


    document
        .getElementById(
            "slide" +
            currentSlide
        )
        .classList
        .add(
            "active"
        );


    updateSlideTabs();

}


/* =====================================================
   UPDATE TAB
===================================================== */

function updateSlideTabs(){

    document
        .querySelectorAll(
            '.slide-tab'
        )
        .forEach(
            tab =>
                tab.classList.remove(
                    'active'
                )
        );


    const activeTab =
        document.querySelector(
            `.slide-tab[data-slide="${currentSlide}"]`
        );


    if(activeTab){

        activeTab.classList.add(
            'active'
        );

    }

}


/* =====================================================
   TAB CLICK
===================================================== */

document
    .querySelectorAll(
        '.slide-tab'
    )
    .forEach(
        tab => {

            tab.style.cursor =
                'pointer';


            tab.addEventListener(
                'click',
                () => {

                    const targetSlide =
                        parseInt(
                            tab.dataset.slide
                        );


                    if(
                        targetSlide ===
                        currentSlide
                    ){

                        return;

                    }


                    document
                        .getElementById(
                            "slide" +
                            currentSlide
                        )
                        .classList
                        .remove(
                            "active"
                        );


                    currentSlide =
                        targetSlide;


                    document
                        .getElementById(
                            "slide" +
                            currentSlide
                        )
                        .classList
                        .add(
                            "active"
                        );


                    updateSlideTabs();


                    startSlideTimer();

                }
            );

        }
    );


/* =====================================================
   SLIDE TIMER
===================================================== */

let slideTimer;


function startSlideTimer(){

    clearInterval(
        slideTimer
    );


    slideTimer =
        setInterval(
            nextSlide,
            SLIDE_DURATION
        );

}


startSlideTimer();

/* =====================================================
   CLOCK
===================================================== */

function updateClock(){

    const now =
        new Date();


    const hours =
        String(
            now.getHours()
        ).padStart(
            2,
            '0'
        );


    const minutes =
        String(
            now.getMinutes()
        ).padStart(
            2,
            '0'
        );


    const seconds =
        String(
            now.getSeconds()
        ).padStart(
            2,
            '0'
        );


    document.getElementById(
        'realtimeClock'
    ).textContent =

        `${hours}:${minutes}:${seconds}`;

}


updateClock();


setInterval(
    updateClock,
    1000
);


/* =====================================================
   DATE
===================================================== */

function updateDate(){

    const now =
        new Date();


    const options = {

        weekday:'long',

        day:'numeric',

        month:'long',

        year:'numeric'

    };


    const date =
        now.toLocaleDateString(
            'id-ID',
            options
        );


    document.getElementById(
        'realtimeDate'
    ).textContent =
        date;

}


updateDate();


setInterval(
    updateDate,
    1000
);
