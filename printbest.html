<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AZKO Award Generator</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
padding:20px;
background:#111;
font-family:Arial,sans-serif;
}

.container{
display:flex;
gap:30px;
justify-content:center;
flex-wrap:wrap;
}


.panel{
background:#222;
color:white;
padding:20px;
width:330px;
border-radius:15px;
}


h2{
text-align:center;
color:#ffd400;
}


input,select,button{

width:100%;
height:45px;
margin-bottom:12px;
border-radius:8px;
border:none;
padding:10px;
font-weight:bold;

}


button{

background:#e60000;
color:white;
cursor:pointer;

}

.card{

width:12.5cm;
height:18cm;
background:white;
border:1px solid #ddd;
position:relative;
text-align:center;
overflow:hidden;

}

.photo{

width:7cm;
height:7cm;

margin-top:30px;

border-radius:50%;
object-fit:cover;
background:#ddd;

}

.nilai{

font-size:40px;
font-weight:900;
margin-top:20px;

}

.nama{

font-size:25px;
font-weight:900;
margin-top:15px;

}



.input-group{
display:flex;
gap:10px;
margin-bottom:10px;
}

.input-card{
flex:1;
}

.input-card h3{
color:#ffd400;
font-size:14px;
margin:5px 0;
text-align:center;
}

/* ===== UPDATE A4 LANDSCAPE ===== */


.sheet{

width:297mm !important;
height:210mm !important;

background:white;

padding:1.5cm;

display:flex;

justify-content:center;

align-items:center;

gap:1.7cm;

margin:auto;

overflow:hidden;

}
@page{
size:A4 landscape;
margin:0;
}

@media print{

html,
body{
width:297mm;
height:210mm;
margin:0;
padding:0;
background:white;
}

.panel{
display:none !important;
}

.container{
display:block !important;
}

}

</style>

</head>


<body>


<div class="container">


<div class="panel">

<h2>
AWARD GENERATOR
</h2>


<select id="jenis">

<option value="SALES">
BEST SALES
</option>

<option value="PROTEKSI">
BEST PROTEKSI
</option>

<option value="TRANSAKSI">
BEST TRANSAKSI
</option>

</select>

<div class="input-group">

<div class="input-card">

<h3>CARD 1</h3>

<input id="namaInput1" placeholder="Nama Sales">

<input id="angkaInput1" placeholder="Angka">

</div>


<div class="input-card">

<h3>CARD 2</h3>

<input id="namaInput2" placeholder="Nama Sales">

<input id="angkaInput2" placeholder="Angka">

</div>

</div>


<button onclick="generate()">
GENERATE
</button>


<button onclick="printA4()">
PRINT A4 LANDSCAPE
</button>


<button onclick="downloadPNG()">
DOWNLOAD PNG
</button>


</div>



<div id="sheet" class="sheet">


<div class="card">

<img id="foto1" class="photo">

<div id="nama1" class="nama">
NAMA
</div>

<div id="nilai1" class="nilai">
0
</div>

</div>



<div class="card">

<img id="foto2" class="photo">

<div id="nama2" class="nama">
NAMA
</div>

<div id="nilai2" class="nilai">
0
</div>

</div>


</div>


</div>




<script>


const people=[

{
keywords:["PUTRA","put"],
name:"PUTRA SETYA",
photo:""
},

{
keywords:["AFI","avi"],
name:"AFI",
photo:""
}

];



function cariFoto(nama){

nama=nama.toUpperCase();

return people.find(p=>
p.keywords.some(k=>
nama.includes(k.toUpperCase())
)
);

}



function formatNilai(jenis,angka){

angka=String(angka || "0")
.replace(/[^0-9]/g,"");


if(jenis=="SALES"){

return (angka/1000000)
.toFixed(1)
.replace(".",",")
+" JT";

}


if(jenis=="PROTEKSI"){

return angka+" PROTEKSI";

}


return angka+" TRANSAKSI";


}



function generate(){

let jenis=document.getElementById("jenis").value;


for(let i=1;i<=2;i++){

let nama=document.getElementById("namaInput"+i).value;

let angka=document.getElementById("angkaInput"+i).value;


let data=cariFoto(nama);


let namaFix=nama.toUpperCase();

let foto="";


if(data){

namaFix=data.name;
foto=data.photo;

}


document.getElementById("foto"+i).src=foto;

document.getElementById("nama"+i).innerHTML=namaFix;

document.getElementById("nilai"+i).innerHTML=
formatNilai(jenis,angka);


}

}

async function downloadPNG(){

let canvas=await html2canvas(
document.getElementById("sheet"),
{
scale:3
}
);


let a=document.createElement("a");

a.download="AZKO_AWARD.png";

a.href=canvas.toDataURL();

a.click();

}


function printA4(){

const style=document.createElement("style");

style.innerHTML=`
@page{
size:A4 landscape;
margin:0;
}
`;

document.head.appendChild(style);

window.print();

}
</script>


</body>
</html>
