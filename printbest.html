<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AZKO Award Generator</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
padding:20px;
background:#111;
font-family:Arial,sans-serif;
}

.container{
display:flex;
gap:30px;
justify-content:center;
flex-wrap:wrap;
}


.panel{
background:#222;
color:white;
padding:20px;
width:330px;
border-radius:15px;
}


h2{
text-align:center;
color:#ffd400;
}


input,select,button{

width:100%;
height:45px;
margin-bottom:12px;
border-radius:8px;
border:none;
padding:10px;
font-weight:bold;

}


button{

background:#e60000;
color:white;
cursor:pointer;

}


.card{

width:12.5cm;
height:18cm;
background:white;

border:3px solid #000; /* lebih tebal */

position:relative;
text-align:center;
overflow:hidden;

}
    
.photo{

width:7cm;
height:7cm;

margin-top:30px;

border-radius:50%;
object-fit:cover;
background:#ddd;

}

.nilai{
    font-family:"FranklinDemi", Arial, sans-serif;
    font-size:55px;
    font-weight:900;
    margin-top:20px;
    letter-spacing:1px;
}

.nama{
    font-family:"FranklinDemi", Arial, sans-serif;
    font-size:50px;
    font-weight:900;
    margin-top:15px;
    letter-spacing:1px;
}



.input-group{
display:flex;
gap:10px;
margin-bottom:10px;
}

.input-card{
flex:1;
}

.input-card h3{
color:#ffd400;
font-size:14px;
margin:5px 0;
text-align:center;
}

/* ===== UPDATE A4 LANDSCAPE ===== */


.sheet{

width:297mm !important;
height:210mm !important;

background:white;

padding:1.5cm;

display:flex;

justify-content:center;

align-items:center;

gap:1.7cm;

margin:auto;

overflow:hidden;

}
@page{
size:A4 landscape;
margin:0;
}

@media print{

html,
body{
width:297mm;
height:210mm;
margin:0;
padding:0;
background:white;
}

.panel{
display:none !important;
}

.container{
display:block !important;
}

}

@media print{

.card{
    border:3px solid #000 !important;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
}

.sheet{
    width:297mm !important;
    height:210mm !important;
}

}

@font-face{
    font-family:"FranklinDemi";
    src:url("font/ITC Franklin Gothic Demi Compressed.otf") format("opentype");
    font-weight:normal;
    font-style:normal;
}


.nama,
.nilai{
    font-family:"FranklinDemi", Arial, sans-serif;
}
</style>

</head>


<body>


<div class="container">


<div class="panel">

<h2>
AWARD GENERATOR
</h2>


<select id="jenis" onchange="cekJenis()">

<option value="SALES">
BEST SALES
</option>

<option value="PROTEKSI">
BEST PROTEKSI
</option>

<option value="TRANSAKSI">
BEST TRANSAKSI
</option>

</select>

<div class="input-group">

<div class="input-card">

<h3>CARD 1</h3>

<input id="namaInput1" placeholder="Nama Sales">

<input id="angkaInput1" placeholder="Angka">

</div>


<div class="input-card">

<h3>CARD 2</h3>

<input id="namaInput2" placeholder="Nama Sales">

<input id="angkaInput2" placeholder="Angka">

</div>

</div>


<button onclick="generate()">
GENERATE
</button>


<button onclick="printA4()">
PRINT A4 LANDSCAPE
</button>


<button onclick="downloadPNG()">
DOWNLOAD PNG
</button>


</div>



<div id="sheet" class="sheet">


<div class="card">

<img id="foto1" class="photo">

<div id="nama1" class="nama">
NAMA
</div>

<div id="nilai1" class="nilai">
0
</div>

</div>



<div class="card">

<img id="foto2" class="photo">

<div id="nama2" class="nama">
NAMA
</div>

<div id="nilai2" class="nilai">
0
</div>

</div>


</div>


</div>




<script>



const people=[

{
keywords:["Avif"],
photo:"https://lh3.googleusercontent.com/d/12pjk_-ZJhbqbPZDzdH4sJSkE5qWwzrf7=w1000"
},

{
keywords:["PUTRA","put"],
photo:"https://lh3.googleusercontent.com/d/1Pxw-wIUKTcyA_inIcqpYY833f_3AtZe2=w1000"
},

{
keywords:["GO","gh","GHO","GHOFUR"],
photo:"https://lh3.googleusercontent.com/d/13OG6tf86ZIg6uUIn0yU6TwqweCSkLNfw=w1000"
},

{
keywords:["hep","hap"],
photo:"https://lh3.googleusercontent.com/d/16tuEFyNqC9DqdLtx7sjjEd8RsGKegskG=w1000"
},

{
keywords:["imam","pak imam"],
photo:"https://lh3.googleusercontent.com/d/1kMjqQ1keHMCqwRAFk9yzZJoLDexL4QU9=w1000"
},

{
keywords:["ja","mus"],
photo:"https://lh3.googleusercontent.com/d/11jXuXx1onUlvJ3ULT351x90BVKH_47GF=w1000"
},

{
keywords:["arip","arif"],
photo:"https://lh3.googleusercontent.com/d/1HYYysdMbzW89vpo_YI7_E-mwfbxXT6lW=w1000"
},

{
keywords:["arc"],
photo:"https://lh3.googleusercontent.com/d/1bFl3Jy3m1PrpD7dVoPvo_Ks3JM_4hNY7=w1000"
},

{
keywords:["sho"],
photo:"https://lh3.googleusercontent.com/d/1qszknso1K93EsFJdKc07dCatTg4B51Gz=w1000"
},

{
keywords:["pak nafi","nafi"],
photo:"https://lh3.googleusercontent.com/d/11XA9MyqVHh5TlnWnRRUrs6T92fwx5tIb=w1000"
},

{
keywords:["rifa","pai"],
photo:"https://lh3.googleusercontent.com/d/1Op2tYuOs8SNbBLnfcmztcij-_h4q1B1M=w1000"
},

{
keywords:["bud"],
photo:"https://lh3.googleusercontent.com/d/1s3OEJyXr-_i5p8D0hKw-aCCbcgLQwWxi=w1000"
},

{
keywords:["sali"],
photo:"https://lh3.googleusercontent.com/d/1O4U8DkXFf77qJjzXx4VNvnkVHQDu6gnt=w1000"
},

{
keywords:["lul"],
photo:"https://lh3.googleusercontent.com/d/1fGkhYA-LcBd2M086mMGgjCgnH0SyHqUH=w1000"
},

{
keywords:["rah","ima"],
photo:"https://lh3.googleusercontent.com/d/1tNq1Uah-5x5_kPkujr1gCR5jiLuKrGQQ=w1000"
},

{
keywords:["sher"],
photo:"https://lh3.googleusercontent.com/d/1ocD_L6dq5XcleWt1AIBQeA8iUJ2xKNUn=w1000"
}

];


function cariFoto(nama){

let text = nama.toUpperCase().trim();

let words = text.split(/\s+/);

for(let p of people){

    for(let k of p.keywords){

        let key = k.toUpperCase().trim();

        for(let w of words){

            if(
                w.startsWith(key) &&
                w.length >= key.length
            ){
                return p.photo;
            }

        }

    }

}

return "";

}


function formatNilai(jenis,angka){

angka = Number(
String(angka || "0")
.replace(/[^0-9]/g,"")
);


if(jenis=="SALES"){

let juta = angka / 1000000;

let hasil = juta.toFixed(1)
.replace(".",",");

hasil = hasil.replace(",0","");

return hasil + " JT";

}


if(jenis=="PROTEKSI"){

return angka.toLocaleString("id-ID") + " PROTEKSI";

}


if(jenis=="TRANSAKSI"){

return angka.toLocaleString("id-ID") + " TRANSAKSI";

}


return "0";

}

function formatInputRupiah(input){

let angka = input.value.replace(/[^0-9]/g,"");

if(angka){
    input.value = Number(angka).toLocaleString("id-ID");
}else{
    input.value = "";
}

}


function cekJenis(){

let jenis = document.getElementById("jenis").value;

let inputs=[
document.getElementById("angkaInput1"),
document.getElementById("angkaInput2")
];


inputs.forEach(input=>{

    input.value="";

    if(jenis=="SALES"){

        input.placeholder="Nominal Rupiah";

        input.oninput=function(){
            formatInputRupiah(this);
        };

    }else{

        input.placeholder="Angka";

        input.oninput=null;

    }

});

}    
function generate(){

let jenis=document.getElementById("jenis").value;


for(let i=1;i<=2;i++){

let nama=document.getElementById("namaInput"+i).value;

let angka=document.getElementById("angkaInput"+i).value;



let foto=cariFoto(nama);

let namaFix=nama.toUpperCase();
  
let nilai=formatNilai(jenis,angka);

document.getElementById("nilai"+i).innerHTML = nilai;
    
document.getElementById("foto"+i).src=foto;

document.getElementById("nama"+i).innerHTML=namaFix;


}

}

async function downloadPNG(){

await document.fonts.ready;

let canvas=await html2canvas(
document.getElementById("sheet"),
{
    scale:3
}
);

let a=document.createElement("a");

a.download="AZKO_AWARD.png";

a.href=canvas.toDataURL();

a.click();

}


function printA4(){

const style=document.createElement("style");

style.innerHTML=`
@page{
size:A4 landscape;
margin:0;
}
`;

document.head.appendChild(style);

window.print();

}

document.addEventListener("DOMContentLoaded", function(){
    cekJenis();
});
</script>


</body>
</html>
