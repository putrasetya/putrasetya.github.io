<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Fullscreen Image</title>

<style>
html, body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
}

.container{
    width:100vw;
    height:100vh;
    overflow:hidden;
}

.container img{
    width:100%;
    height:100%;
    object-fit:cover;
    animation:zoomIn 3s ease-out forwards;
    transform-origin:center center;
}

@keyframes zoomIn{
    from{
        transform:scale(1.3);
    }
    to{
        transform:scale(1);
    }
}
</style>
</head>
<body>

<div class="container">
    <img src="https://putrasetya.github.io/20260906_203944.png" alt="Background">
</div>

</body>
</html>
